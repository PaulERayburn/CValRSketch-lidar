    <div class="modal-buttons">
      <button onclick="closeModal()">Cancel</button>
      <button id="prev-save-svg">Save SVG</button>
      <button class="primary" id="prev-save-png">Save PNG</button>
    </div>`;
  m.appendChild(div);
  const sel = div.querySelector('#prev-page-size');
  sel.value = s.exportPageSize || 'auto';
  const laySel = div.querySelector('#prev-layout');
  laySel.value = s.exportLayout || 'active';
  const bSel = div.querySelector('#prev-buildings');
  const present = buildingsPresent();
  // Which building(s) the export covers. 'view' = whatever the canvas shows now.
  const exportTargets = () => {
    const v = bSel ? bSel.value : 'view';
    if (v === 'each') return present;
    if (v === 'view') return [viewBuildingOrAll()];
    return [v];
  };
  const buildFor = b => (b === 'all' ? svgForExport() : withBuildingRendered(b, svgForExport));
  const draw = () => {
    s.exportPageSize = sel.value;
    s.exportLayout = laySel.value;
    // Multi-floor layouts draw every floor with its own dims, so the surfacing row is moot.
    div.querySelector('#prev-dimrow').style.display = s.exportLayout === 'active' ? '' : 'none';
    s.exportIncludeTitle = div.querySelector('#prev-title').checked;
    s.exportIncludeLegend = div.querySelector('#prev-legend').checked;
    if (div.querySelector('#prev-detail')) s.showDetail = div.querySelector('#prev-detail').checked;
    s.ghostDimFloors = [...div.querySelectorAll('[data-dimfloor]')]
      .filter(cb => cb.checked && !cb.disabled).map(cb => cb.dataset.dimfloor);
    saveSettings();
    render();  // refresh the live canvas so the clone reflects the dimension-floor choices
    const area = div.querySelector('#prev-area');
    area.innerHTML = '';
    let svgEl;
    const targets = exportTargets();
    try { svgEl = buildFor(targets[0]); } catch (e) { area.textContent = 'Preview error: ' + e.message; return; }
    finally { render(); }
    if (targets.length > 1) {
      const note = document.createElement('div');
      note.style.cssText = 'font-size:11px; color:#555; margin-bottom:6px;';
      note.textContent = 'Preview shows ' + targets[0] + '. Save writes ' + targets.length + ' files, one per building.';
      area.appendChild(note);
    }
    const w = parseFloat(svgEl.getAttribute('width')), h = parseFloat(svgEl.getAttribute('height'));
    const scale = Math.min(680 / w, (window.innerHeight * 0.55) / h, 1);
    svgEl.setAttribute('width', Math.round(w * scale));
    svgEl.setAttribute('height', Math.round(h * scale));
    svgEl.style.boxShadow = '0 2px 8px rgba(0,0,0,0.25)';
    area.appendChild(svgEl);
  };
  sel.addEventListener('change', draw);
  laySel.addEventListener('change', draw);
  div.querySelector('#prev-title').addEventListener('change', draw);
  div.querySelector('#prev-legend').addEventListener('change', draw);
  if (div.querySelector('#prev-detail')) div.querySelector('#prev-detail').addEventListener('change', draw);
  div.querySelectorAll('[data-dimfloor]').forEach(cb => cb.addEventListener('change', draw));
  if (bSel) bSel.addEventListener('change', draw);
  const saveAll = async (fmt) => {
    const targets = exportTargets();
    closeModal();
    for (const b of targets) {
      const clone = buildFor(b);
      const name = b === 'all' ? exportFilename(fmt) : withBuildingRendered(b, () => exportFilename(fmt));
      if (fmt === 'svg') await exportSVG(clone, name); else await exportPNG(clone, name);
    }
    render();
  };
  div.querySelector('#prev-save-svg').addEventListener('click', () => { saveAll('svg'); });
  div.querySelector('#prev-save-png').addEventListener('click', () => { saveAll('png'); });
  draw();
}

async function exportSVG(clone, filename) {
  clone = clone || svgForExport();
  filename = filename || exportFilename('svg');
  const xml = new XMLSerializer().serializeToString(clone);
  await saveBlob(new Blob(['<?xml version="1.0"?>\n', xml], { type: 'image/svg+xml' }), filename, 'image/svg+xml');
}
function exportPNG(clone, filename) {
  clone = clone || svgForExport();
  filename = filename || exportFilename('png');
  const w = parseFloat(clone.getAttribute('width')), h = parseFloat(clone.getAttribute('height'));
  const xml = new XMLSerializer().serializeToString(clone);
  const url = URL.createObjectURL(new Blob([xml], { type:'image/svg+xml;charset=utf-8' }));
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = w*2; c.height = h*2;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,c.width,c.height);
      ctx.drawImage(img,0,0,c.width,c.height);
      c.toBlob(async b => { await saveBlob(b, filename, 'image/png'); URL.revokeObjectURL(url); resolve(); });
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(); };
    img.src = url;
  });
}

// Snapshot the live canvas for export: the tight bbox of what's actually drawn
// (screen px, including rendered text extents) plus a stripped clone of the content.
// Captures whatever floor is on the canvas right now.
// ----- Zoom and pan ------------------------------------------------------------
// Wheel (or trackpad pinch) zooms about the cursor; middle-drag, or left-drag with
// ✋ on, pans; Fit returns to the automatic view. Everything that maps screen to
// world reads viewTransform, which render() takes from userView when set.
const ZOOM_STEP = 1.2;
let panMode = false, panDrag = null;
function withFitView(fn) {
  const saved = userView;
  userView = null; render();
  try { return fn(); } finally { userView = saved; render(); }
}
function svgPoint(clientX, clientY) {
  const rect = svg.getBoundingClientRect();
  const vbW = svg.viewBox.baseVal.width || rect.width, vbH = svg.viewBox.baseVal.height || rect.height;
  return { x: (clientX - rect.left) * (vbW / rect.width), y: (clientY - rect.top) * (vbH / rect.height), kx: vbW / rect.width, ky: vbH / rect.height };
}
function zoomAt(factor, sx, sy) {
  if (galleryActive() || !viewTransform) return;
  const fit = fitView(), base = userView || viewTransform;
  const scale = Math.max(fit.scale * 0.25, Math.min(fit.scale * 50, base.scale * factor));
  const f = scale / base.scale;
  if (sx === undefined) { const r = svg.getBoundingClientRect(); const c = svgPoint(r.left + r.width / 2, r.top + r.height / 2); sx = c.x; sy = c.y; }
  userView = { scale, tx: sx - (sx - base.tx) * f, ty: sy - (sy - base.ty) * f };
  render();
}
function zoomFit() { userView = null; render(); }
function togglePanMode() { panMode = !panMode; svg.classList.toggle('pan-mode', panMode); updateZoomBar(); }
function updateZoomBar() {
  const bar = document.getElementById('zoom-bar');
  if (!bar) return;
  bar.hidden = galleryActive();
  const pct = userView ? Math.round(100 * userView.scale / fitView().scale) : 100;
  bar.querySelector('.zb-pct').textContent = (userView ? pct : 'Fit') + (userView ? '%' : '');
  bar.querySelector('.zb-pan').classList.toggle('on', panMode);
}
svg.addEventListener('wheel', (e) => {
  if (galleryActive()) return;
  e.preventDefault();
  const p = svgPoint(e.clientX, e.clientY);
  const step = e.ctrlKey ? Math.exp(-e.deltaY * 0.01) : (e.deltaY < 0 ? ZOOM_STEP : 1 / ZOOM_STEP);   // ctrl = trackpad pinch
  zoomAt(step, p.x, p.y);
}, { passive: false });
svg.addEventListener('mousedown', (e) => {
  if (galleryActive()) return;
  if (!(e.button === 1 || (e.button === 0 && panMode))) return;
  e.preventDefault(); e.stopImmediatePropagation();
  const base = userView || viewTransform;
  panDrag = { x: e.clientX, y: e.clientY, tx: base.tx, ty: base.ty, scale: base.scale, moved: false };
}, true);
window.addEventListener('mousemove', (e) => {
  if (!panDrag) return;
  const k = svgPoint(e.clientX, e.clientY);
  const dx = (e.clientX - panDrag.x) * k.kx, dy = (e.clientY - panDrag.y) * k.ky;
  if (Math.abs(dx) + Math.abs(dy) > 2) panDrag.moved = true;
  userView = { scale: panDrag.scale, tx: panDrag.tx + dx, ty: panDrag.ty + dy };
  render();
});
window.addEventListener('mouseup', () => { if (panDrag) { panDrag.endedAt = Date.now(); window._panEnded = panDrag; panDrag = null; } });
// A click that ends a pan drag (or any click while ✋ is on) must not also draw, pick or select.
svg.addEventListener('click', (e) => {
  const ended = window._panEnded;
  if (panMode || (ended && ended.moved && Date.now() - ended.endedAt < 300)) { e.stopImmediatePropagation(); e.preventDefault(); }
}, true);
svg.addEventListener('auxclick', (e) => { if (e.button === 1) e.preventDefault(); });

function captureLivePanel() {
  if (userView) return withFitView(() => captureLivePanel());
  const allWorldPts = [];
  const sceneShapes = state.settings.showFloorGhosts ? visibleShapes() : shapesOnFloor(state.activeFloor);
  sceneShapes.forEach(sh => allWorldPts.push(...shapeExtentPoints(sh)));
  if (state.segments.length) allWorldPts.push(...pathPointsHere(state.segments));
  annotationsOnFloor(state.activeFloor).forEach(({ ann }) => { allWorldPts.push(ann.a); allWorldPts.push(ann.b); });
  labelsOnFloor(state.activeFloor).forEach(l => allWorldPts.push({ x: l.x, y: l.y }));

  let tight;
  if (allWorldPts.length === 0 || !viewTransform) {
    tight = { x: 0, y: 0, w: svg.clientWidth, h: svg.clientHeight };
  } else {
    const sxs = allWorldPts.map(p => viewTransform.tx + p.x * viewTransform.scale);
    const sys = allWorldPts.map(p => viewTransform.ty + p.y * viewTransform.scale);
    let sMinX = Math.min(...sxs), sMaxX = Math.max(...sxs);
    let sMinY = Math.min(...sys), sMaxY = Math.max(...sys);
    // Union in the ACTUAL rendered text (dimension labels, area labels, multi-line
    // notes) so nothing clips and we can crop tightly — which scales the drawing up.
    [...svg.querySelectorAll('text')].forEach(t => {
      if (t.classList.contains('ui-overlay')) return;
      try {
        const bb = t.getBBox();
        if (!bb || (bb.width === 0 && bb.height === 0)) return;
        sMinX = Math.min(sMinX, bb.x); sMaxX = Math.max(sMaxX, bb.x + bb.width);
        sMinY = Math.min(sMinY, bb.y); sMaxY = Math.max(sMaxY, bb.y + bb.height);
      } catch (e) { /* getBBox can throw on unrendered nodes */ }
    });
    const labelPad = 12; // text extents already counted; just a little breathing room
    tight = {
      x: sMinX - labelPad,
      y: sMinY - labelPad,
      w: (sMaxX - sMinX) + labelPad * 2,
      h: (sMaxY - sMinY) + labelPad * 2,
    };
  }

  const patterns = [...svg.querySelectorAll('defs pattern')].map(n => n.cloneNode(true));  // fills this panel references
  const content = svg.cloneNode(true);
  // Strip UI-only elements that shouldn't appear in exports
  ['.hit-wall', '.hit-vertex', '.visible-vertex', '.ui-overlay'].forEach(sel => {
    [...content.querySelectorAll(sel)].forEach(n => n.remove());
  });
  // Clear "selected" styling on walls so exports don't show blue highlights
  [...content.querySelectorAll('.visible-wall.selected')].forEach(n => n.classList.remove('selected'));
  // Drop the defs (the outer export SVG carries its own copy)
  const cloneDefs = content.querySelector('defs');
  if (cloneDefs) cloneDefs.remove();
  return { tight, content, patterns };
}

// Temporarily draw `floor` alone (ghosts off, no in-progress walk or start marker),
// run fn() against that canvas, then put the live view back exactly as it was.
function withFloorRendered(floor, fn) {
  if (userView) return withFitView(() => withFloorRendered(floor, fn));
  const saved = {
    activeFloor: state.activeFloor, segments: state.segments, preview: state.preview,
    startPoint: state.startPoint, ghosts: state.settings.showFloorGhosts,
  };
  state.activeFloor = floor;
  state.segments = []; state.preview = null; state.startPoint = null;
  state.settings.showFloorGhosts = false;
  try {
    render();
    return fn();
  } finally {
    state.activeFloor = saved.activeFloor;
    state.segments = saved.segments; state.preview = saved.preview; state.startPoint = saved.startPoint;
    state.settings.showFloorGhosts = saved.ghosts;
    render();
  }
}

// Temporarily scope the canvas to one building (no in-progress walk, no selection),
// run fn() against it, then put the view filter back. Callers re-render afterwards
// (renderGallery does so implicitly by overwriting the canvas; exports call render()).
function withBuildingRendered(building, fn) {
  if (userView) return withFitView(() => withBuildingRendered(building, fn));
  const saved = { view: state.viewBuilding, segments: state.segments, preview: state.preview, startPoint: state.startPoint, selection: state.selection };
  state.viewBuilding = building;
  state.segments = []; state.preview = null; state.startPoint = null; state.selection = null;
  try { render(); return fn(); }
  finally {
    state.viewBuilding = saved.view; state.segments = saved.segments; state.preview = saved.preview;
    state.startPoint = saved.startPoint; state.selection = saved.selection;
  }
}

// Building gallery: each building rendered alone (active floor, ghosts per settings),
// captured like an export panel, and tiled so every one is as large as its cell allows.
// Clicking a panel selects that building for editing (see the svg click handler).
function renderGallery() {
  const present = buildingsPresent();
  const w = svg.clientWidth || 800, h = svg.clientHeight || 600;
  const floorFor = b => {
    const has = f => state.shapes.some(sh => (sh.building || DEFAULT_BUILDING) === b && sh.floor === f);
    // Fallback order: the building's main level first ('main', or 'other' for an
    // outbuilding drawn there), then whatever floor has content.
    const order = [state.activeFloor, 'main', 'other', ...state.floors];
    return order.find(has) || state.activeFloor;
  };
  const panels = present.map(b => {
    const f = floorFor(b);
    const cap = f === state.activeFloor
      ? withBuildingRendered(b, captureLivePanel)
      : withBuildingRendered(b, () => withFloorRendered(f, captureLivePanel));
    return { building: b, floor: f, ...cap };
  });
  viewTransform = null;   // no screen↔world mapping while the gallery is up
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  const n = panels.length;
  const cols = n <= 2 ? n : (n <= 4 ? 2 : 3);
  const rows = Math.ceil(n / cols);
  const gap = 24, capH = 26, pad = 20;
  const cellW = (w - pad * 2 - gap * (cols - 1)) / cols;
  const cellH = (h - pad * 2 - gap * (rows - 1)) / rows;
  const ns = 'http://www.w3.org/2000/svg';
  svg.innerHTML = '<defs></defs>';
  const defs = svg.querySelector('defs');
  panels.forEach((p, i) => {
    (p.patterns || []).forEach(pat => { if (!defs.querySelector('#' + pat.id)) defs.appendChild(pat); });
    const cx = pad + (i % cols) * (cellW + gap), cy = pad + Math.floor(i / cols) * (cellH + gap);
    const availH = cellH - capH;
    const sc = Math.min(cellW / p.tight.w, availH / p.tight.h);
    const fw = p.tight.w * sc, fh = p.tight.h * sc;
    const px = cx + (cellW - fw) / 2, py = cy + (availH - fh) / 2;
    const g = document.createElementNS(ns, 'g');
    g.setAttribute('class', 'gallery-panel ui-overlay' + (markedBuildings.has(p.building) ? ' marked' : ''));
    g.setAttribute('data-gallery-building', p.building);
    const frame = document.createElementNS(ns, 'rect');
    frame.setAttribute('x', cx); frame.setAttribute('y', cy); frame.setAttribute('width', cellW); frame.setAttribute('height', cellH);
    frame.setAttribute('rx', 8); frame.setAttribute('class', 'gallery-frame');
    g.appendChild(frame);
    const nested = document.createElementNS(ns, 'svg');
    nested.setAttribute('x', px); nested.setAttribute('y', py); nested.setAttribute('width', fw); nested.setAttribute('height', fh);
    nested.setAttribute('viewBox', `${p.tight.x} ${p.tight.y} ${p.tight.w} ${p.tight.h}`);
    nested.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    nested.style.pointerEvents = 'none';
    while (p.content.firstChild) nested.appendChild(p.content.firstChild);
    g.appendChild(nested);
    const area = state.shapes
      .filter(sh => (sh.building || DEFAULT_BUILDING) === p.building && sh.floor === p.floor)
      .reduce((a, sh) => a + shapeArea(sh), 0);
    const cap = document.createElementNS(ns, 'text');
    cap.setAttribute('x', cx + cellW / 2); cap.setAttribute('y', cy + cellH - 8);
    cap.setAttribute('text-anchor', 'middle'); cap.setAttribute('class', 'gallery-caption');
    cap.textContent = p.building + ' — ' + floorCaption(p.floor) + (area > 0 ? ' ' + Math.round(area) + ' sf' : '') +
      (p.floor !== state.activeFloor ? ' (nothing on ' + state.activeFloor + ')' : '');
    g.appendChild(cap);
    // Tick box (bottom-right of the panel): mark this building for deletion without opening it
    const mk = document.createElementNS(ns, 'g');
    mk.setAttribute('class', 'gallery-mark');
    mk.setAttribute('data-mark-building', p.building);
    const bx = cx + cellW - 26, by = cy + cellH - 26;
    const box = document.createElementNS(ns, 'rect');
    box.setAttribute('x', bx); box.setAttribute('y', by); box.setAttribute('width', 18); box.setAttribute('height', 18); box.setAttribute('rx', 3);
    mk.appendChild(box);
    if (markedBuildings.has(p.building)) {
      const tick = document.createElementNS(ns, 'text');
      tick.setAttribute('x', bx + 9); tick.setAttribute('y', by + 14); tick.setAttribute('text-anchor', 'middle');
      tick.textContent = '\u2715';
      mk.appendChild(tick);
    }
    const title = document.createElementNS(ns, 'title');
    title.textContent = (markedBuildings.has(p.building) ? 'Unmark ' : 'Mark ') + p.building + ' for deletion';
    mk.appendChild(title);
    g.appendChild(mk);
    svg.appendChild(g);
  });
  // The inner renders ran with one building selected; put the bar back to "All".
  syncBuildingSelect();
  syncMarkControls();
  document.getElementById('floor-help').textContent = 'Gallery: every building in the file, each fitted to its panel. Click one to edit it on its own.';
}

function sidebarGallery() {
  const present = buildingsPresent();
  return `<div class="section"><h2>Buildings</h2>
    <div class="help">Every building in this file is shown as a gallery. Click one on the canvas, or pick it here, to edit it on its own — the canvas fits that building to the window and new shapes are tagged to it. Use the Building dropdown in the floor bar to come back to All.</div>
    <div class="row-buttons">${present.map(b => `<button data-building="${escapeHtml(b)}" onclick="setViewBuilding(this.dataset.building)">${escapeHtml(b)}</button>`).join('')}</div>
    <div class="help" style="margin-top:8px;">Tick the box at the corner of a panel to mark that building for deletion (or open it and tick <em>Mark for deletion</em> on the floor bar), then delete them all at once.</div>
    <div class="row-buttons" style="margin-top:6px;">
      <button class="danger" onclick="deleteMarkedBuildings()" ${markedBuildings.size ? '' : 'disabled'} style="background:${markedBuildings.size ? '#c0392b' : '#b8bec5'};">Delete marked (${markedBuildings.size})</button>
      <button onclick="clearMarks()" ${markedBuildings.size ? '' : 'disabled'}>Clear marks</button>
      <button onclick="openBuildingsModal()" title="Rename, merge duplicates, delete unwanted buildings, drop unused names">Manage buildings&hellip;</button>

const FLOOR_CAPTIONS = { basement: 'Basement', main: 'Main floor', upper: 'Upper floor', other: 'Other' };
function floorCaption(f) { return FLOOR_CAPTIONS[f] || (f.charAt(0).toUpperCase() + f.slice(1)); }

function svgForExport() {
  if (userView) return withFitView(() => svgForExport());
  const ns = 'http://www.w3.org/2000/svg';
  const mk = (tag, attrs, text) => {
    const el = document.createElementNS(ns, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    if (text !== undefined) el.textContent = text;
    return el;
  };

  // ---- 1. Decide what's on the export ----
  const includeTitle = state.settings.exportIncludeTitle && (state.subject || '').trim().length > 0;
  const hasBrand = !!(brand.firmName || brand.logo);
  const usedTypes = [...new Set(visibleShapes().map(s => s.type))].filter(k => k in TYPES);
  const includeLegend = state.settings.exportIncludeLegend && usedTypes.length > 0;

  // Above/below-grade summary line shown on the sheet (appraisal totals)
  const gradeSummary = (() => {
    let agla = 0, bArea = 0, bFin = 0, hasB = false;
    const exportBuildings = viewBuildingOrAll() === 'all' ? buildingsPresent() : [viewBuildingOrAll()];
    exportBuildings.forEach(b => {
      agla += aboveGradeLiving(b);
      const bm = state.basements[b];
      if (bm) { hasB = true; const a = basementArea(b); bArea += a; bFin += a * bm.pctFinished / 100; }
    });
    const parts = [];
    if (agla > 0) parts.push(`Above-Grade Living ${Math.round(agla)} sq ft`);
    if (hasB) parts.push(`Basement ${Math.round(bArea)} sq ft (${Math.round(bFin)} finished / ${Math.round(bArea - bFin)} unfinished)`);
    return parts.join('      •      ');
  })();

  // Title + legend layout in PAGE coords (slimmed so the drawing gets more room).
  const titleH = (includeTitle || hasBrand) ? 48 : 0;
  const legendRowH = 22;
  const legendFooterH = 16;
  const legendPad = 10;
  const legendHeaderH = 22;
  const summaryRowH = (gradeSummary && includeLegend) ? 20 : 0;  // grade/basement totals live in the legend
  const legendH = includeLegend ? (legendPad*2 + legendHeaderH + usedTypes.length * legendRowH + summaryRowH + legendFooterH) : 0;

  // ---- 2. Capture the drawing panel(s) ----
  // 'active' exports the live canvas as-is (active floor + ghosts + surfaced dims).
  // 'horizontal' / 'vertical' re-render each floor on its own with ghosts off and
  // tile the panels on one sheet, so the floors read as separate plans, not a stack.
  const layout = state.settings.exportLayout || 'active';
  const floorsWithContent = state.floors.filter(f => shapesOnFloor(f).length || labelsOnFloor(f).length);
  // Gallery on the canvas (All, several buildings): the sheet is one panel per
  // building in a grid — every building on one page, all at the same scale.
  const galleryExport = galleryActive();
  const multi = galleryExport || (layout !== 'active' && floorsWithContent.length > 1);
  let panels;
  if (galleryExport) {
    const floorFor = b => {
      const has = f => state.shapes.some(sh => (sh.building || DEFAULT_BUILDING) === b && sh.floor === f);
      return [state.activeFloor, 'main', 'other', ...state.floors].find(has) || state.activeFloor;
    };
    panels = buildingsPresent().map(b => {
      const f = floorFor(b);
      const cap = f === state.activeFloor ? withBuildingRendered(b, captureLivePanel)
                                          : withBuildingRendered(b, () => withFloorRendered(f, captureLivePanel));
      return { building: b, floor: f, ...cap };
    });
  } else if (!multi) {
    panels = [{ floor: state.activeFloor, ...captureLivePanel() }];
  } else {
    // Report order: above-grade floors as listed, basement last.
    const order = floorsWithContent.filter(f => f !== 'basement').concat(floorsWithContent.filter(f => f === 'basement'));
    panels = order.map(f => ({ floor: f, ...withFloorRendered(f, captureLivePanel) }));
  }
  const grid = galleryExport;
  const horiz = !grid && (!multi || layout === 'horizontal');
  const n = panels.length;
  const captionH = multi ? 22 : 0;   // page px, under each panel
  const gap = 28;                    // page px, between panels
  const sumW = panels.reduce((a, p) => a + p.tight.w, 0), sumH = panels.reduce((a, p) => a + p.tight.h, 0);
  const maxW = Math.max(...panels.map(p => p.tight.w)), maxH = Math.max(...panels.map(p => p.tight.h));
  const cols = grid ? (n <= 2 ? n : (n <= 4 ? 2 : 3)) : 1;
  const rows = grid ? Math.ceil(n / cols) : 1;
  // Drawing extent (screen px, scales with fitScale) vs fixed page chrome (gaps, captions)
  const contentW = grid ? cols * maxW : (horiz ? sumW : maxW);
  const contentH = grid ? rows * maxH : (horiz ? maxH : sumH);
  const fixedW = grid ? gap * (cols - 1) : (horiz ? gap * (n - 1) : 0);
  const fixedH = grid ? captionH * rows + gap * (rows - 1) : (horiz ? captionH : captionH * n + gap * (n - 1));

  // ---- 3. Page size & available canvas area ----
  const page = EXPORT_PAGE_SIZES[state.settings.exportPageSize] || null;
  const sideMargin = 24;
  let pageW, pageH;
  if (page) {
    pageW = page.w;
    pageH = page.h;
  } else {
    // Auto: page width = content width + margins; height fits content + title + legend.
    // A small plan is scaled up (to 1.5x) to fill a 760 px page, so its dimensions
    // and labels print at a readable size instead of floating small in the middle.
    const up = Math.min(1.5, Math.max(1, (760 - sideMargin * 2 - fixedW) / contentW));
    pageW = Math.max(640, contentW * up + fixedW + sideMargin * 2);
    pageH = titleH + sideMargin + contentH * up + fixedH + sideMargin + legendH;
  }

  const canvasAvailW = pageW - sideMargin * 2;
  const canvasAvailH = pageH - titleH - legendH - sideMargin * 2;
  const fitScale = Math.min((canvasAvailW - fixedW) / contentW, (canvasAvailH - fixedH) / contentH);
  const blockW = contentW * fitScale + fixedW;
  const blockH = contentH * fitScale + fixedH;
  const blockX = sideMargin + (canvasAvailW - blockW) / 2;
  const blockY = titleH + sideMargin + (canvasAvailH - blockH) / 2;

  // ---- 4. Build the export SVG: page-coord outer, nested SVG for the canvas ----
  usedTypes.forEach(k => fillFor(typeStyle(k)));   // legend swatch patterns must exist before <defs> is cloned
  const liveDefs = svg.querySelector('defs');
  const out = document.createElementNS(ns, 'svg');
  out.setAttribute('xmlns', ns);
  out.setAttribute('width', pageW);
  out.setAttribute('height', pageH);
  out.setAttribute('viewBox', `0 0 ${pageW} ${pageH}`);

  if (liveDefs) {
    const defs = liveDefs.cloneNode(true);
    // Multi-floor layouts: each panel was rendered separately, so gather every
    // pattern any panel used (the live <defs> only holds the last render's).
    panels.forEach(p => (p.patterns || []).forEach(pat => { if (!defs.querySelector('#' + pat.id)) defs.appendChild(pat); }));
    out.appendChild(defs);
  }

  // Page background
  out.appendChild(mk('rect', { width: pageW, height: pageH, fill: '#fff' }));

  // Your branding: logo at the left of the title block, firm name at the right.
  if (hasBrand) {
    if (brand.logo && brand.logoW && brand.logoH) {
      const lh = 34, lw = Math.min(160, lh * brand.logoW / brand.logoH);
      out.appendChild(mk('image', { href: brand.logo, x: sideMargin, y: 7, width: lw, height: lh, preserveAspectRatio: 'xMidYMid meet' }));
    }
    if (brand.firmName) {
      out.appendChild(mk('text', {
        x: pageW - sideMargin, y: 26, 'text-anchor':'end', 'font-family':'Arial, sans-serif',
        'font-size': 12, 'font-weight':'bold', fill:'#333'
      }, brand.firmName));
    }
  }

  // Title block in page coords (slimmed)
  if (includeTitle) {
    const viewB = viewBuildingOrAll();
    const subj = ((state.subject || '').trim() + (viewB === 'all' ? '' : ' — ' + viewB)).trim();
    const sub = (state.subtitle || '').trim();
    out.appendChild(mk('text', {
      x: pageW / 2, y: 26, 'text-anchor':'middle', 'font-family':'Arial, sans-serif',
      'font-size': 18, 'font-weight':'bold', fill:'#222'
    }, subj));
    out.appendChild(mk('text', {
      x: pageW / 2, y: 42, 'text-anchor':'middle', 'font-family':'Arial, sans-serif',
      'font-size': 11, fill:'#555'
    }, sub || 'Not to scale — dimensions as labeled'));
  }

  // ---- 5. Place the panel(s): one nested SVG per panel, cropped to its tight bbox ----
  let cx = blockX, cy = blockY;
  panels.forEach((p, i) => {
    const fw = p.tight.w * fitScale, fh = p.tight.h * fitScale;
    let px, py, capY;
    if (grid) {
      const cellW = maxW * fitScale, cellH = maxH * fitScale;
      const cellX = blockX + (i % cols) * (cellW + gap), cellY = blockY + Math.floor(i / cols) * (cellH + captionH + gap);
      px = cellX + (cellW - fw) / 2; py = cellY + (cellH - fh) / 2;
      capY = cellY + cellH + 15;
    }
    else if (horiz) { px = cx; py = blockY + (contentH * fitScale - fh) / 2; cx += fw + gap; }
    else       { px = blockX + (blockW - fw) / 2; py = cy; cy += fh + captionH + gap; }
    const nested = mk('svg', {
      x: px, y: py, width: fw, height: fh,
      viewBox: `${p.tight.x} ${p.tight.y} ${p.tight.w} ${p.tight.h}`,
      preserveAspectRatio: 'xMidYMid meet',
    });
    while (p.content.firstChild) nested.appendChild(p.content.firstChild);
    out.appendChild(nested);
    if (multi) {
      const area = p.building
        ? state.shapes.filter(sh => (sh.building || DEFAULT_BUILDING) === p.building && sh.floor === p.floor).reduce((a, sh) => a + shapeArea(sh), 0)
        : shapesOnFloor(p.floor).reduce((a, sh) => a + shapeArea(sh), 0);
      if (!grid) capY = (horiz ? blockY + contentH * fitScale : py + fh) + 15;
      out.appendChild(mk('text', {
        x: px + fw / 2, y: capY, 'text-anchor':'middle', 'font-family':'Arial, sans-serif',
        'font-size': 12, 'font-weight':'bold', fill:'#222'
      }, p.building ? `${p.building} — ${floorCaption(p.floor)} — ${Math.round(area)} sq ft` : `${floorCaption(p.floor)} — ${Math.round(area)} sq ft`));
    }
  });

  // ---- 6. Legend in page coords at the bottom ----
  if (includeLegend) {
    const y0 = pageH - legendH + legendPad;
    const x0 = sideMargin;
    const lw = pageW - sideMargin * 2;
    out.appendChild(mk('rect', {
      x: x0, y: y0 - legendPad, width: lw, height: legendH,
      fill: 'none', stroke: '#999', 'stroke-width': 0.75
    }));
    out.appendChild(mk('text', {
      x: x0 + 12, y: y0 + 4, 'font-family':'Arial, sans-serif',
      'font-size': 14, 'font-weight':'bold', fill:'#222'
    }, 'Legend'));
    // Two-column layout if there are many types
    const usePerColumn = usedTypes.length > 4 ? Math.ceil(usedTypes.length / 2) : usedTypes.length;
    const colW = lw / (usedTypes.length > 4 ? 2 : 1);
    usedTypes.forEach((key, i) => {
      const t = TYPES[key];
      const st = typeStyle(key);
      const col = Math.floor(i / usePerColumn);
      const rowInCol = i % usePerColumn;
      const rowX = x0 + 12 + col * colW;
      const rowY = y0 + 14 + rowInCol * legendRowH;
      const swatch = mk('rect', {
        x: rowX, y: rowY, width: 22, height: 13,
        fill: fillFor(st), stroke: 'black', 'stroke-width': 1
      });
      if (t.dashed) swatch.setAttribute('stroke-dasharray','5,3');
      out.appendChild(swatch);
      out.appendChild(mk('text', {
        x: rowX + 30, y: rowY + 11, 'font-family':'Arial, sans-serif', 'font-size': 12.5, fill:'#222'
      }, t.name));
      const total = visibleShapes().filter(s => s.type === key).reduce((a, s) => a + shapeArea(s), 0);
      out.appendChild(mk('text', {
        x: rowX + colW - 20, y: rowY + 11, 'text-anchor':'end',
        'font-family':'Arial, sans-serif', 'font-size': 12.5, 'font-weight':'bold', fill:'#444'
      }, `${Math.round(total)} sq ft`));
    });
    // Grade/basement totals consolidated into the legend (below the type rows)
    let summaryBottom = y0 + 14 + usePerColumn * legendRowH;
    if (gradeSummary) {
      out.appendChild(mk('text', {
        x: x0 + 12, y: summaryBottom + 12, 'font-family':'Arial, sans-serif',
        'font-size': 12.5, 'font-weight':'bold', fill:'#2b3a4a'
      }, gradeSummary));
      summaryBottom += 20;
    }
    // Wall-style swatches as a footer row
    const footerY = summaryBottom + 6;
    out.appendChild(mk('line', {
      x1: x0 + 12, y1: footerY + 5, x2: x0 + 52, y2: footerY + 5,
      stroke:'black', 'stroke-width': 2.5
    }));
    out.appendChild(mk('text', {
      x: x0 + 58, y: footerY + 9, 'font-family':'Arial, sans-serif', 'font-size': 11.5, fill:'#222'
    }, 'Enclosed wall'));
    out.appendChild(mk('line', {
      x1: x0 + 190, y1: footerY + 5, x2: x0 + 230, y2: footerY + 5,
      stroke:'black', 'stroke-width': 2.5, 'stroke-dasharray':'8,5'
    }));
    out.appendChild(mk('text', {
      x: x0 + 236, y: footerY + 9, 'font-family':'Arial, sans-serif', 'font-size': 11.5, fill:'#222'
    }, 'Open / dashed edge'));
    if (visibleShapes().some(s => s.calc && Object.keys(s.calc).length)) {
      out.appendChild(mk('text', {
        x: x0 + 380, y: footerY + 9, 'font-family':'Arial, sans-serif', 'font-size': 12, 'font-weight':'bold', fill:'#c2410c'
      }, '*'));
      out.appendChild(mk('text', {
        x: x0 + 392, y: footerY + 9, 'font-family':'Arial, sans-serif', 'font-size': 11.5, fill:'#222'
      }, 'Calculated, not measured'));
    }
  }

  // Optional credit in the bottom margin (Settings → Your branding). Off by default.
  if (brand.osasiCredit) {
    out.appendChild(mk('text', {
      x: pageW - sideMargin, y: pageH - 8, 'text-anchor':'end', 'font-family':'Arial, sans-serif',
      'font-size': 9, fill:'#888'
    }, 'Sketch: CValR-Sketch · provided by osasi.org'));
  }

  return out;
}

// ----- Recent projects (localStorage-backed) -----
const RECENTS_INDEX_KEY = 'cvalrsketch:recents';
const RECENT_PROJECT_PREFIX = 'cvalrsketch:project:';
const MAX_RECENTS = 12;

function getRecents() {
  try { return JSON.parse(localStorage.getItem(RECENTS_INDEX_KEY) || '[]'); }
  catch (e) { return []; }
}
function setRecents(arr) {
  try { localStorage.setItem(RECENTS_INDEX_KEY, JSON.stringify(arr)); } catch (e) {}
}
function saveToRecents() {
  const subjRaw = (state.subject || '').trim();
  const subject = subjRaw || 'Untitled';
  const key = subject.replace(/[^\w\- ]/g, '_').slice(0, 60) + '_' + Date.now();
  const data = { ...state };
  delete data.undoStack; delete data.redoStack; delete data.selection;
  delete data.fenceSelection; delete data.fenceDraw; delete data.offsetPick;
  delete data.preview; delete data.splitSelection; delete data.splitPreview;
  // A traced-over scan is hundreds of KB; a few recents would fill the browser's
  // storage and starve the crash-recovery autosave. The sketch file keeps it.
  delete data.underlay; delete data.underlayDrag; delete data.underlayCal;
  try { localStorage.setItem(RECENT_PROJECT_PREFIX + key, JSON.stringify(data)); }
  catch (e) { /* may be quota */ }
  const recents = getRecents();
  recents.unshift({
    key, subject,
    savedAt: new Date().toISOString(),
    shapes: state.shapes.length,
    floors: [...new Set(state.shapes.map(s => s.floor))],
  });
  while (recents.length > MAX_RECENTS) {
    const old = recents.pop();
    try { localStorage.removeItem(RECENT_PROJECT_PREFIX + old.key); } catch (e) {}
  }
  setRecents(recents);
}
function loadFromRecents(key) {
  const raw = localStorage.getItem(RECENT_PROJECT_PREFIX + key);
  if (!raw) { alert('Project not found in recents'); return; }
  if (state.shapes.length || state.segments.length) {
    if (!confirm('Discard current sketch and load this recent project?')) return;
  }
  try {
    const d = JSON.parse(raw);
    Object.assign(state, d);
    state.settings = { ...SETTINGS_DEFAULTS, ...(d.settings || {}) };
    state.undoStack = []; state.redoStack = [];
    state.selection = null; state.fenceSelection = null; state.fenceDraw = null;
    state.offsetPick = null; state.preview = null;
    state.splitSelection = null; state.splitPreview = null;
    const subjInp = document.getElementById('subject-input'); if (subjInp) subjInp.value = state.subject || '';
    dropFileHandle();   // recents are browser copies, not the file that was armed
    closeModal();
    render();
  } catch (e) { alert('Load failed: ' + e.message); }
}
function deleteFromRecents(key) {
  if (!confirm('Remove this project from recents? (Your saved file is unaffected.)')) return;
  const recents = getRecents().filter(r => r.key !== key);
  setRecents(recents);
  try { localStorage.removeItem(RECENT_PROJECT_PREFIX + key); } catch (e) {}
  openRecentsModal();
}
function formatRecentDate(iso) {
  const d = new Date(iso);
  const diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  if (diff < 604800) return Math.floor(diff/86400) + 'd ago';
  return d.toLocaleDateString();
}
function openRecentsModal() {
  const m = createModal();
  const recents = getRecents();
  const rows = recents.length
    ? recents.map(r => `
        <div style="display:flex; align-items:center; gap:8px; padding:8px; border:1px solid #ddd; border-radius:6px;">
          <div style="flex:1; min-width:0;">
            <div style="font-weight:bold; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${(r.subject || 'Untitled').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}</div>
            <div style="font-size:11px; color:#666;">${r.shapes} shape${r.shapes === 1 ? '' : 's'} · ${formatRecentDate(r.savedAt)}</div>
          </div>
          <button data-recent-load="${r.key.replace(/"/g, '&quot;')}" class="primary">Load</button>
          <button data-recent-del="${r.key.replace(/"/g, '&quot;')}" class="danger">×</button>
        </div>`).join('')
    : '<div style="color:#999; padding:8px;">No recent projects yet. Save a sketch first.</div>';
  m.innerHTML = `
    <div class="modal" style="min-width:480px; max-width:560px;">
      <h3>📂 Recent projects</h3>
      <p style="font-size:12px; color:#666; margin:0 0 8px;">Stored in this browser only — independent of any files you saved.</p>
      <div style="display:flex; flex-direction:column; gap:6px; max-height:60vh; overflow-y:auto;">
        ${rows}
      </div>
      <div class="modal-buttons">
        <button onclick="closeModal()">Close</button>
      </div>
    </div>
  `;
  m.querySelectorAll('[data-recent-load]').forEach(b => b.onclick = () => loadFromRecents(b.dataset.recentLoad));
  m.querySelectorAll('[data-recent-del]').forEach(b => b.onclick = () => deleteFromRecents(b.dataset.recentDel));
}

// Save = write the current file in place (no dialog) once one is known; otherwise Save As.
async function saveJSON() {
  saveToRecents();
  if (fileAutosaveSupported && fileAutosave.handle) {
    if (fileAutosave.status === 'paused') await resumeFileAutosave();
    else await writeFileAutosave(true);
    if (fileAutosave.status === 'saved') return;
    // couldn't write the known file — fall through to Save As
  }
  await saveJSONAs();
}
async function saveJSONAs() {
  saveToRecents();
  const payload = serializeProject();
  const handle = await saveBlob(new Blob([payload], { type:'application/json' }), exportFilename('json'), 'application/json');
  if (handle) {
    setFileHandle(handle);
    fileAutosave.lastPayload = payload;
    fileAutosave.lastAt = Date.now();
    fileAutosave.status = 'saved';
    renderAutosaveChip();
  }
}

// ----- Add file: append another sketch's buildings to this project ----------
// Lets the one-file-per-building habit be combined into a single file. Each
// incoming building is mapped to a name here (pre-filled: keep the name if it is
// unused, else the sketch's subject suffix, else "<name> 2"); shapes, labels and
// offset annotations are appended, shifted to sit beside the current drawing;
// basement settings follow the new names. One undo step.
function openAddFileModal(d, fname, progress) {
  return new Promise(resolve => {
  if (!d || !Array.isArray(d.shapes) || !d.shapes.length) { alert(fname + ': no shapes to add.'); resolve(false); return; }
  const incoming = [...new Set(d.shapes.map(sh => sh.building || DEFAULT_BUILDING))];
  const subj = String(d.subject || '');
  const suffix = subj.includes(' - ') ? subj.slice(subj.lastIndexOf(' - ') + 3).trim() : '';
  const present = buildingsPresent();
  const taken = new Set(present);
  const suggest = b => {
    const generic = b === 'Outbuildings' || b === 'Other';
    let n = (generic && suffix && !present.includes(suffix)) ? suffix
      : (!present.includes(b) ? b : (suffix && !present.includes(suffix) ? suffix : b + ' 2'));
    let k = 2;
    while (taken.has(n)) n = b + ' ' + (++k);
    taken.add(n);
    return n;
  };
  const m = createModal();
  const div = document.createElement('div');
  div.className = 'modal';
  div.style.maxWidth = '520px';
  div.innerHTML = `
    <h3>Add file${progress ? ' ' + progress : ''}: ${escapeHtml(fname)}</h3>
    <div class="help" style="margin-bottom:8px;">${d.shapes.length} shape${d.shapes.length === 1 ? '' : 's'}${subj ? ' from “' + escapeHtml(subj) + '”' : ''}. Name each incoming building as it should appear in this file.</div>
    ${incoming.map((b, i) => `<div class="field"><label>${escapeHtml(b)} →</label><input id="addmap-${i}" value="${escapeHtml(suggest(b))}" style="flex:1;"></div>`).join('')}
    <label class="inline" style="display:flex; align-items:center; gap:6px; margin-top:8px;"><input type="checkbox" id="add-beside" checked> Place beside the current drawing (shift so nothing overlaps)</label>
    <div class="modal-buttons">
      <button id="add-file-cancel">${progress ? 'Skip this file' : 'Cancel'}</button>
      <button class="primary" id="add-file-go">Add</button>
    </div>`;
  m.appendChild(div);
  div.querySelector('#add-file-cancel').addEventListener('click', () => { closeModal(); resolve(false); });
  div.querySelector('#add-file-go').addEventListener('click', () => {
    const mapping = {};
    for (let i = 0; i < incoming.length; i++) {
      const v = (div.querySelector('#addmap-' + i).value || '').trim();
      if (!v) { alert('Give every incoming building a name.'); return; }
      mapping[incoming[i]] = v;
    }
    const beside = div.querySelector('#add-beside').checked;
    closeModal();
    addFileToProject(d, mapping, beside);
    resolve(true);
  });
  const first = div.querySelector('#addmap-0');
  if (first) { first.focus(); first.select(); }
  });
}

function addFileToProject(d, mapping, beside) {
  pushUndo();
  let dx = 0, dy = 0;
  const cur = state.shapes.flatMap(sh => sh.points);
  if (beside && cur.length) {
    const inPts = d.shapes.flatMap(sh => sh.points || []);
    if (inPts.length) {
      const curMaxX = Math.max(...cur.map(p => p.x)), curMinY = Math.min(...cur.map(p => p.y));
      const inMinX = Math.min(...inPts.map(p => p.x)), inMinY = Math.min(...inPts.map(p => p.y));
      dx = curMaxX + 20 - inMinX;
      dy = curMinY - inMinY;
    }
  }
  const shift = p => ({ x: p.x + dx, y: p.y + dy });
  (d.floors || []).forEach(f => { if (!state.floors.includes(f)) state.floors.push(f); });
  Object.values(mapping).forEach(n => { if (!buildingList().includes(n)) state.buildings.push(n); });
  d.shapes.forEach(sh => {
    const copy = JSON.parse(JSON.stringify(sh));
    copy.id = state.nextShapeId++;
    copy.building = mapping[sh.building || DEFAULT_BUILDING] || (sh.building || DEFAULT_BUILDING);
    copy.floor = copy.floor || 'main';
    copy.points = (copy.points || []).map(shift);
    if (!state.floors.includes(copy.floor)) state.floors.push(copy.floor);
    state.shapes.push(copy);
  });
  (d.labels || []).forEach(l => state.labels.push({ ...l, id: state.nextLabelId++, x: l.x + dx, y: l.y + dy }));
  (d.annotations || []).forEach(a => { if (a && a.a && a.b) state.annotations.push({ ...a, a: shift(a.a), b: shift(a.b) }); });
  Object.entries(d.basements || {}).forEach(([b, v]) => {
    const n = mapping[b] || b;
    if (!state.basements[n] && v) state.basements[n] = { ...v };
  });
  state.viewBuilding = 'all';
  state.selection = null; state.splitSelection = null; state.fenceSelection = null; state.startPoint = null;
  render();
}
// Several files at once: one naming dialog per file, in the order picked, each
// placed beside everything added so far. Skipping one moves on to the next.
document.getElementById('add-json').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files || []);
  e.target.value = '';
  if (!files.length) return;
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    let d;
    try { d = JSON.parse(await f.text()); }
    catch (err) { alert(f.name + ': could not read (' + err.message + ')'); continue; }
    if (d && d.format === 'cvalrscan') { await importScanData(d, f.name); continue; }
    await openAddFileModal(d, f.name, files.length > 1 ? (i + 1) + ' of ' + files.length : '');
  }
});

// ===== FLOOR-PLAN PDF IMPORT =====
// pdf-import.mjs and the vendored pdf.js load only when a PDF is picked. Module
// imports need a served page, so a file:// open or a saved app copy explains
// instead of failing.
const PDF_IMPORT_VERSION = '0.35.0';
document.getElementById('import-pdf').addEventListener('change', async (e) => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (f && /\.json$/i.test(f.name)) await importScan(f);
  else if (f) await importFloorPlanPdf(f);
});

// ===== LIDAR SCAN IMPORT =====
// A CValRScan plan (.cvalrscan.json) through the same import window as a PDF.
// lidar-import.mjs loads only when a scan is picked.
const LIDAR_IMPORT_VERSION = '0.11.1';
async function importScan(file) {
  let d;
  try { d = JSON.parse(await file.text()); }
  catch (err) { alert(file.name + ': could not read (' + err.message + ')'); return; }
  await importScanData(d, file.name);
}
async function importScanData(d, fname) {
  if (location.protocol === 'file:') {
    alert('Scan import needs the hosted app (https://caa-ebv-co-op.github.io/CValRSketch/) or a local web server. A page opened straight from disk, or a saved app copy, cannot load the scan reader.');
    return;
  }
  let res;
  try {
    const imp = await import('./lidar-import.mjs?v=' + LIDAR_IMPORT_VERSION);
    res = imp.readCvalrScan(d);
  } catch (err) {
    alert('Could not read ' + fname + ': ' + (err && err.message || err));
    return;
  }
  if (!res.ok) { alert(fname + ': ' + res.message + (res.warnings && res.warnings.length ? '\n\n' + res.warnings.join('\n') : '')); return; }
  openPdfImportModal(res, fname);
}
async function importFloorPlanPdf(file) {
  if (location.protocol === 'file:') {
    alert('PDF import needs the hosted app (https://caa-ebv-co-op.github.io/CValRSketch/) or a local web server. A page opened straight from disk, or a saved app copy, cannot load the PDF reader.');
    return;
  }
  const busy = createModal();
  busy.innerHTML = `<div class="modal" style="max-width:420px;"><h3>Reading ${escapeHtml(file.name)}…</h3><div class="help">Tracing each floor on this computer. Nothing is uploaded.</div></div>`;
  let res;
  try {
    const [pdfjs, imp] = await Promise.all([
      import('./vendor/pdfjs/pdf.min.mjs'),
      import('./pdf-import.mjs?v=' + PDF_IMPORT_VERSION),
    ]);
    pdfjs.GlobalWorkerOptions.workerSrc = new URL('vendor/pdfjs/pdf.worker.min.mjs', location.href).href;
    res = await imp.readFloorPlanPdf(new Uint8Array(await file.arrayBuffer()), pdfjs);
  } catch (err) {
    closeModal();
    alert('Could not read ' + file.name + ': ' + (err && err.message || err));
    return;
  }
  closeModal();
  if (!res.ok) { alert(file.name + ': ' + res.message + (res.warnings && res.warnings.length ? '\n\n' + res.warnings.join('\n') : '')); return; }
  openPdfImportModal(res, file.name);
}
function openPdfImportModal(res, fname) {
  const m = createModal();
  const div = document.createElement('div');
  div.className = 'modal';
  div.style.maxWidth = 'min(900px, calc(100vw - 32px))';
  const floorOpts = cur => [...new Set([...state.floors, 'basement', 'main', 'upper', 'other'])]
    .map(f => `<option value="${escapeHtml(f)}"${f === cur ? ' selected' : ''}>${escapeHtml(f)}</option>`).join('');
  const typeOpts = cur => Object.entries(TYPES)
    .map(([k, t]) => `<option value="${k}"${k === cur ? ' selected' : ''}>${escapeHtml(t.name)}</option>`).join('');
  const multi = (res.buildings || []).length > 1;
  const scan = res.profileId === 'cvalrscan';
  const rows = res.floors.map((f, i) => {
    const exc = f.areas.excluded || 0;
    const stated = f.stated;
    const diff = stated ? (f.traced / stated - 1) * 100 : null;
    const ok = diff != null && Math.abs(diff) <= 1;
    const split = f.excludedTraced != null;
    const statedTxt = stated == null ? '—'
      : `${Math.round(stated)} sf${exc ? `<div class="help" style="margin:0;">${split ? `excluded rooms ${Math.round(f.excludedTraced)} / ${Math.round(exc)} sf` : `incl. ${Math.round(exc)} excluded`}</div>` : ''}`;
    const check = diff == null ? '' : `<span style="color:${ok ? '#2f855a' : '#c05621'}; font-weight:600;">${ok ? '✓' : '⚠'} ${diff >= 0 ? '+' : ''}${diff.toFixed(1)}%</span>`;
    const kind = { excluded: 'excluded room', outdoor: 'outdoor' }[f.kind];
    const place = [
      f.turned ? `turned ${f.turned}°` : '',
      f.placement === 'aligned' ? 'lined up' : f.placement === 'check' ? '<span style="color:#c05621;">check position</span>' : '',
    ].filter(Boolean).join(' · ');
    return `<tr>
      <td><input type="checkbox" id="pdfimp-on-${i}" checked></td>
      ${multi ? `<td>${escapeHtml(f.building || '—')}</td>` : ''}
      <td>${escapeHtml(f.title)}<div class="help" style="margin:0;">${scan ? `inside the walls ${Math.round(f.interior)} sf` : `page ${f.page}`}${kind ? ' · ' + kind : ''}${place ? ' · ' + place : ''}</div></td>
      <td><select id="pdfimp-floor-${i}">${floorOpts(f.floor)}</select></td>
      <td><select id="pdfimp-type-${i}">${typeOpts(f.type)}</select></td>
      <td style="text-align:right;">${Math.round(f.traced)} sf</td>
      <td style="text-align:right;">${statedTxt}</td>
      <td>${check}</td></tr>`;
  }).join('');
  const fmt = escapeHtml(res.format);
  const excludedNote = res.floors.some(f => f.kind === 'excluded')
    ? `<li>Rooms ${fmt} leaves out of floor area (garages, unheated rooms) come in as their own areas, sized to the excluded area it states; their exterior walls go with them, shared walls stay with the house. Check each one's area type.</li>` : '';
  const placeNote = res.floors.some(f => f.placement !== 'reference')
    ? `<li>Each floor is turned and slid to sit over the main floor. Where that is not clear-cut (a suite shorter than the garage under it, a floor scanned separately) it says <b>check position</b>; move it with Fence if needed.</li>` : '';
  div.innerHTML = `
    <h3>Import ${escapeHtml(res.format)} plan: ${escapeHtml(fname)}</h3>
    ${res.address ? `<div class="help" style="margin-bottom:6px;">${escapeHtml(res.address)}</div>` : ''}
    <div style="overflow-x:auto;"><table class="pdfimp-table" style="width:100%; border-collapse:collapse; font-size:13px;">
      <thead><tr style="text-align:left; color:#555;"><th></th>${multi ? '<th>Building</th>' : ''}<th>Floor in ${scan ? 'scan' : 'PDF'}</th><th>Floor</th><th>Area type</th><th style="text-align:right;">Traced</th><th style="text-align:right;">${escapeHtml(res.format)} says</th><th>Check</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    ${res.floors.some(f => f.kind === 'floor' && f.floor === 'basement') && res.floors.some(f => f.kind === 'floor' && f.floor === 'main') ? `
    <label style="display:flex; gap:6px; align-items:flex-start; margin-top:8px; font-size:13px;"><input type="checkbox" id="pdfimp-bm-main" style="margin-top:2px;">
      <span><b>Basement: use the main floor's outline</b> instead of the scanned one &mdash; when the foundation you can see lines up with the walls above.
      A scanner sees a basement only from inside and estimates its outside face. (Also later: Basement panel &rarr; <i>Match basement to main floor</i>.)</span></label>` : ''}
    <ul class="help" style="margin:10px 0 0; padding-left:18px;">
      ${excludedNote}
      ${placeNote}
      ${scan ? `<li>A scan measures the inside faces of the walls. Each side is pushed out by its wall's thickness: measured where the outside walk marked the siding beside it, otherwise ${escapeHtml(String(6))}″. Check at least one side against a tape measurement.</li>`
        : `<li>Decks, porches and patios are traced from the outline around their label; one without a closed outline is listed below to draw by hand.</li>`}
      ${(res.warnings || []).map(w => `<li style="color:#c05621;">${escapeHtml(w)}</li>`).join('')}
    </ul>
    <div class="modal-buttons">
      <button id="pdfimp-cancel">Cancel</button>
      <button class="primary" id="pdfimp-go">Import</button>
    </div>`;
  m.appendChild(div);
  div.querySelector('#pdfimp-cancel').addEventListener('click', closeModal);
  div.querySelector('#pdfimp-go').addEventListener('click', async () => {
    const picked = res.floors.map((f, i) => ({
      f, on: div.querySelector('#pdfimp-on-' + i).checked,
      floor: div.querySelector('#pdfimp-floor-' + i).value,
      type: div.querySelector('#pdfimp-type-' + i).value,
    })).filter(r => r.on);
    if (!picked.length) { alert('Tick at least one floor to import.'); return; }
    const bmMain = !!(div.querySelector('#pdfimp-bm-main') || {}).checked;
    closeModal();
    const firstNew = state.nextShapeId;
    const d = pdfImportToSketch(res, picked);
    const oneBuilding = new Set(d.shapes.map(sh => sh.building)).size === 1;
    if (!state.shapes.length && oneBuilding) addFileToProject(d, { [DEFAULT_BUILDING]: DEFAULT_BUILDING }, false);
    else if (!(await openAddFileModal(d, fname, ''))) return;
    if (!(state.subtitle || '').trim() && res.subtitle) state.subtitle = res.subtitle;
    if (!(state.subject || '').trim() && d.subject) {
      state.subject = d.subject;
      const subjInp = document.getElementById('subject-input'); if (subjInp) subjInp.value = d.subject;
    }
    if (bmMain) [...new Set(state.shapes.filter(sh => sh.id >= firstNew).map(sh => sh.building || DEFAULT_BUILDING))].forEach(b => { if (basementFoundationShapes(b).length && mainLivingShapes(b).length) matchBasementToMain(b, true); });
    const main = picked.find(r => r.floor === 'main');
    setActiveFloor(main ? 'main' : picked[0].floor);
  });
}
// Traced floors -> a sketch object addFileToProject can merge (walls with labels,
// each building moved near the origin and set beside the previous one, basement
// area taken from the traced basement). One-building files use the default name.
function pdfImportToSketch(res, picked) {
  const names = [...new Set(picked.map(r => r.f.building || ''))];
  const nameOf = r => names.length > 1 ? (r.f.building || DEFAULT_BUILDING) : DEFAULT_BUILDING;
  const shapes = [], labels = [];
  let nextX = 0;
  names.forEach(n => {
    const group = picked.filter(r => (r.f.building || '') === n);
    const all = group.flatMap(r => r.f.points);   // floors arrive already stacked
    const ox = Math.min(...all.map(p => p.x)), oy = Math.min(...all.map(p => p.y));
    const w = Math.max(...all.map(p => p.x)) - ox;
    group.forEach(r => {
      const pts = r.f.points.map(p => ({ x: +(p.x - ox + nextX).toFixed(4), y: +(p.y - oy).toFixed(4) }));
      const sh = { id: 0, label: r.f.title, type: r.type, floor: r.floor, building: nameOf(r),
                   points: [...pts, { ...pts[0] }], segments: [] };
      rebuildSegments(sh);
      Object.defineProperty(sh, 'importKind', { value: r.f.kind, enumerable: false });   // not saved
      shapes.push(sh);
      // A scan's interior goes on the area, relative to its first corner, so it
      // moves with the area; it is drawn for a detailed plan and never counted.
      if (r.f.detail) {
        const rel = p => ({ x: +(p.x - ox + nextX - pts[0].x).toFixed(4), y: +(p.y - oy - pts[0].y).toFixed(4) });
        sh.detail = { lines: r.f.detail.lines.map(l => ({ a: rel(l.a), b: rel(l.b), kind: l.kind, ...(l.hinge ? { hinge: l.hinge, side: l.side, style: l.style } : {}) })),
                      rooms: r.f.detail.rooms.map(rm => ({ ...rel(rm), name: rm.name })),
                      stairs: { pieces: (r.f.detail.stairs?.pieces || []).map(p => ({ outline: p.outline.map(rel), treads: p.treads.map(t => t.map(rel)) })),
                                paths: (r.f.detail.stairs?.paths || []).map(p => ({ points: p.points.map(rel), label: p.label })) } };
      }
      // Walls a scan's fit calculated rather than measured.
      if ((r.f.calcWalls || []).length) sh.calc = Object.fromEntries(r.f.calcWalls.map(i => [i, true]));
    });
    nextX += w + 20;
  });
  const d = { shapes, labels, floors: [...new Set(picked.map(r => r.floor))], subject: res.address || '', basements: {} };
  [...new Set(shapes.map(sh => sh.building))].forEach(b => {
    const bs = shapes.filter(sh => sh.building === b && sh.floor === 'basement' && sh.importKind === 'floor');
    if (bs.length) d.basements[b] = { areaOverride: Math.round(bs.reduce((a, sh) => a + shapeArea(sh), 0)), pctFinished: 100 };
  });
  return d;
}

function newProject() {
  const hasWork = state.shapes.length || state.segments.length || state.annotations.length || (state.subject || '').trim();
  if (hasWork) {
    if (!confirm('Discard the current sketch and start a new project?\n\n(Use Undo / Ctrl+Z to recover if you change your mind.)')) return;
  }
  pushUndo();
  userView = null;
  state.shapes = [];
  state.segments = [];
  state.startPoint = null;
  state.annotations = [];
  state.basements = {};
  state.labels = [];
  state.nextLabelId = 1;
  state.selectedLabel = null;
  state.labelDrag = null;
  state.shapeLabelDrag = null; state.dimLabelDrag = null; state.shapeMovePick = null;
  state.subject = '';
  state.subtitle = '';
  state.floors = ['basement', 'main', 'upper', 'other'];
  state.buildings = [...BUILDINGS];
  state.viewBuilding = 'all';
  markedBuildings.clear();
  state.activeFloor = 'main';
  state.nextShapeId = 1;
  state.selection = null;
  state.splitSelection = null;
  state.preview = null;
  state.splitPreview = null;
  state.fenceSelection = null;
  state.fenceDraw = null;
  state.offsetPick = null;
  state.mode = 'walk';
  const subjInp = document.getElementById('subject-input'); if (subjInp) subjInp.value = '';
  dropFileHandle();   // a fresh project must never autosave over the previous file
  render();
  setTimeout(focusWalkInput, 0);
}
function applyLoadedProject(text) {
  const d = JSON.parse(text);
  userView = null;
  Object.assign(state, d);
  state.settings = { ...SETTINGS_DEFAULTS, ...(d.settings || {}) };   // older files lack newer keys
  state.selection = null; state.splitSelection = null;
  state.labels = d.labels || []; state.nextLabelId = d.nextLabelId || 1;
  state.basements = d.basements || {};
  state.buildings = normalizeBuildings(d.buildings);      // older files: the five defaults plus whatever the shapes use
  state.viewBuilding = d.viewBuilding || 'all';
  markedBuildings.clear();
  state.selectedLabel = null; state.labelDrag = null; state.shapeLabelDrag = null; state.dimLabelDrag = null; state.shapeMovePick = null;
  const subjInp = document.getElementById('subject-input');
  if (subjInp) subjInp.value = state.subject || '';
  saveToRecents();  // also add loaded sketch to recents so it's reloadable
  render();
  setTimeout(focusWalkInput, 0);
}
// Plain <input type=file> path (Firefox/Safari, or when the picker is unavailable): no handle, so no file autosave.
document.getElementById('load-json').addEventListener('change', (e) => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try { applyLoadedProject(r.result); dropFileHandle(); }
    catch (err) { alert('Load failed: '+err.message); }
  };
  r.readAsText(f);
  e.target.value = '';
});
// Chrome/Edge: open through the file picker instead, so we get a writable handle
// and can autosave straight back to the file that was loaded.
document.getElementById('load-label').addEventListener('click', async (e) => {
  if (!fileAutosaveSupported) return;   // let the <input type=file> open as usual
  e.preventDefault();
  let handle;
  try {
    [handle] = await window.showOpenFilePicker({
      types: [{ description: 'CValRSketch JSON', accept: { 'application/json': ['.json'] } }],
      multiple: false,
    });
  } catch (err) { return; }             // cancelled
  try {
    const file = await handle.getFile();
    applyLoadedProject(await file.text());
    setFileHandle(handle);
    fileAutosave.lastPayload = serializeProject();   // file and state agree right now; write on the next change
    renderAutosaveChip();
  } catch (err) { alert('Load failed: ' + err.message); }
});

function triggerDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

// Best-available "save this blob" path:
//   1) File System Access API (Chrome/Edge/Opera) — real Save As dialog with
//      folder navigation + Create New Folder. Browser remembers the last folder
//      for this app + file type, so the next save defaults there.
//   2) Web Share API with files (mobile) — share sheet incl. "Save to Files".
//   3) Fallback: direct download to the browser's default Downloads folder.
async function saveBlob(blob, filename, mime) {
  if (window.showSaveFilePicker) {
    try {
      const ext = '.' + (filename.split('.').pop() || 'bin');
      const handle = await window.showSaveFilePicker({
        suggestedName: filename,
        startIn: 'documents',
        types: [{ description: ext.slice(1).toUpperCase() + ' file', accept: { [mime]: [ext] } }],
      });
      const writable = await handle.createWritable();
      await writable.write(blob);
      await writable.close();
      return handle;   // callers that want to keep writing here (file autosave) get the handle
    } catch (e) { if (e && e.name === 'AbortError') return null; }
  }
  if (typeof File !== 'undefined') {
    try {
      const file = new File([blob], filename, { type: mime });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: state.subject || filename });
        return;
      }
    } catch (e) { /* fall through */ }
  }
  triggerDownload(blob, filename);
  return null;
}

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

window.addEventListener('resize', render);
// Touching the shape's colour/pattern controls means "own style" — untick "type default" for the user.
document.addEventListener('input', (e) => {
  if (e.target && (e.target.id === 'sh-color' || e.target.id === 'sh-pattern')) {
    const cb = document.getElementById('sh-style-default'); if (cb) cb.checked = false;
  }
});

window.addEventListener('keydown', (e) => {
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  if (document.getElementById('modal-host')?.childElementCount) return;   // a dialog owns the keyboard; never pull typing into the walk box
  const mod = e.ctrlKey || e.metaKey;
  if (!mod && !e.altKey && (e.key === 'm' || e.key === 'M') && !galleryActive()) { e.preventDefault(); toggleMeasure(); return; }
  if (e.key === 'F1' || (!mod && !e.altKey && e.key === '?')) { e.preventDefault(); openHelp(); return; }
  // Walk mode: a printable key with nothing focused starts typing in the segment box.
  if (!mod && !e.altKey && state.mode === 'walk' && e.key.length === 1 && !galleryActive()) {
    const cmd = document.getElementById('cmd');
    if (cmd) { cmd.focus(); return; }   // the key lands in the newly focused input
  }
  if (e.key === 'Escape' && document.getElementById('floor-menu')) { closeFloorMenu(); return; }
  if (!mod && (e.key === 'PageUp' || e.key === 'PageDown')) { e.preventDefault(); cycleFloor(e.key === 'PageUp' ? -1 : 1); return; }
  if (mod && !e.shiftKey && e.key.toLowerCase() === 'z') { e.preventDefault(); undoHistory(); }
  else if (mod && !e.shiftKey && e.key.toLowerCase() === 's') { e.preventDefault(); saveJSON(); }
  else if (mod && (e.key.toLowerCase() === 'y' || (e.shiftKey && e.key.toLowerCase() === 'z'))) { e.preventDefault(); redoHistory(); }
  else if (e.key === 'Escape' && state.underlayCal) { cancelUnderlayCal(); }
  else if (e.key === 'Escape' && state.offsetPick) { if (state.offsetPick.first) { state.offsetPick.first = null; render(); } else cancelOffsetPick(); }
  else if (e.key === 'Escape' && state.shapeMovePick) { cancelShapeMovePick(); }
  else if (currentWallRemoval() && (e.key === 'Tab' || e.key === 'n' || e.key === 'N')) { e.preventDefault(); nextWallRemoval(e.shiftKey ? -1 : 1); }
  else if (currentWallRemoval() && e.key === 'Enter') { e.preventDefault(); applyWallRemoval(); }
  else if (e.key === 'Escape' && currentWallRemoval()) { cancelWallRemoval(); }
  else if (e.key === 'Escape' && state.mode === 'edit' && state.selection) { state.selection = null; render(); }
  else if ((e.key === 'Delete' || e.key === 'Backspace') && state.mode === 'fence' && state.fenceSelection) { e.preventDefault(); deleteFenced(); }
  else if (e.key === 'Escape' && state.mode === 'fence' && (state.fenceSelection || state.fenceDraw)) { state.fenceDraw = null; state.fenceSelection = null; render(); }
  else if (state.mode === 'text' && state.selectedLabel !== null && (e.key === 'Delete' || e.key === 'Backspace')) { e.preventDefault(); deleteLabel(state.selectedLabel); }
  else if (e.key === 'Escape' && state.mode === 'text' && state.selectedLabel !== null) { state.selectedLabel = null; render(); }
  else if (e.shiftKey && !mod && state.mode === 'walk' && state.segments.length === 0 && state.startPoint !== null &&
           (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
    e.preventDefault();
    if (e.key === 'ArrowLeft') stepStartAlign('x', -1);
    else if (e.key === 'ArrowRight') stepStartAlign('x', 1);
    else if (e.key === 'ArrowUp') stepStartAlign('y', -1);
    else if (e.key === 'ArrowDown') stepStartAlign('y', 1);
  }
});

autoRestoreSession();   // silently reopen the last session before the first paint
if (helpPrefs().pinned && helpPrefs().open) openHelp();   // a pinned Help panel comes back with the app
restoreFileHandle();    // pick the autosave file back up (or offer to resume it)
render();
setTimeout(focusWalkInput, 0);
window.addEventListener('beforeunload', writeAutosave);  // flush the debounce gap on reload/close

// Register service worker for offline PWA install. Skipped on file:// (no SW support there).
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW registration failed:', err));
  });
}
</script>
