<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b3a4a">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>CValR-Sketch</title>
<script src="core.js?v=0.44.1"></script>
<script src="dictation.js?v=0.44.1"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, Segoe UI, Arial, sans-serif; background: #f0f0f0; color: #222; }
  header { background: #2b3a4a; color: #fff; padding: 8px 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; }
  header .version-chip { font-size: 11px; color: #9fb0c2; font-family: ui-monospace, monospace; }
  header .osasi-chip { font-size: 11px; color: #cfe0f0; text-decoration: none; border: 1px solid #5a7388; border-radius: 10px; padding: 2px 8px; white-space: nowrap; }
  header .osasi-chip:hover { background: #4a6377; color: #fff; }
  header .osasi-chip b { color: #FF7440; font-weight: 700; }
  header .osasi-chip:hover b { color: #FF8A5F; }
  .whatsnew-modal ul { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.45; }
  .help-panel { position: fixed; z-index: 900; display: flex; flex-direction: column; min-width: 260px; min-height: 140px;
    background: #fff; border: 1px solid #b8c4d0; border-radius: 8px; box-shadow: 0 8px 28px rgba(0,0,0,.25); resize: both; overflow: hidden; }
  .help-bar { display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: #2b3a4a; color: #fff; cursor: move; user-select: none; font-size: 13px; }
  .help-bar button { background: #4a6377; color: #fff; border: none; border-radius: 4px; padding: 2px 8px; cursor: pointer; font-size: 12px; }
  .help-bar button:hover { background: #5a7388; }
  .help-bar .help-pin { opacity: .55; }
  .help-bar .help-pin.on { opacity: 1; background: #d97706; }
  .help-pinned-tag { font-size: 11px; color: #f6c27a; margin-left: 4px; }
  .help-body { flex: 1; overflow-y: auto; padding: 4px 12px 10px; }
  .help-body h4 { margin: 12px 0 4px; font-size: 13px; color: #2b3a4a; }
  .help-nav { position: sticky; top: 0; z-index: 1; background: #fff; display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 0; border-bottom: 1px solid #e3e8ee; }
  .help-nav a { font-size: 11px; padding: 2px 7px; border: 1px solid #c9d3dd; border-radius: 10px; color: #2b3a4a; text-decoration: none; }
  .help-nav a.on { background: #2b6cb0; border-color: #2b6cb0; color: #fff; }
  .help-nav a.now { border: 1px dashed #2b6cb0; color: #2b6cb0; }
  .help-nav a[data-follow].on { background: #2f855a; border-color: #2f855a; }
  .help-nav a[data-all] { margin-left: auto; }
  .help-do-row { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 6px; }
  .help-do { font-size: 11px; padding: 2px 8px; border-radius: 4px; background: #fff7e6; border: 1px solid #f0b45a; color: #8a4b00; text-decoration: none; }
  .help-do:hover { background: #ffe9c2; }
  .help-do.help-missing { background: #f3f4f6; border-color: #c7ccd3; color: #6b7280; }
  .help-spot { outline: 3px solid #f59e0b !important; outline-offset: 2px; position: relative; z-index: 5; }
  .help-flash { animation: helpFlash 0.8s ease-in-out 3; outline-offset: 2px; position: relative; z-index: 5; }
  @keyframes helpFlash { 0%, 100% { outline: 3px solid rgba(245,158,11,0); box-shadow: 0 0 0 0 rgba(245,158,11,0); } 50% { outline: 3px solid #f59e0b; box-shadow: 0 0 0 6px rgba(245,158,11,.35); } }
  .help-body section { border-left: 3px solid transparent; padding-left: 7px; margin-left: -10px; }
  .help-body section.here { border-left-color: #2b6cb0; background: #f5f9fd; }
  .help-body p { margin: 0 0 6px; font-size: 13px; line-height: 1.45; }
  .help-body code { background: #eef2f6; padding: 0 3px; border-radius: 3px; }
  .whatsnew-modal li { margin-bottom: 6px; }
  .whatsnew-modal .ver { font-family: ui-monospace, monospace; color: #2b6cb0; font-weight: 700; }
  .about-modal p { margin: 0 0 10px; font-size: 13px; line-height: 1.45; }
  .legal-modal pre { max-height: 60vh; overflow: auto; white-space: pre-wrap; font-size: 11.5px; line-height: 1.4; background: #f6f7f9; border: 1px solid #dde2e8; padding: 10px; margin: 0; }
  .about-modal a { color: #2b6cb0; }
  header button, header label.btn { background: #4a6377; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  header button:hover, header label.btn:hover { background: #5a7388; }
  header button:disabled { background: #3a4554; color: #6a7484; cursor: not-allowed; }
  header .sep { width: 1px; background: #4a6377; height: 22px; }
  header .autosave-chip { font-size: 11px; color: #9fb0c2; font-family: ui-monospace, monospace; padding: 4px 9px; border-radius: 10px; background: #34465a; white-space: nowrap; max-width: 340px; overflow: hidden; text-overflow: ellipsis; }
  header .autosave-chip.saved { color: #b7e4c7; }
  header .autosave-chip.saving { color: #ffe08a; }
  header .autosave-chip.paused { color: #ffd166; cursor: pointer; }
  header .autosave-chip.error { color: #ffb4a2; cursor: pointer; }
  .mode-tabs { display: flex; gap: 0; border: 1px solid #4a6377; border-radius: 4px; overflow: hidden; }
  .mode-tabs button { background: #3a4d61; border-radius: 0; padding: 6px 14px; }
  .mode-tabs button.active { background: #2b6cb0; }
  main { display: flex; height: calc(100vh - 90px); }
  #canvas-wrap { flex: 1; background: #fff; position: relative; overflow: hidden; }
  #canvas { display: block; width: 100%; height: 100%; cursor: default; }
  #canvas.split-mode { cursor: crosshair; }
  #canvas.measuring { cursor: crosshair; }
  #canvas.pan-mode { cursor: grab; }
  #canvas.vertex-dragging, #canvas.vertex-dragging * { cursor: crosshair !important; }
  #zoom-bar { position: absolute; left: 10px; bottom: 10px; display: flex; align-items: center; gap: 4px; background: rgba(255,255,255,.92);
    border: 1px solid #c9d3dd; border-radius: 8px; padding: 3px 5px; box-shadow: 0 2px 8px rgba(0,0,0,.12); z-index: 5; font-size: 12px; }
  #zoom-bar button { border: 1px solid #c9d3dd; background: #fff; border-radius: 5px; min-width: 26px; height: 24px; cursor: pointer; font-size: 13px; color: #2b3a4a; }
  #zoom-bar button:hover { background: #eef3f8; }
  #zoom-bar button.on { background: #2b6cb0; border-color: #2b6cb0; color: #fff; }
  #zoom-bar .zb-pct { min-width: 38px; text-align: center; color: #2b3a4a; font-variant-numeric: tabular-nums; }
  .pdfimp-table th, .pdfimp-table td { padding: 4px 5px; vertical-align: top; }
  .pdfimp-table td:nth-last-child(-n+3), .pdfimp-table th:nth-last-child(-n+3) { white-space: nowrap; }
  .pdfimp-table select { max-width: 150px; font-size: 12px; }
  header button.measure-on { background: #d946ef; }
  header button.measure-on:hover { background: #c026d3; }
  /* In Text mode the whole drawing is click-through so notes can be placed over
     areas; only the free-text labels themselves stay interactive. */
  #canvas.text-mode { cursor: text; }
  #canvas.text-mode > :not(.free-label) { pointer-events: none; }
  #floor-bar { background: #eef2f6; border-bottom: 1px solid #d0d8e0; padding: 6px 14px; display: flex; align-items: center; gap: 8px; font-size: 12px; }
  #floor-bar .ft-tabs { display: flex; gap: 4px; }
  #floor-bar .ft-tabs button { background: #fff; border: 1px solid #c0c8d0; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  #floor-bar .ft-tabs button.active { background: #2b6cb0; color: #fff; border-color: #2b6cb0; }
  #floor-bar .small-btn { background: #fff; border: 1px solid #c0c8d0; padding: 3px 7px; border-radius: 4px; cursor: pointer; font-size: 11px; }
  aside { width: 360px; background: #fafafa; border-left: 1px solid #ccc; padding: 12px; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 10px; }
  aside h2 { font-size: 11px; margin: 0 0 6px; text-transform: uppercase; letter-spacing: 0.5px; color: #555; }
  .section { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 10px; min-width: 0; }
  /* Text inputs have an intrinsic minimum width; without min-width:0 the row overflowed
     the sidebar and the buttons ran off the right edge. Wrap as a last resort. */
  .input-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .input-row input { flex: 1 1 120px; min-width: 0; padding: 6px 8px; border: 1px solid #bbb; border-radius: 4px; font-family: monospace; font-size: 13px; }
  .input-row button { flex: 0 0 auto; white-space: nowrap; background: #2b6cb0; color: #fff; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  .input-row button:hover { background: #3577c2; }
  .row-buttons { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .row-buttons button { flex: 1; background: #6c7a8a; color: #fff; border: none; padding: 6px; border-radius: 4px; cursor: pointer; font-size: 11px; min-width: 70px; }
  .row-buttons button:hover { background: #7d8c9d; }
  .row-buttons button.primary { background: #2e8b57; }
  /* Compass pad: click a direction instead of typing u/d/l/r */
  .bm-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .bm-table th, .bm-table td { padding: 5px 6px; border-bottom: 1px solid #e3e8ee; text-align: left; vertical-align: middle; }
  .bm-table th { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: #666; }
  .bm-btn { background: #6c7a8a; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }
  .bm-btn.bm-danger { background: #c0392b; }
  .bm-merge { font-size: 11px; padding: 3px 4px; margin: 0 4px; border: 1px solid #c0c8d0; border-radius: 4px; max-width: 130px; }
  .rose-row { display: flex; gap: 10px; align-items: flex-start; margin-top: 8px; }
  .rose-row svg { flex: 0 0 auto; }
  .rose-side { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
  .rose-step { font-size: 11px; color: #555; display: flex; align-items: center; gap: 6px; }
  .rose-step select, #rose-list { font-size: 11px; border: 1px solid #c0c8d0; border-radius: 4px; background: #fff; }
  #rose-list { width: 100%; padding: 2px; }
  .rose-wedge { fill: #eef2f6; stroke: #fff; stroke-width: 1.5; cursor: pointer; }
  .rose-wedge.cardinal { fill: #e3e9f0; }
  .rose-wedge:hover, .rose-wedge.hover { fill: #cfe0f4; }
  .rose-wedge.sel { fill: #2b6cb0; }
  .rose-label { font: 600 10px Arial, sans-serif; fill: #2b3a4a; pointer-events: none; text-anchor: middle; dominant-baseline: middle; }
  .rose-label.fine { font-size: 8px; font-weight: 500; }
  .rose-label.sel { fill: #fff; }
  .rose-hub { fill: #fff; stroke: #c0c8d0; }
  .enclose-box { background: #fffbd6; border: 2px solid #e6b800; }
  .enclose-box h2 { color: #8a6d00; }
  .close-box { background: #e9f7ef; border: 2px solid #2e8b57; }
  .close-box h2 { color: #1f6b43; }
  .type-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 6px 0 8px; }
  .type-btn { display: flex; align-items: center; gap: 7px; padding: 6px 8px; border: 1px solid #c9d3dc; border-radius: 5px; background: #fff; cursor: pointer; font-size: 12px; text-align: left; line-height: 1.2; }
  .type-btn:hover { background: #f4f7fa; }
  .type-btn.sel { border-color: #2b6cb0; background: #e8f0fa; box-shadow: inset 0 0 0 1px #2b6cb0; }
  .type-btn .sw { flex: 0 0 16px; width: 16px; height: 16px; border-radius: 3px; border: 1px solid #b8c2cc; }
  .type-btn small { display: block; color: #7a8792; font-size: 10px; }
  .compass { display: grid; grid-template-columns: repeat(3, 34px); grid-template-rows: repeat(3, 30px); gap: 3px; margin-top: 8px; justify-content: start; align-items: stretch; }
  .compass button { background: #eef2f6; color: #2b3a4a; border: 1px solid #c0c8d0; border-radius: 4px; cursor: pointer; font-size: 15px; line-height: 1; padding: 0; }
  .compass button:hover { background: #2b6cb0; color: #fff; border-color: #2b6cb0; }
  .compass .compass__hint { grid-column: 1 / 4; font-size: 10px; color: #777; align-self: center; }
  .compass-row { display: flex; gap: 12px; align-items: flex-start; }
  .compass-angle { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; font-size: 11px; color: #555; }
  .compass-angle select { font-size: 12px; padding: 4px 6px; border: 1px solid #c0c8d0; border-radius: 4px; background: #fff; }
  .compass-row .help { flex: 1; margin-top: 8px; }
  .row-buttons button.primary:hover { background: #379a64; }
  .row-buttons button.danger { background: #c44; }
  .help { font-size: 11px; color: #666; line-height: 1.5; }
  .help code { background: #eef; padding: 1px 4px; border-radius: 3px; color: #224; }
  .pen-indicator { font-family: monospace; font-size: 11px; color: #555; margin-top: 4px; }
  .seg-item { display: flex; justify-content: space-between; padding: 4px 7px; background: #f4f7fa; border-radius: 3px; margin-bottom: 3px; font-family: monospace; font-size: 11px; }
  .seg-item button { background: none; border: none; color: #c44; cursor: pointer; padding: 0 4px; }
  .shape-item { padding: 8px; border: 1px solid #ddd; border-radius: 4px; margin-bottom: 6px; background: #fff; }
  .shape-item.selected { border-color: #2b6cb0; box-shadow: 0 0 0 2px rgba(43,108,176,0.15); }
  .shape-item .hdr { display: flex; justify-content: space-between; font-weight: 500; font-size: 13px; }
  .shape-item .meta { font-size: 11px; color: #666; margin-top: 2px; }
  .shape-item .actions { margin-top: 5px; display: flex; gap: 4px; flex-wrap: wrap; }
  .shape-item .actions button { font-size: 10px; padding: 3px 7px; background: #e0e6ed; border: none; border-radius: 3px; cursor: pointer; }
  .shape-item .actions button.danger { background: #fee; color: #c44; }
  #totals .row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 12px; }
  #totals .row.total { font-weight: bold; border-top: 1px solid #ddd; margin-top: 4px; padding-top: 4px; }
  .field { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 12px; }
  .field label { flex: 0 0 80px; color: #444; }
  .field input, .field select { flex: 1; padding: 5px 7px; border: 1px solid #bbb; border-radius: 4px; font-size: 12px; }
  .field input.swatch { flex: 0 0 44px; width: 44px; height: 28px; padding: 2px; cursor: pointer; }
  .field label.inline { flex: 1 1 auto; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .field label.inline input { flex: 0 0 auto; width: auto; padding: 0; margin: 0; }
  .closed-badge { color: #2e8b57; font-weight: bold; font-size: 11px; }
  .open-badge { color: #c80; font-size: 11px; }
  /* Modal */
  .modal-bg { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .modal { background: #fff; padding: 20px; border-radius: 8px; max-width: 480px; width: 90%; max-height: 80vh; overflow-y: auto; }
  .modal h3 { margin: 0 0 12px; font-size: 16px; }
  .modal .radio-group label { display: block; padding: 8px; border: 1px solid #ddd; border-radius: 4px; margin-bottom: 6px; cursor: pointer; }
  .modal .radio-group label:hover { background: #f4f7fa; }
  .modal .radio-group input { margin-right: 8px; }
  .modal-buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .modal-buttons button { padding: 7px 16px; border-radius: 4px; cursor: pointer; border: 1px solid #bbb; background: #f0f0f0; font-size: 13px; }
  .modal-buttons button.primary { background: #2b6cb0; color: #fff; border-color: #2b6cb0; }
  .modal-buttons button.danger { background: #c44; color: #fff; border-color: #c44; }
  .settings-grid { display: grid; gap: 8px; }
  .settings-grid .row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #eee; }
  .settings-grid .row label { font-size: 12px; }
  .settings-grid .row .desc { font-size: 10px; color: #888; margin-top: 2px; }
  /* SVG interactivity */
  .hit-wall { stroke: rgba(0,0,0,0); stroke-width: 14; fill: none; cursor: pointer; }
  .hit-vertex { fill: rgba(0,0,0,0); cursor: pointer; }
  .visible-wall.selected { stroke: #2b6cb0 !important; stroke-width: 4 !important; }
  .visible-vertex { fill: #fff; stroke: #444; stroke-width: 1.5; }
  .visible-vertex.selected { fill: #2b6cb0; stroke: #fff; }
  .visible-vertex.split-hover { fill: #ffa500; stroke: #fff; }
  .visible-vertex.pickable { fill: #d4edda; stroke: #2e8b57; stroke-width: 2; }
  .ghost { opacity: var(--ghost-opacity, 0.45); pointer-events: none; }
  /* Building gallery (Building: All with several buildings in the file) */
  /* Floor menu: double-click a blank spot on the canvas */
  .floor-menu { position: fixed; background: #fff; border: 1px solid #c0c8d0; border-radius: 6px; box-shadow: 0 4px 14px rgba(0,0,0,0.18); padding: 6px; z-index: 200; font-size: 12px; min-width: 190px; }
  .floor-menu h4 { margin: 0 0 4px; padding: 0 8px; font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: 0.5px; }
  .floor-menu button { display: flex; width: 100%; justify-content: space-between; gap: 14px; background: #fff; border: none; padding: 5px 8px; border-radius: 4px; cursor: pointer; text-align: left; font-size: 12px; }
  .floor-menu button:hover { background: #eef2f6; }
  .floor-menu button.active { background: #2b6cb0; color: #fff; }
  .floor-menu button span.area { color: #888; font-family: ui-monospace, monospace; }
  .floor-menu button.active span.area { color: #dbe7f3; }
  .floor-menu .hint { padding: 4px 8px 0; font-size: 10px; color: #888; }
  .gallery-frame { fill: #fff; stroke: #c0c8d0; stroke-width: 1.5; cursor: pointer; }
  .gallery-panel:hover .gallery-frame { stroke: #2b6cb0; stroke-width: 2.5; }
  .gallery-caption { font: bold 13px Arial, sans-serif; fill: #2b3a4a; pointer-events: none; }
  .gallery-mark { cursor: pointer; }
  .gallery-mark rect { fill: #fff; stroke: #c0392b; stroke-width: 1.5; }
  .gallery-mark:hover rect { fill: #fdecea; }
  .gallery-mark text { font: bold 15px Arial, sans-serif; fill: #c0392b; pointer-events: none; }
  .gallery-panel.marked .gallery-frame { stroke: #c0392b; stroke-width: 2.5; stroke-dasharray: 8 5; fill: #fff5f4; }
  .gallery-panel.marked .gallery-caption { fill: #c0392b; }
  #floor-bar .mark-box { display: none; align-items: center; gap: 5px; margin-left: 10px; font-size: 11px; color: #c0392b; white-space: nowrap; }
  #floor-bar .mark-box.show { display: flex; }
  #floor-bar .small-btn.danger { background: #c0392b; color: #fff; border-color: #a93226; }
  #floor-bar #building-select { font-size: 12px; padding: 3px 6px; border: 1px solid #c0c8d0; border-radius: 4px; background: #fff; }
</style>
</head>
<body>
<header>
  <h1>CValR-Sketch</h1>
  <span class="version-chip" id="app-version">v0.44.1</span>
  <button onclick="openAbout()" title="About CValR-Sketch — licence, source, OSASI">ⓘ About</button>
  <button onclick="openWhatsNew()" title="What changed in recent releases">✨ What's new</button>
  <button onclick="openHelp()" title="Help for the tool you are using (F1 or ?) — follows you as you switch modes">❓ Help</button>
  <a class="osasi-chip" href="https://osasi.org" target="_blank" rel="noopener" title="CValRSketch is part of OSASI, the Open Source Appraisal Software Initiative — free software under AGPL-3.0">provided by <b>osasi.org</b></a>
  <div class="mode-tabs" id="mode-tabs">
    <button data-mode="walk" class="active">Walk</button>
    <button data-mode="edit">Edit</button>
    <button data-mode="split">Split</button>
    <button data-mode="fence">Fence</button>
    <button data-mode="text">Text</button>
    <button data-mode="underlay" title="Trace over a scanned or photographed plan">Image</button>
  </div>
  <button id="btn-measure" onclick="toggleMeasure()" title="Measure between any two points (M). Corners and walls snap; Alt = free point, Shift = level/plumb.">📏 Measure</button>
  <div class="sep"></div>
  <button id="btn-undo" onclick="undoHistory()" title="Undo (Ctrl+Z)">↶ Undo</button>

<!-- Modal containers -->
<div id="modal-host"></div>

<script>
// =============================================================================
// Configuration, parsing, geometry, and edit-op helpers live in core.js
// (loaded via <script src="core.js"> in <head> above). They expose: TYPES,
// DIR_BASE, SETTINGS_DEFAULTS, HISTORY_LIMIT, EXPORT_PAGE_SIZES, parseLength,
// parseSegment, headingDeg, formatLength, formatGapBreakdown, pathPoints,
// polygonArea, polygonCentroid, wallVector/Length/Unit, findOpposingWall,
// rebuildSegments, syncClosure, setWallLength, moveWallByVector,
// moveVertexByVector, insertVertexOnWall, deleteVertex, findAlignedCandidates.
// =============================================================================

// =============================================================================
// STATE
// =============================================================================
let state = {
  segments: [],         // in-progress walking segments
  shapes: [],           // completed shapes (each: {id, points, segments, label, type, floor})
  floors: ['basement','main','upper','other'],
  activeFloor: 'main',
  buildings: [...BUILDINGS],  // named buildings in this file (the five defaults plus any added); shapes reference them by name
  viewBuilding: 'all',  // canvas filter: 'all' or one building name; 'all' with several buildings shows the gallery
  selection: null,      // {kind:'wall'|'vertex'|'shape', shapeId, idx?}
  splitSelection: null, // {shapeId, idx} for first vertex in split
  mode: 'walk',         // 'walk' | 'edit' | 'split'
  nextShapeId: 1,
  startPoint: null,     // origin of current walk; null = (0,0)
  preview: null,        // walk-mode auto-extend preview: { dir, candIdx, candidates: [{along, point, segment}] }
  splitPreview: null,
  enclose: null,       // { key, idx, off } for the enclosed-area offer at the current pen position   // split-mode projection preview: { shapeId, originIdx, dir, hit: {wallIdx, point, distance} }
  undoStack: [],
  redoStack: [],
  annotations: [],      // [{ a:{x,y}, b:{x,y}, floor }] — measurement labels between two points (no floor = legacy, shown on every floor)
  basements: {},        // { [building]: { areaOverride: number|null, pctFinished: number } } — declared below-grade area
  labels: [],           // [{ id, x, y, text, floor }] — free-text labels in WORLD coords
  nextLabelId: 1,
  selectedLabel: null,  // id of the currently selected free-text label (Text mode)
  labelDrag: null,      // transient: { id, grabX, grabY, moved } while dragging a label
  shapeLabelDrag: null, // transient: while dragging a shape's area/centroid label
  dimLabelDrag: null,   // transient: while dragging a wall's dimension label
  shapeMovePick: null,  // transient: { shapeId, anchor } while moving a shape by picking anchor -> destination
  rewalk: null,         // { original } while a shape is reopened as a walk (Re-walk this wall); closeShape re-applies its attributes
  offsetPick: null,     // null | { first: {x,y}|null, hover: {p,kind}|null } — Measure tool armed; stays armed until Esc/Done
  fenceDraw: null,      // null | { start:{x,y}, end:{x,y} } in WORLD coords while dragging
  fenceSelection: null, // null | { shapeVerts:[{shapeId,idx}], inProgVerts:[idx], annEnds:[{idx,end}] }
  underlay: null,       // { src, w, h, x, y, ftPerPx, opacity, floor, locked, name } — scan to trace over
  underlayDrag: null,   // transient: { grabX, grabY } while dragging the underlay
  underlayCal: null,    // transient: { first } while picking the two calibration points
  traceClick: false,    // transient: Walk "click corners" tracing over the image is on
  traceStarted: false,  // transient: the first click (the start corner) has been placed
  traceHover: null,     // transient: { p, kind } where the next click would land
  subject: '',          // project/property name shown as title on exports
  subtitle: '',         // optional secondary line under the title
  settings: { ...SETTINGS_DEFAULTS },
};

let viewTransform = null; // { tx, ty, scale } from latest fitView, used for screen↔world
// The reader's zoom/pan, same shape as fitView()'s result, or null for the automatic
// fit. Exports and the gallery always use the fit (see withFitView).
let userView = null;

function snapshotState() {
  return JSON.stringify({
    segments: state.segments,
    shapes: state.shapes,
    floors: state.floors,
    buildings: state.buildings,
    activeFloor: state.activeFloor,
    nextShapeId: state.nextShapeId,
    startPoint: state.startPoint,
    annotations: state.annotations,
    basements: state.basements,
    labels: state.labels,
    nextLabelId: state.nextLabelId,
  });
}
function restoreState(snap) {
  const d = JSON.parse(snap);
  // Keep the selection across undo/redo when it still points at something real.
  const keep = state.selection;
  const keepSh = keep && d.shapes.find(s => s.id === keep.shapeId);
  const keepOk = !!keepSh && (keep.kind === 'shape' || (keep.idx != null && keep.idx < keepSh.points.length - 1));
  state.segments = d.segments;
  state.shapes = d.shapes;
  state.floors = d.floors;
  state.buildings = normalizeBuildings(d.buildings || state.buildings);
  state.activeFloor = d.activeFloor;
  state.nextShapeId = d.nextShapeId;
  state.startPoint = d.startPoint;
  state.annotations = d.annotations || [];
  state.basements = d.basements || {};
  state.labels = d.labels || [];
  state.nextLabelId = d.nextLabelId || 1;
  state.selection = keepOk ? keep : null;
  state.rewalk = null;
  state.selectedLabel = null;
  state.labelDrag = null;
  state.shapeLabelDrag = null; state.dimLabelDrag = null; state.shapeMovePick = null;
  state.fenceSelection = null;
  state.fenceDraw = null;
  state.splitSelection = null;
  state.wallRemoval = null;
  state.vertexDrag = null;
}

// ----- Session autosave / crash recovery (localStorage-backed) --------------
// Mirrors the working sketch to localStorage so a reload, tab-close, or crash
// (e.g. an accidental Ctrl+R) doesn't lose in-progress work. The slot always
// reflects the latest state, so startup silently restores exactly where you left
// off — no prompt. Separate from the named "recent projects" store.
const AUTOSAVE_KEY = 'cvalrsketch:autosave';
let _autosaveTimer = null;
function writeAutosave() {
  try { localStorage.setItem(AUTOSAVE_KEY, JSON.stringify({ at: Date.now(), snap: snapshotState(), subject: state.subject, subtitle: state.subtitle })); }
  catch (e) { /* quota / private mode — non-fatal */ }
}
function scheduleAutosave() {
  scheduleFileAutosave();                // file autosave rides the same change signal
  if (_autosaveTimer) return;            // coalesce bursts of renders into one write
  _autosaveTimer = setTimeout(() => { _autosaveTimer = null; writeAutosave(); }, 800);
}
function autoRestoreSession() {
  let saved;
  try { saved = JSON.parse(localStorage.getItem(AUTOSAVE_KEY) || 'null'); } catch (e) { return; }
  if (!saved || !saved.snap) return;
  try {
    restoreState(saved.snap);            // restoreState resets transient UI fields itself
    // Title fields live outside the undo snapshot, so carry them separately.
    if (typeof saved.subject === 'string') state.subject = saved.subject;
    if (typeof saved.subtitle === 'string') state.subtitle = saved.subtitle;
    const subjInp = document.getElementById('subject-input');
    if (subjInp) subjInp.value = state.subject || '';
  }
  catch (e) { /* corrupt slot — ignore and start fresh */ }
}

// ----- File autosave (File System Access API — Chrome / Edge) ----------------
// After a Save As, or a Load through the file picker, we keep the file's handle
// and rewrite the file a moment after every change, so the JSON in the workfile
// is always current. The handle is remembered in IndexedDB so the next visit can
// offer "resume" — the browser insists on one click to re-grant write access.
// Session autosave (above) stays independent: that is the crash net, this is the file.
const FILE_AUTOSAVE_DEBOUNCE_MS = 2000;
const fileAutosaveSupported = !!(window.showSaveFilePicker && window.showOpenFilePicker);
const fileAutosave = { handle: null, name: '', status: 'off', lastAt: null, lastPayload: null, timer: null, writing: false };

// What Save writes and what autosave keeps current. Undo history and transient UI
// state are per-session and deliberately left out of the file.
function serializeProject() {
  const data = { ...state };
  ['undoStack', 'redoStack', 'selection', 'splitSelection', 'preview', 'splitPreview', 'underlayDrag', 'underlayCal',
   'selectedLabel', 'labelDrag', 'shapeLabelDrag', 'dimLabelDrag', 'shapeMovePick', 'rewalk', 'offsetPick', 'fenceDraw', 'fenceSelection']
    .forEach(k => delete data[k]);
  return JSON.stringify(data, null, 2);
}

function setFileHandle(handle) {
  fileAutosave.handle = handle;
  fileAutosave.name = handle ? handle.name : '';
  fileAutosave.status = handle ? 'armed' : 'off';
  fileAutosave.lastAt = null;
  fileAutosave.lastPayload = null;
  idbSet('fileHandle', handle || null);
  renderAutosaveChip();
}
function dropFileHandle() { if (fileAutosave.handle) setFileHandle(null); }

function scheduleFileAutosave() {
  if (!fileAutosave.handle || !state.settings.autosaveToFile) return;
  if (fileAutosave.status === 'paused' || fileAutosave.timer) return;
  fileAutosave.timer = setTimeout(() => { fileAutosave.timer = null; writeFileAutosave(); }, FILE_AUTOSAVE_DEBOUNCE_MS);
}
async function writeFileAutosave(force) {
  const h = fileAutosave.handle;
  if (!h) return false;
  const payload = serializeProject();
  if (!force && payload === fileAutosave.lastPayload) return true;   // nothing changed since the last write
  if (fileAutosave.writing) { scheduleFileAutosave(); return false; } // a write is in flight; go again after it
  fileAutosave.writing = true;
  fileAutosave.status = 'saving'; renderAutosaveChip();
  try {
    const w = await h.createWritable();
    await w.write(payload);
    await w.close();
    fileAutosave.lastPayload = payload;
    fileAutosave.lastAt = Date.now();
    fileAutosave.status = 'saved';
    return true;
  } catch (e) {
    // Permission lapses (new browser session, revoked grant) pause rather than fail.
    fileAutosave.status = (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) ? 'paused' : 'error';
    console.warn('File autosave failed:', e);
    return false;
  } finally {
    fileAutosave.writing = false;
    renderAutosaveChip();
  }
}
// Re-grant write access to the remembered file (must run from a click) and resume.
async function resumeFileAutosave() {
  const h = fileAutosave.handle;
  if (!h) return;
  try {
    const perm = await h.requestPermission({ mode: 'readwrite' });
    if (perm !== 'granted') return;
    fileAutosave.status = 'armed';
    await writeFileAutosave(true);
  } catch (e) { fileAutosave.status = 'error'; renderAutosaveChip(); }
}
// On startup: pick the remembered handle back up. If the grant is still live (same
// browser session) autosave just carries on; otherwise the chip offers "resume".
async function restoreFileHandle() {
  if (!fileAutosaveSupported) { renderAutosaveChip(); return; }
  const h = await idbGet('fileHandle');
  if (h && typeof h.queryPermission === 'function') {
    fileAutosave.handle = h;
    fileAutosave.name = h.name;
    let perm = 'prompt';
    try { perm = await h.queryPermission({ mode: 'readwrite' }); } catch (e) { /* treat as prompt */ }
    fileAutosave.status = perm === 'granted' ? 'armed' : 'paused';
  }
  renderAutosaveChip();
}
function renderAutosaveChip() {
  const el = document.getElementById('autosave-chip');
  if (!el) return;
  const fa = fileAutosave;
  const at = fa.lastAt ? new Date(fa.lastAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';
  let cls = '', txt = '', title = '';
  if (!fileAutosaveSupported) { txt = 'autosave n/a'; title = 'File autosave needs Chrome or Edge. Session autosave still protects against reloads.'; }
  else if (!state.settings.autosaveToFile) { txt = 'autosave off'; title = 'File autosave is turned off in Settings.'; }
  else if (!fa.handle) { txt = 'autosave: no file yet'; title = 'Save As… or Load a file to start autosaving to it.'; }
  else if (fa.status === 'paused') { cls = 'paused'; txt = `⏸ resume autosave → ${fa.name}`; title = 'Click to re-grant write access and resume autosaving to this file.'; }
  else if (fa.status === 'error') { cls = 'error'; txt = `⚠ autosave failed → ${fa.name}`; title = 'The last write failed. Click to retry.'; }
  else if (fa.status === 'saving') { cls = 'saving'; txt = `… saving ${fa.name}`; title = 'Writing…'; }
  else if (fa.status === 'saved') { cls = 'saved'; txt = `● autosaved ${fa.name} · ${at}`; title = `Last written ${at}. Each change is written about 2 s later.`; }
  else { cls = 'saved'; txt = `● autosaving → ${fa.name}`; title = 'Armed. The next change will be written to this file.'; }
  el.className = 'autosave-chip' + (cls ? ' ' + cls : '');
  el.textContent = txt;
  el.title = title;
}
document.getElementById('autosave-chip').addEventListener('click', () => {
  if (fileAutosave.status === 'paused') resumeFileAutosave();
  else if (fileAutosave.status === 'error') writeFileAutosave(true);
});

// Minimal IndexedDB key/value store — file handles survive a reload here, localStorage can't hold them.
function idbOpen() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) return reject(new Error('no indexedDB'));
    const req = indexedDB.open('cvalrsketch', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('kv');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSet(key, val) {
  try {
    const db = await idbOpen();
    await new Promise((resolve, reject) => {
      const tx = db.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(val, key);
      tx.oncomplete = resolve; tx.onerror = () => reject(tx.error);
    });
  } catch (e) { /* non-fatal: autosave just won't survive a reload */ }
}
async function idbGet(key) {
  try {
    const db = await idbOpen();
    return await new Promise((resolve, reject) => {
      const r = db.transaction('kv', 'readonly').objectStore('kv').get(key);
      r.onsuccess = () => resolve(r.result); r.onerror = () => reject(r.error);
    });
  } catch (e) { return undefined; }
}

// Counts edits, undo and redo included. Stack depths can't stand in for this:
// they plateau at HISTORY_LIMIT, and an undo followed by a retype lands back on
// the number it started from. Used to key the "shape is closed" offer so that
// waving it off sticks for the walk in hand but not past the next change.
let editTick = 0;
function pushUndo() {
  closeUnpinnedHelp();
  editTick++;
  state.undoStack.push(snapshotState());
  if (state.undoStack.length > HISTORY_LIMIT) state.undoStack.shift();
  state.redoStack = [];
}
function undoHistory() {
  if (state.undoStack.length === 0) return;
  editTick++;
  state.redoStack.push(snapshotState());
  restoreState(state.undoStack.pop());
  render();
}
function redoHistory() {
  if (state.redoStack.length === 0) return;
  editTick++;
  state.undoStack.push(snapshotState());
  restoreState(state.redoStack.pop());
  render();
}

function getStart() { return state.startPoint || { x: 0, y: 0 }; }
function setStartPoint(p) { pushUndo(); state.startPoint = { x: p.x, y: p.y }; render(); }
function resetStart() { if (state.startPoint === null) return; pushUndo(); state.startPoint = null; render(); }
function offsetStart() {
  const input = document.getElementById('start-offset');
  if (!input) return;
  const raw = input.value.trim();
  if (!raw) return;
  try {
    const seg = parseSegment(raw);
    pushUndo();
    const cur = getStart();
    state.startPoint = { x: cur.x + seg.dx, y: cur.y + seg.dy };
    input.value = '';
    render();
  } catch (err) { alert(err.message); }
}

// --- Start-point alignment (walk mode) ---------------------------------------
// Click a blank spot to drop the start, then Shift+Arrow to step it onto the next
// active-floor vertex along that axis. Each axis steps independently, so a
// horizontal step followed by a vertical one lands on the intersection without
// dropping the earlier alignment.
function activeFloorVertices() {
  const pts = [];
  for (const sh of shapesOnFloor(state.activeFloor))
    for (let i = 0; i < sh.points.length - 1; i++) pts.push(sh.points[i]);
  return pts;
}
function stepStartAlign(axis, step) {
  if (state.startPoint === null || state.mode !== 'walk' || state.segments.length) return;
  const verts = activeFloorVertices();
  if (!verts.length) return;
  const tol = 1e-4;
  const cur = state.startPoint;
  const curVal = axis === 'x' ? cur.x : cur.y;
  const coords = [...new Set(verts.map(p => axis === 'x' ? p.x : p.y))].sort((a, b) => a - b);
  let target = null;
  if (step > 0) { for (const c of coords) if (c > curVal + tol) { target = c; break; } }
  else { for (let i = coords.length - 1; i >= 0; i--) if (coords[i] < curVal - tol) { target = coords[i]; break; } }
  if (target === null) return; // no further vertex that way — keep the current alignment
  // Mutate in place (no pushUndo per keypress; the initial click already snapshotted,
  // so a single undo clears the whole placement).
  state.startPoint = axis === 'x' ? { x: target, y: cur.y } : { x: cur.x, y: target };
  render();
}

// Load settings from localStorage
try {
  const saved = JSON.parse(localStorage.getItem('sketchWalkerSettings') || '{}');
  loadBrand();
  Object.assign(state.settings, saved);
} catch (e) {}

// =============================================================================
// PAGE-LOCAL HELPERS
// (parsing, formatting, geometry, and edit ops live in core.js)
// =============================================================================

// Page-local wrapper around findAlignedCandidates that pulls start + shapes from `state`.
function findAlignedCandidatesHere(priorSegments, dir) {
  return findAlignedCandidates(priorSegments, dir, getStart(), visibleShapes());
}

// Cast a ray from `origin` in direction `dir` and return the closest forward hit on a wall of `shape`,
// skipping walls adjacent to the origin vertex (passed as `skipVertexIdx`).
function rayHitsWall(origin, dir, shape, skipVertexIdx) {
  const rad = DIR_BASE[dir] * Math.PI / 180;
  const Dx = Math.cos(rad), Dy = Math.sin(rad);
  const n = shape.points.length - 1; // wall count
  const adjA = skipVertexIdx;
  const adjB = (skipVertexIdx - 1 + n) % n;
  let best = null;
  for (let i = 0; i < n; i++) {
    if (i === adjA || i === adjB) continue;
    const a = shape.points[i], b = shape.points[i + 1];
    const wx = b.x - a.x, wy = b.y - a.y;
    const det = wx * Dy - Dx * wy;
    if (Math.abs(det) < 1e-9) continue;
    const aox = a.x - origin.x, aoy = a.y - origin.y;
    const t = (aoy * wx - aox * wy) / det;
    const u = (Dx * aoy - Dy * aox) / det;
    if (t > 0.001 && u >= -0.001 && u <= 1.001) {
      if (!best || t < best.t) {
        best = { wallIdx: i, point: { x: origin.x + t * Dx, y: origin.y + t * Dy }, distance: t, u };
      }
    }
  }
  return best;
}

// =============================================================================
// PAGE-LOCAL: pathPoints wrapper that pulls start from state, and the
// minimum-vertex alert for deleteVertex. (Geometry + edit ops live in core.js.)
// =============================================================================
function pathPointsHere(segs) {
  return pathPoints(segs, getStart());
}

function deleteVertexWithPrompt(shape, vIdx) {
  if (shape.points.length <= 4) {
    alert("Can't delete — shape needs at least 3 walls.");
    return false;
  }
  return deleteVertex(shape, vIdx);
}

function splitPolygon(shape, idx1, idx2) {
  if (idx1 === idx2) return null;
  if (idx1 > idx2) [idx1, idx2] = [idx2, idx1];
  const n = shape.points.length - 1; // not counting closing duplicate
  if (idx2 - idx1 < 2 || (n - idx2 + idx1) < 2) {
    alert('Pick two non-adjacent vertices.');
    return null;
  }
  const pts = shape.points.slice(0, -1);
  // Polygon A: 0..idx1, idx2..end, then close
  const ptsA = [
    ...pts.slice(0, idx1+1),
    ...pts.slice(idx2),
    { ...pts[0] }
  ];
  // Polygon B: idx1..idx2, then close
  const ptsB = [
    ...pts.slice(idx1, idx2+1),
    { ...pts[idx1] }
  ];
  const a = { ...shape, points: ptsA, id: state.nextShapeId++, label: shape.label };
  const b = { ...shape, points: ptsB, id: state.nextShapeId++, label: shape.label + ' (split)' };
  // Walls before idx1 and from idx2 on go to A (with the cut wall at idx1 between
  // them); walls idx1..idx2-1 go to B. Per-wall arcs and label nudges follow.
  const toA = j => j < idx1 ? j : j >= idx2 ? j - idx2 + idx1 + 1 : null;
  const toB = j => (j >= idx1 && j < idx2) ? j - idx1 : null;
  a.arcs = remapByWall(shape.arcs, toA); b.arcs = remapByWall(shape.arcs, toB);
  a.dimOffsets = remapByWall(shape.dimOffsets, toA); b.dimOffsets = remapByWall(shape.dimOffsets, toB);
  a.calc = remapByWall(shape.calc, toA); b.calc = remapByWall(shape.calc, toB);
  rebuildSegments(a); rebuildSegments(b);
  return { a, b };
}

// =============================================================================
// FLOOR MANAGEMENT
// =============================================================================
function addFloor() {
  const name = prompt('New floor name:', 'floor-' + (state.floors.length+1));
  if (!name || state.floors.includes(name)) return;
  pushUndo();
  state.floors.push(name);
  state.activeFloor = name;
  render();
}
function renameFloor() {
  const old = state.activeFloor;
  const name = prompt('Rename floor "' + old + '" to:', old);
  if (!name || name === old || state.floors.includes(name)) return;
  pushUndo();
  state.floors[state.floors.indexOf(old)] = name;
  state.shapes.forEach(s => { if (s.floor === old) s.floor = name; });
  state.annotations.forEach(a => { if (a.floor === old) a.floor = name; });
  state.activeFloor = name;
  render();
}
function removeFloor() {
  const f = state.activeFloor;
  const used = state.shapes.some(s => s.floor === f);
  if (used && !confirm(`Floor "${f}" has shapes on it. Delete them too?`)) return;
  pushUndo();
  state.shapes = state.shapes.filter(s => s.floor !== f);
  state.annotations = state.annotations.filter(a => a.floor !== f);
  state.floors = state.floors.filter(x => x !== f);
  if (!state.floors.length) state.floors = ['main'];
  state.activeFloor = state.floors[0];
  render();
}

// =============================================================================
// CANVAS / RENDER
// =============================================================================
const svg = document.getElementById('canvas');

// ----- Buildings: the file's named list, and the canvas view filter -----------
// Every shape carries a `building` name. The canvas can show all of them or one;
// shapesOnFloor / shapesOnOtherFloors / fitView / snapping all go through
// visibleShapes(), so picking a building scopes editing to it and fits it to the
// window. Floor rename/delete and the totals deliberately still see every shape.
function normalizeBuildings(list) {
  const out = [];
  (Array.isArray(list) && list.length ? list : BUILDINGS).forEach(b => {
    const n = String(b || '').trim();
    if (n && !out.includes(n)) out.push(n);
  });
  state.shapes.forEach(sh => { const b = sh.building || DEFAULT_BUILDING; if (!out.includes(b)) out.push(b); });
  return out;
}
function buildingList() { state.buildings = normalizeBuildings(state.buildings); return state.buildings; }
function viewBuildingOrAll() {
  const v = state.viewBuilding || 'all';
  return (v === 'all' || buildingList().includes(v)) ? v : 'all';
}
function visibleShapes() {
  const v = viewBuildingOrAll();
  return v === 'all' ? state.shapes : state.shapes.filter(sh => (sh.building || DEFAULT_BUILDING) === v);
}
function galleryActive() { return viewBuildingOrAll() === 'all' && buildingsPresent().length > 1; }
function newShapeBuilding() { const v = viewBuildingOrAll(); return v === 'all' ? DEFAULT_BUILDING : v; }
function setViewBuilding(name) {
  state.viewBuilding = name || 'all';
  state.selection = null; state.splitSelection = null; state.fenceSelection = null; state.startPoint = null;
  render();
}
function addBuilding() {
  const name = (prompt('Name of the new building (e.g. Shop, Barn, Guest cabin):') || '').trim();
  if (!name) return;
  if (buildingList().includes(name)) { setViewBuilding(name); return; }
  pushUndo();
  state.buildings.push(name);
  setViewBuilding(name);
}
function buildingStats(b) {
  const shs = state.shapes.filter(sh => (sh.building || DEFAULT_BUILDING) === b);
  return { count: shs.length, area: shs.reduce((a, sh) => a + shapeArea(sh), 0) };
}
function renameBuilding(cur) {
  cur = cur || viewBuildingOrAll();
  if (cur === 'all') { alert('Pick a building in the Building dropdown first, then Rename.'); return; }
  const name = (prompt('Rename "' + cur + '" to:', cur) || '').trim();
  if (!name || name === cur) return;
  if (buildingList().includes(name)) {
    if (!confirm('A building named "' + name + '" already exists.\n\nMerge "' + cur + '" into it? Its shapes move across; the existing basement setting is kept.')) return;
    mergeBuilding(cur, name);
    return;
  }
  pushUndo();
  state.buildings = state.buildings.map(b => b === cur ? name : b);
  state.shapes.forEach(sh => { if ((sh.building || DEFAULT_BUILDING) === cur) sh.building = name; });
  if (state.basements[cur]) { state.basements[name] = state.basements[cur]; delete state.basements[cur]; }
  if (state.viewBuilding === cur) state.viewBuilding = name;
  render();
  refreshBuildingsModal();
}
// Move every shape of `from` into `into`, then drop the `from` name. One undo step.
function mergeBuilding(from, into) {
  if (!from || !into || from === into) return;
  pushUndo();
  state.shapes.forEach(sh => { if ((sh.building || DEFAULT_BUILDING) === from) sh.building = into; });
  if (state.basements[from]) { if (!state.basements[into]) state.basements[into] = state.basements[from]; delete state.basements[from]; }
  state.buildings = buildingList().filter(b => b !== from);
  if (state.viewBuilding === from) state.viewBuilding = into;
  state.selection = null;
  render();
  refreshBuildingsModal();
}
// Delete a building: its shapes, its basement setting and its name. One undo step.
function deleteBuilding(b) {
  const st = buildingStats(b);
  if (st.count && state.settings.confirmDelete &&
      !confirm('Delete "' + b + '" and its ' + st.count + ' shape' + (st.count === 1 ? '' : 's') + ' (' + Math.round(st.area) + ' sf)?\n\nUndo (Ctrl+Z) restores it.')) return;
  pushUndo();
  state.shapes = state.shapes.filter(sh => (sh.building || DEFAULT_BUILDING) !== b);
  delete state.basements[b];
  state.buildings = buildingList().filter(x => x !== b);
  if (state.viewBuilding === b) state.viewBuilding = 'all';
  state.selection = null;
  render();
  refreshBuildingsModal();
}
// ----- Marked for deletion: tick buildings in the gallery (or on the canvas), delete them in one go -----
let markedBuildings = new Set();   // session-only; cleared by Load / New
function toggleMark(b, on) {
  if (!b || b === 'all') return;
  if (on === undefined) on = !markedBuildings.has(b);
  if (on) markedBuildings.add(b); else markedBuildings.delete(b);
  render();
}
function clearMarks() { markedBuildings.clear(); render(); }
function syncMarkControls() {
  const names = new Set(buildingList());
  [...markedBuildings].forEach(b => { if (!names.has(b)) markedBuildings.delete(b); });
  const cur = viewBuildingOrAll();
  const box = document.getElementById('mark-box'), chk = document.getElementById('mark-current'), del = document.getElementById('btn-delete-marked');
  if (box) box.classList.toggle('show', cur !== 'all');
  const delCur = document.getElementById('btn-delete-current');
  if (delCur) delCur.style.display = cur !== 'all' ? '' : 'none';
  if (chk) chk.checked = cur !== 'all' && markedBuildings.has(cur);
  if (del) { del.style.display = markedBuildings.size ? '' : 'none'; del.textContent = 'Delete marked (' + markedBuildings.size + ')'; }
}
function deleteMarkedBuildings() {
  const list = [...markedBuildings].filter(b => buildingList().includes(b));
  if (!list.length) { alert('Nothing is marked. Tick the box on a gallery panel, or "Mark for deletion" with a building on the canvas.'); return; }
  const lines = list.map(b => { const st = buildingStats(b); return '  ' + b + ' — ' + st.count + ' shape' + (st.count === 1 ? '' : 's') + ', ' + Math.round(st.area) + ' sf'; });
  if (!confirm('Delete ' + list.length + ' building' + (list.length === 1 ? '' : 's') + '?\n\n' + lines.join('\n') + '\n\nUndo (Ctrl+Z) restores them all.')) return;
  pushUndo();
  const gone = new Set(list);
  state.shapes = state.shapes.filter(sh => !gone.has(sh.building || DEFAULT_BUILDING));
  list.forEach(b => delete state.basements[b]);
  state.buildings = buildingList().filter(b => !gone.has(b));
  if (gone.has(state.viewBuilding)) state.viewBuilding = 'all';
  state.selection = null;
  markedBuildings.clear();
  render();
  refreshBuildingsModal();
}

// Drop every name that has no shapes (they only clutter the dropdown).
function pruneUnusedBuildings() {
  const present = new Set(buildingsPresent());
  const unused = buildingList().filter(b => !present.has(b));
  if (!unused.length) { alert('Every building name is in use.'); return; }
  if (!confirm('Remove ' + unused.length + ' unused name' + (unused.length === 1 ? '' : 's') + ': ' + unused.join(', ') + '?')) return;
  pushUndo();
  state.buildings = buildingList().filter(b => present.has(b));
  unused.forEach(b => delete state.basements[b]);
  render();
  refreshBuildingsModal();
}
function refreshBuildingsModal() {
  if (document.getElementById('buildings-modal')) openBuildingsModal();
}
function openBuildingsModal() {
  const m = createModal();

    return `<tr>
      <td><strong>${escapeHtml(b)}</strong>${b === viewBuildingOrAll() ? ' <span style="color:#2b6cb0;font-size:11px;">(on canvas)</span>' : ''}</td>

          <option value="">Merge into&hellip;</option>${others.map(o => `<option value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join('')}
        </select>

  }).join('');
  div.innerHTML = `

    <table class="bm-table"><thead><tr><th>Building</th><th style="text-align:right;">Shapes</th><th style="text-align:right;">Area</th><th></th></tr></thead><tbody>${rows}</tbody></table>
    <div class="modal-buttons">
      <button type="button" onclick="pruneUnusedBuildings()">Remove unused names</button>
      <button type="button" onclick="addBuilding(); refreshBuildingsModal();">+ Add building</button>
      <button type="button" class="primary" onclick="closeModal()">Close</button>

  m.appendChild(div);
  div.querySelectorAll('[data-bm]').forEach(btn => btn.addEventListener('click', () => {
    if (btn.dataset.bm === 'rename') renameBuilding(btn.dataset.b); else deleteBuilding(btn.dataset.b);
  }));
  div.querySelectorAll('.bm-merge').forEach(sel => sel.addEventListener('change', () => {
    const from = sel.dataset.from, into = sel.value;
    if (!into) return;
    if (confirm('Merge "' + from + '" into "' + into + '"? Its shapes move across; "' + from + '" is removed.')) mergeBuilding(from, into);

}

function syncBuildingSelect() {
  const bsel = document.getElementById('building-select');
  if (!bsel) return;
  const curB = viewBuildingOrAll();
  const present = buildingsPresent();
  bsel.innerHTML = '<option value="all">All' + (present.length > 1 ? ' (gallery)' : '') + '</option>' +
    buildingList().map(b => `<option value="${escapeHtml(b)}"${b === curB ? ' selected' : ''}>${escapeHtml(b)}${present.includes(b) ? '' : ' (empty)'}</option>`).join('');
  bsel.value = curB;
}

function shapesOnFloor(floor) { return visibleShapes().filter(s => s.floor === floor); }
function shapesOnOtherFloors() { return visibleShapes().filter(s => s.floor !== state.activeFloor); }

function fitView() {
  const all = [];
  visibleShapes().forEach(s => all.push(...shapeExtentPoints(s)));
  if (state.segments.length) all.push(...pathPointsHere(state.segments));
  // Include text-label anchors so notes placed below/around the drawing stay on
  // screen (the 80px pad below covers each label's height).
  labelsOnFloor(state.activeFloor).forEach(l => all.push({ x: l.x, y: l.y }));
  // Frame the underlay too, so loading a scan into an empty project shows it.
  const ul = visibleUnderlay();
  if (ul) all.push({ x: ul.x, y: ul.y }, { x: ul.x + ul.w*ul.ftPerPx, y: ul.y + ul.h*ul.ftPerPx });
  const w = svg.clientWidth || 800, h = svg.clientHeight || 600;
  if (all.length === 0) return { tx: w/2, ty: h/2, scale: 18 };
  const xs = all.map(p=>p.x), ys = all.map(p=>p.y);
  const minX=Math.min(...xs), maxX=Math.max(...xs);
  const minY=Math.min(...ys), maxY=Math.max(...ys);
  const ww = (maxX-minX) || 1, hh = (maxY-minY) || 1;
  const pad = 80;
  const scale = Math.min((w-2*pad)/ww, (h-2*pad)/hh, 40);
  const tx = pad + (w-2*pad - ww*scale)/2 - minX*scale;
  const ty = pad + (h-2*pad - hh*scale)/2 - minY*scale;
  return { tx, ty, scale };
}

function render() {
  // Undo / Redo button state
  const ub = document.getElementById('btn-undo'), rb = document.getElementById('btn-redo');
  if (ub) { ub.disabled = state.undoStack.length === 0; ub.title = `Undo (Ctrl+Z) — ${state.undoStack.length} steps`; }
  if (rb) { rb.disabled = state.redoStack.length === 0; rb.title = `Redo (Ctrl+Y) — ${state.redoStack.length} steps`; }

  // Mode tabs
  document.querySelectorAll('#mode-tabs button').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === state.mode);
  });
  svg.classList.toggle('split-mode', state.mode === 'split');
  svg.classList.toggle('measuring', !!state.offsetPick);
  syncHelpTopic();
  const mb = document.getElementById('btn-measure');
  if (mb) mb.classList.toggle('measure-on', !!state.offsetPick);
  svg.classList.toggle('text-mode', state.mode === 'text');
  svg.classList.toggle('underlay-mode', state.mode === 'underlay');

  // Floor tabs
  const ftEl = document.getElementById('floor-tabs');
  ftEl.innerHTML = state.floors.map(f =>
    `<button class="${f===state.activeFloor?'active':''}" onclick="state.activeFloor='${f}'; state.selection=null; state.splitSelection=null; render();">${f}</button>`
  ).join('');
  syncBuildingSelect();
  syncMarkControls();
  document.getElementById('floor-help').textContent =
    galleryActive() ? 'Gallery: every building in the file, each fitted to its panel. Click one to edit it on its own.' :
    state.mode==='underlay' ? (state.underlayCal
      ? (state.underlayCal.first ? 'Calibrate: now click the second end of a wall or scale bar you know the length of.'
                                 : 'Calibrate: click one end of something on the scan whose real length you know.')
      : 'Load a scanned plan, set it to scale, then trace over it in Walk mode. Drag the image to position it.') :
    state.mode==='split' ? 'Click two vertices in a shape to split it.' :
    state.mode==='edit' ? 'Click a wall or vertex to edit, or the body of a shape to move/copy/retype it. Esc deselects. Drag a dimension or area label to move it; double-click a dimension label to snap it back.' :
    (state.segments.length === 0
      ? 'Type segments to build a shape — or click any vertex (green) to start from there. Click a blank spot to drop the start, then Shift+Arrow to snap it onto aligned vertices.'
      : 'Type segments to extend the path, or click any vertex to draw a straight line to it. Close Shape when you return to start.');

  if (galleryActive()) { updateZoomBar(); renderGallery(); renderSidebar(); return; }

  // SVG render
  const w = svg.clientWidth, h = svg.clientHeight;
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  svg.innerHTML = `<defs>
    <pattern id="porchHatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#9bb3cc" stroke-width="1"/>
    </pattern>
    <pattern id="unfinishedHatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#888" stroke-width="1"/>
    </pattern>
  </defs>`;

  viewTransform = v;
  updateZoomBar();
  document.documentElement.style.setProperty('--ghost-opacity', state.settings.ghostOpacity);
  const W = p => ({ x: v.tx + p.x*v.scale, y: v.ty + p.y*v.scale });

  // The traced-over scan sits beneath every drawn thing, unless it is pinned on top.
  renderUnderlay(W, 'below');

  // Active floor first…
  drawnLabelBoxes = [];
  shapesOnFloor(state.activeFloor).forEach(sh => renderShape(sh, W, false));
  // …then other floors as a faded dashed-outline overlay on top, so their outline
  // and label stay visible even where they sit under the active floor's fill.
  if (state.settings.showFloorGhosts) {
    shapesOnOtherFloors().forEach(sh => renderShape(sh, W, true));
  }

  // Persistent offset annotations
  renderAnnotations(W);

  // Free-text labels
  renderLabels(W);

  // Fence rectangle + selection highlight
  renderFence(W);
  renderWallRemoval(W);
  renderVertexDrag(W);

  // Current in-progress segments
  if (state.segments.length) renderInProgress(W);
  if (state.segments.length && state.mode === 'walk') renderEnclose(W);
  if (state.segments.length && state.mode === 'walk') renderCloseOffer(W);
  else if (state.mode === 'walk') {
    const start = getStart();
    const startScreen = W(start);
    // Alignment guides: faint extension lines when the picked start shares an axis
    // with an active-floor vertex. ui-overlay → stripped from exports (§4.6).
    if (state.startPoint) {
      const tol = 1e-4, verts = activeFloorVertices();
      if (verts.some(p => Math.abs(p.x - start.x) < tol))
        addEl('line', { x1: startScreen.x, y1: 0, x2: startScreen.x, y2: svg.clientHeight, stroke: '#2e8b57', 'stroke-width': 1, 'stroke-dasharray': '4,4', opacity: 0.45, class: 'ui-overlay' });
      if (verts.some(p => Math.abs(p.y - start.y) < tol))
        addEl('line', { x1: 0, y1: startScreen.y, x2: svg.clientWidth, y2: startScreen.y, stroke: '#2e8b57', 'stroke-width': 1, 'stroke-dasharray': '4,4', opacity: 0.45, class: 'ui-overlay' });
    }
    drawStartPin(startScreen, state.startPoint ? 'START (picked)' : 'START', false);
  }

  // Walk preview (auto-extend or pen-jump candidate)
  if (state.preview && state.mode === 'walk') {
    const pts = pathPointsHere(state.segments);
    const pen = pts[pts.length - 1];
    const cand = state.preview.candidates[state.preview.candIdx];
    const a = W(pen), b = W(cand.point);
    const isJump = !!state.preview.jump;
    const stroke = isJump ? '#888' : '#ff8800';
    const dash = isJump ? '2,4' : '6,4';
    const fill = isJump ? '#888' : '#ff8800';
    const textFill = isJump ? '#555' : '#cc5500';
    const prefix = isJump ? '↷ ' : '';
    addEl('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke, 'stroke-width': 2, 'stroke-dasharray': dash });
    addEl('circle', { cx: b.x, cy: b.y, r: 8, fill, stroke: '#fff', 'stroke-width': 2 });
    const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
    addEl('text', { x: mx, y: my - 10, 'text-anchor':'middle', 'font-size':12, 'font-weight':'bold', fill: textFill }, `${prefix}${formatLength(cand.along)} ${state.preview.dir}`);
  }

  // Split projection preview
  if (state.splitPreview && state.mode === 'split') {
    const sp = state.splitPreview;
    const sh = state.shapes.find(s => s.id === sp.shapeId);
    if (sh) {
      const origin = sh.points[sp.originIdx];
      const a = W(origin), b = W(sp.hit.point);
      addEl('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: '#ff8800', 'stroke-width': 2.5, 'stroke-dasharray': '6,4' });
      addEl('circle', { cx: b.x, cy: b.y, r: 8, fill: '#ff8800', stroke: '#fff', 'stroke-width': 2 });
      const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
      addEl('text', { x: mx, y: my - 10, 'text-anchor':'middle', 'font-size':12, 'font-weight':'bold', fill:'#cc5500' }, `${formatLength(sp.hit.distance)} ${sp.dir}`);
    }
  }

  renderUnderlay(W, 'above');
  renderTraceHover(W);

  renderSidebar();
  scheduleAutosave();
}

// Global sketch-area label scale (dimension + area labels). Header/legend on
// exports use their own fixed sizes and are not affected.
function skFont(px) { return px * (state.settings.sketchFontScale || 1); }

function addEl(tag, attrs, text) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  if (text !== undefined) el.textContent = text;
  svg.appendChild(el);
  return el;
}

// ----- Fill styles: colour + pattern -----------------------------------------
// Precedence: per-shape override (sh.style) → Settings palette (settings.typeStyles)
// → built-in default for the type. Patterns are generated into <defs> on demand,
// one per (pattern, colour) pair, so any colour can carry any pattern; exports
// copy <defs>, so they carry over unchanged.
const FILL_PATTERNS = { none: 'Solid', planks: 'Decking (boards E–W)', planksv: 'Decking (boards N–S)', hatch: 'Diagonal hatch', crosshatch: 'Cross-hatch', dots: 'Dots' };
const TYPE_STYLE_DEFAULTS = {
  porch:      { color: '#ffffff', pattern: 'hatch', line: '#9bb3cc' },
  unfinished: { color: '#ffffff', pattern: 'hatch', line: '#888888' },
  deck:       { color: '#f6efe3', pattern: 'planks' },
};
function typeStyleDefault(key) {
  const t = TYPES[key] || TYPES.living;
  const d = TYPE_STYLE_DEFAULTS[key];
  return d ? { ...d } : { color: t.fill.startsWith('url(') ? '#ffffff' : t.fill, pattern: 'none' };
}
function typeStyle(key) {   // effective style for a type: palette override on top of the default
  const base = typeStyleDefault(key);
  const o = (state.settings.typeStyles || {})[key] || {};
  return { ...base, color: o.color || base.color, pattern: o.pattern || base.pattern, dashed: !!(TYPES[key] || TYPES.living).dashed };

    const base = below ? { x: (Math.min(...xs) + Math.max(...xs)) / 2, y: Math.max(...sh.points.map(p => p.y)) }
