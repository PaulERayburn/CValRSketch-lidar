    const off = sh.labelOffset || { dx: 0, dy: 0 };
    const c = W({ x: base.x + off.dx, y: base.y + off.dy });
    if (below) c.y += skFont(11) + 34;
    const box = () => ({ x0: c.x - Math.max(44, sh.label.length * 8) / 2, x1: c.x + Math.max(44, sh.label.length * 8) / 2, y0: c.y - 20, y1: c.y + 14 });
    const hits = b => drawnLabelBoxes.some(o => b.x0 < o.x1 && b.x1 > o.x0 && b.y0 < o.y1 && b.y1 > o.y0);
    if (isGhost) for (let k = 0; k < 4 && hits(box()); k++) c.y += 36;
    drawnLabelBoxes.push(box());
    const area = shapeArea(sh);
    const halo = { stroke: 'white', 'stroke-width': 3.5, 'paint-order': 'stroke fill' };
    // Other-floor (ghost) labels render a touch smaller and in a muted blue-grey so
    // they stay distinguishable from the active floor's label even at high opacity.
    const nameSize = isGhost ? skFont(11.5) : skFont(14);
    const areaSize = isGhost ? skFont(9.5)  : skFont(11);
    const nameFill = isGhost ? '#5a6b80' : '#222';
    const areaFill = isGhost ? '#7c8a9c' : '#555';
    addEl('text', { x: c.x, y: c.y-7, 'text-anchor':'middle', 'font-size':nameSize, 'font-weight':'bold', fill:nameFill, ...halo, class: cls }, sh.label);
    addEl('text', { x: c.x, y: c.y+9, 'text-anchor':'middle', 'font-size':areaSize, fill:areaFill, ...halo, class: cls }, `${Math.round(area)} sq ft`);
    if (!isGhost && state.mode === 'edit') {
      const hw = Math.max(44, sh.label.length * 8);
      const hit = addEl('rect', { x: c.x - hw/2, y: c.y - 20, width: hw, height: 34, fill: 'rgba(0,0,0,0)', class: 'ui-overlay' });
      hit.style.cursor = 'move';
      hit.addEventListener('mousedown', (ev) => startShapeLabelDrag(ev, sh.id));
    }
  }
}

// The start of a walk, drawn as a flagged pin so it can be found at a glance when
// it is time to close. `closing` = the cursor is on it and a click would close.
function drawStartPin(c, label, closing) {
  const g = '#2e8b57', o = { class: 'ui-overlay', 'pointer-events': 'none' };
  addEl('circle', { cx: c.x, cy: c.y, r: closing ? 16 : 11, fill: g, 'fill-opacity': closing ? 0.25 : 0.12, stroke: g, 'stroke-width': closing ? 3 : 2, ...o });
  addEl('circle', { cx: c.x, cy: c.y, r: 5.5, fill: g, stroke: '#fff', 'stroke-width': 2, ...o });
  addEl('line', { x1: c.x, y1: c.y - 11, x2: c.x, y2: c.y - 30, stroke: g, 'stroke-width': 2, ...o });
  const w = label.length * 7 + 12;
  addEl('rect', { x: c.x, y: c.y - 40, width: w, height: 16, rx: 3, fill: g, ...o });
  addEl('text', { x: c.x + 6, y: c.y - 28, 'font-size': 11, 'font-weight': 'bold', fill: '#fff', ...o }, label);
}

function renderInProgress(W) {
  const pts = pathPointsHere(state.segments).map(W);
  // Use M (move) instead of L (line) for jump segments so the wall path doesn't draw across them
  const d = pts.map((p,i) => {
    if (i === 0) return `M${p.x} ${p.y}`;
    return (state.segments[i-1].jump ? 'M' : 'L') + p.x + ' ' + p.y;
  }).join(' ');
  addEl('path', { d, fill: 'none', stroke: '#2b6cb0', 'stroke-width': 2.5, 'stroke-dasharray': '5,3' });
  // Faint dotted overlay so jumps are visible (without looking like walls)
  const jumpD = state.segments.map((seg, i) => seg.jump
    ? `M${pts[i].x} ${pts[i].y} L${pts[i+1].x} ${pts[i+1].y}` : null
  ).filter(Boolean).join(' ');
  if (jumpD) addEl('path', { d: jumpD, fill: 'none', stroke: '#aaa', 'stroke-width': 1.2, 'stroke-dasharray': '2,4' });
  const start = pts[0], startW = pathPointsHere(state.segments)[0], h = state.traceHover;
  const closing = traceActive() && h && h.kind === 'vertex' && state.segments.length >= 2 && Math.hypot(h.p.x - startW.x, h.p.y - startW.y) < 1e-6;
  const pen = pts[pts.length-1];
  addEl('circle', { cx: pen.x, cy: pen.y, r: 6, fill: '#c44', stroke: '#fff', 'stroke-width': 1.5 });
  drawStartPin(start, closing ? 'CLICK TO CLOSE' : 'START', closing);
  if (state.settings.showSegmentLabels) {
    state.segments.forEach((seg,i) => {
      if (seg.jump) return;
      const a = pts[i], b = pts[i+1];
      const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
      const dx=b.x-a.x, dy=b.y-a.y;
      const len = Math.hypot(dx,dy);
      if (len < 30) return;
      const nx=-dy/len, ny=dx/len;
      addEl('text', { x: mx+nx*10, y: my+ny*10, 'text-anchor':'middle', 'dominant-baseline':'middle', 'font-size':skFont(11), fill:'#2b6cb0' }, formatLength(seg.length));
    });
  }
  // Offset-tool picking: make every in-progress vertex clickable
  const wpts = pathPointsHere(state.segments);
  if (!state.offsetPick && state.mode === 'walk' && state.segments.length > 0) {
    // Click-to-snap: any walk vertex except the pen itself (clicking the start
    // draws the closing line straight back to it).
    wpts.forEach((wp, i) => {
      if (i === wpts.length - 1) return; // the pen — skip
      const sp = W(wp);
      const h = addEl('circle', { cx: sp.x, cy: sp.y, r: 12, class: 'hit-vertex ui-overlay' });
      h.addEventListener('click', (ev) => {
        ev.stopPropagation();
        snapWalkToPoint(wp);
      });
    });
  }
  // Gap indicator: dashed line from pen back to start, labeled with the directional offset
  const wStart = wpts[0];
  const wPen = wpts[wpts.length - 1];
  const gapDxW = wStart.x - wPen.x;
  const gapDyW = wStart.y - wPen.y;
  const gapLenW = Math.hypot(gapDxW, gapDyW);
  if (gapLenW > state.settings.autoCloseFeet) {
    addEl('path', {
      d: `M${pen.x} ${pen.y} L${start.x} ${start.y}`,
      fill: 'none', stroke: '#e57c00', 'stroke-width': 1.5, 'stroke-dasharray': '4,4'
    });
    const mx = (pen.x + start.x) / 2;
    const my = (pen.y + start.y) / 2;
    const sdx = start.x - pen.x, sdy = start.y - pen.y;
    const slen = Math.hypot(sdx, sdy) || 1;
    const nx = -sdy / slen, ny = sdx / slen;
    const label = `OFFSET ${formatLength(gapLenW)} (${formatGapBreakdown(gapDxW, gapDyW)})`;
    addEl('text', {
      x: mx + nx * 14, y: my + ny * 14,
      'text-anchor': 'middle', 'dominant-baseline': 'middle',
      'font-size': 12, 'font-weight': 'bold', fill: '#e57c00',
      stroke: 'white', 'stroke-width': 3, 'paint-order': 'stroke fill'
    }, label);
  }
}

// =============================================================================
// SIDEBAR
// =============================================================================
function renderSidebar() {
  const aside = document.getElementById('sidebar');
  // The sidebar is rebuilt from scratch on every render, which replaces the
  // element that had keyboard focus. Remember it by id and hand focus back, so
  // e.g. the walk input keeps the caret through a preview/accept/undo cycle.
  const active = document.activeElement;
  const refocusId = (active && active.id && aside.contains(active)) ? active.id : null;
  let html = '';
  if (galleryActive()) {
    html += sidebarGallery();
  } else {
    if (state.mode === 'underlay') html += sidebarUnderlay();
    if (state.mode === 'walk') html += sidebarWalk();
    if (state.mode === 'edit') html += sidebarEdit();
    if (state.mode === 'split') html += sidebarSplit();
    if (state.mode === 'fence') html += sidebarFence();
    if (state.mode === 'text') html += sidebarText();
    html += sidebarOffsets();
  }
  html += sidebarShapes() + sidebarBasement() + sidebarTotals();
  aside.innerHTML = html;
  attachSidebarHandlers();
  if (refocusId) {
    const el = document.getElementById(refocusId);
    if (el && typeof el.focus === 'function') {
      el.focus();
      if (typeof el.setSelectionRange === 'function' && typeof el.value === 'string') {
        try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) { /* not a text field */ }
      }
    }
  }
}

function sidebarText() {
  const labels = labelsOnFloor(state.activeFloor);
  const list = labels.length
    ? labels.map(l => {
        const sel = state.selectedLabel === l.id ? ' style="background:#eaf2fb;"' : '';
        const preview = escapeHtml(l.text).replace(/\n/g, ' / ');
        const tag = l.headingFirst ? ' <span style="color:#888; font-size:10px;">(heading)</span>' : '';
        return `<div class="seg-item"${sel}>
          <span data-act="selectLabel" data-id="${l.id}" style="cursor:pointer; flex:1;">${preview}${tag}</span>
          <button data-act="editLabel" data-id="${l.id}" title="Edit">✎</button>
          <button data-act="deleteLabel" data-id="${l.id}" title="Delete">×</button>
        </div>`;
      }).join('')
    : '<div class="help">No labels on this floor yet.</div>';
  return `
    <div class="section">
      <h2>Text Labels</h2>
      <div class="help">Click a blank spot on the canvas to add a label. Click a label to select, drag to move, double-click to edit. Delete key removes the selected label. Labels can span multiple lines, and the first line can be styled as a larger heading.</div>
      <div style="margin-top:8px;">${list}</div>
    </div>`;
}

function renderFence(W) {
  if (state.fenceDraw) {
    const a = W(state.fenceDraw.start), b = W(state.fenceDraw.end);
    const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
    const w = Math.abs(b.x - a.x), h = Math.abs(b.y - a.y);
    addEl('rect', { x, y, width: w, height: h, fill: 'rgba(43,108,176,0.08)', stroke: '#2b6cb0', 'stroke-width': 1.5, 'stroke-dasharray': '4,3', class: 'ui-overlay' });
  }
  if (state.fenceSelection) {
    const dot = (sx, sy) => addEl('circle', { cx: sx, cy: sy, r: 6, fill: 'none', stroke: '#2b6cb0', 'stroke-width': 2, class: 'ui-overlay' });
    state.fenceSelection.shapeVerts.forEach(({ shapeId, idx }) => {
      const sh = state.shapes.find(s => s.id === shapeId);
      if (!sh) return;
      const p = W(sh.points[idx]);
      dot(p.x, p.y);
    });
    if (state.segments.length) {
      const wpts = pathPointsHere(state.segments);
      state.fenceSelection.inProgVerts.forEach(i => {
        const p = W(wpts[i]);
        dot(p.x, p.y);
      });
    }
    state.fenceSelection.annEnds.forEach(({ idx, end }) => {
      const ann = state.annotations[idx];
      if (!ann) return;
      const p = W(ann[end]);
      dot(p.x, p.y);
    });
  }
}

function screenToWorld(clientX, clientY) {
  if (!viewTransform) return { x: 0, y: 0 };
  const rect = svg.getBoundingClientRect();
  const vbW = svg.viewBox.baseVal.width || rect.width;
  const vbH = svg.viewBox.baseVal.height || rect.height;
  const sx = (clientX - rect.left) * (vbW / rect.width);
  const sy = (clientY - rect.top) * (vbH / rect.height);
  return { x: (sx - viewTransform.tx) / viewTransform.scale, y: (sy - viewTransform.ty) / viewTransform.scale };
}

function fenceMouseDown(e) {
  if (state.mode !== 'fence' || galleryActive()) return;
  if (e.button !== 0) return;
  const p = screenToWorld(e.clientX, e.clientY);
  state.fenceDraw = { start: p, end: p };
  e.preventDefault();
}
function fenceMouseMove(e) {
  if (!state.fenceDraw) return;
  state.fenceDraw.end = screenToWorld(e.clientX, e.clientY);
  render();
}
function fenceMouseUp(e) {
  if (!state.fenceDraw) return;
  const d = state.fenceDraw;
  const minDx = Math.abs(d.end.x - d.start.x);
  const minDy = Math.abs(d.end.y - d.start.y);
  state.fenceDraw = null;
  if (minDx < 0.05 && minDy < 0.05) { render(); return; } // ignore stray clicks
  finalizeFenceSelection(d.start, d.end);
}

function finalizeFenceSelection(a, b) {
  const x1 = Math.min(a.x, b.x), x2 = Math.max(a.x, b.x);
  const y1 = Math.min(a.y, b.y), y2 = Math.max(a.y, b.y);
  const inside = p => p.x >= x1 && p.x <= x2 && p.y >= y1 && p.y <= y2;
  const sel = { shapeVerts: [], inProgVerts: [], annEnds: [] };
  // Closed shapes on active floor (skip the duplicate closing vertex)
  shapesOnFloor(state.activeFloor).forEach(sh => {
    for (let i = 0; i < sh.points.length - 1; i++) {
      if (inside(sh.points[i])) sel.shapeVerts.push({ shapeId: sh.id, idx: i });
    }
  });
  // In-progress walk vertices
  if (state.segments.length) {
    pathPointsHere(state.segments).forEach((p, i) => {
      if (inside(p)) sel.inProgVerts.push(i);
    });
  }
  // Offset annotation endpoints
  annotationsOnFloor(state.activeFloor).forEach(({ ann, i }) => {
    if (inside(ann.a)) sel.annEnds.push({ idx: i, end: 'a' });
    if (inside(ann.b)) sel.annEnds.push({ idx: i, end: 'b' });
  });
  state.fenceSelection = sel;
  render();
}

function clearFenceSelection() {
  state.fenceSelection = null;
  render();
}

function applyGroupMove() {
  const sel = state.fenceSelection;
  if (!sel) return;
  const total = sel.shapeVerts.length + sel.inProgVerts.length + sel.annEnds.length;
  if (!total) { alert('Fence selection is empty.'); return; }
  const input = document.getElementById('group-move');
  if (!input) return;
  const raw = input.value.trim();
  if (!raw) return;
  let seg;
  try { seg = parseSegment(raw); } catch (err) { alert(err.message); return; }
  if (seg.autoExtend) { alert('Provide a length and direction (e.g. 3\'6 r).'); return; }
  pushUndo();
  // Shape vertices
  const affectedShapes = new Set();
  sel.shapeVerts.forEach(({ shapeId, idx }) => {
    const sh = state.shapes.find(s => s.id === shapeId);
    if (!sh) return;
    sh.points[idx].x += seg.dx;
    sh.points[idx].y += seg.dy;
    syncClosure(sh, idx);
    affectedShapes.add(shapeId);
  });
  affectedShapes.forEach(id => {
    const sh = state.shapes.find(s => s.id === id);
    if (sh) rebuildSegments(sh);
  });
  // In-progress walk: shift selected points, then rebuild segments from new positions
  if (sel.inProgVerts.length && state.segments.length) {
    const wpts = pathPointsHere(state.segments).map(p => ({ x: p.x, y: p.y }));
    const idxSet = new Set(sel.inProgVerts);
    wpts.forEach((p, i) => { if (idxSet.has(i)) { p.x += seg.dx; p.y += seg.dy; } });
    if (idxSet.has(0)) state.startPoint = { x: wpts[0].x, y: wpts[0].y };
    state.segments.forEach((s, i) => {
      const dx = wpts[i+1].x - wpts[i].x;
      const dy = wpts[i+1].y - wpts[i].y;
      const length = Math.hypot(dx, dy);
      s.dx = dx; s.dy = dy; s.length = length;
      s.dir = Math.abs(dx) >= Math.abs(dy) ? (dx >= 0 ? 'r' : 'l') : (dy >= 0 ? 'd' : 'u');
      s.angle = 0;
      s.raw = `${formatLength(length)} ${s.dir} (adj)`;
    });
  }
  // Annotation endpoints
  sel.annEnds.forEach(({ idx, end }) => {
    state.annotations[idx][end].x += seg.dx;
    state.annotations[idx][end].y += seg.dy;
  });
  input.value = '';
  render();
}

// What the fence captured in full: shapes with every vertex inside, the unfinished
// walk when all its points are inside, offsets with both ends inside.
function fencedWhole() {
  const sel = state.fenceSelection;
  if (!sel) return null;
  const perShape = new Map();
  sel.shapeVerts.forEach(({ shapeId }) => perShape.set(shapeId, (perShape.get(shapeId) || 0) + 1));
  const shapes = [...perShape.entries()]
    .filter(([id, n]) => { const sh = state.shapes.find(x => x.id === id); return sh && n >= sh.points.length - 1; })
    .map(([id]) => id);
  const walk = state.segments.length > 0 && sel.inProgVerts.length >= state.segments.length + 1;
  const perAnn = new Map();
  sel.annEnds.forEach(({ idx }) => perAnn.set(idx, (perAnn.get(idx) || 0) + 1));
  const anns = [...perAnn.entries()].filter(([, n]) => n >= 2).map(([idx]) => idx);
  return { shapes, walk, anns };
}
function deleteFenced() {
  const whole = fencedWhole();
  if (!whole) return;
  const names = whole.shapes.map(id => { const sh = state.shapes.find(x => x.id === id); return sh.label + ' (' + Math.round(shapeArea(sh)) + ' sf)'; });
  if (whole.walk) names.push('the unfinished walk (' + state.segments.length + ' segment' + (state.segments.length === 1 ? '' : 's') + ')');
  if (whole.anns.length) names.push(whole.anns.length + ' offset measurement' + (whole.anns.length === 1 ? '' : 's'));
  if (!names.length) { alert('Nothing is captured whole. Enlarge the fence so every vertex of what you want gone is inside it.'); return; }
  if (state.settings.confirmDelete && !confirm('Delete:\n  ' + names.join('\n  ') + '\n\nUndo (Ctrl+Z) restores them.')) return;
  pushUndo();
  const gone = new Set(whole.shapes);
  state.shapes = state.shapes.filter(sh => !gone.has(sh.id));
  if (whole.walk) { state.segments = []; state.startPoint = null; state.preview = null; state.enclose = null; state.rewalk = null; }
  const goneAnn = new Set(whole.anns);
  state.annotations = state.annotations.filter((_, i) => !goneAnn.has(i));
  state.fenceSelection = null;
  state.selection = null;
  render();
}

function sidebarFence() {
  const sel = state.fenceSelection;
  const counts = sel
    ? `${sel.shapeVerts.length} shape vertex(es), ${sel.inProgVerts.length} in-progress vertex(es), ${sel.annEnds.length} annotation endpoint(s)`
    : '';
  const intro = state.fenceDraw
    ? 'Release to capture vertices inside the rectangle.'
    : (sel
        ? `Selected: <b>${counts}</b>. Walls with both endpoints captured will translate; walls crossing the fence stretch. Type an offset and press <b>Move</b>. <b>Delete fenced</b> (or the Delete key) removes whatever the fence captured <i>whole</i>: shapes with every vertex inside, an unfinished walk with all its points inside, offsets with both ends inside.`
        : 'Click and drag on the canvas to draw a rectangular fence. Vertices fully inside the rectangle will be captured — then move them by a typed offset, or delete what was captured whole.');
  const whole = sel ? fencedWhole() : null;
  const delLabel = whole ? [whole.shapes.length ? `${whole.shapes.length} shape${whole.shapes.length === 1 ? '' : 's'}` : '', whole.walk ? 'the unfinished walk' : '', whole.anns.length ? `${whole.anns.length} offset${whole.anns.length === 1 ? '' : 's'}` : ''].filter(Boolean).join(', ') : '';
  const moveBlock = sel ? `
    <div class="input-row" style="margin-top:8px;">
      <input id="group-move" placeholder="e.g. 3'6 r  or  6&quot; d">
      <button data-act="applyGroupMove" class="primary">Move</button>
    </div>
    <div class="row-buttons" style="margin-top:6px;">
      <button data-act="deleteFenced" class="danger" ${delLabel ? '' : 'disabled'} title="${delLabel ? 'Delete ' + delLabel : 'Nothing is captured whole — enlarge the fence to cover every vertex of what you want gone'}">Delete fenced${delLabel ? ' (' + delLabel + ')' : ''}</button>
      <button data-act="clearFenceSelection">Clear selection</button>
    </div>
  ` : '';
  return `
    <div class="section">
      <h2>Fence</h2>
      <div class="help">${intro}</div>
      ${moveBlock}
    </div>
  `;
}

function sidebarOffsets() {
  const picking = !!state.offsetPick;
  const pickHint = picking
    ? (state.offsetPick.first
        ? 'Click the <b>second point</b>. Esc drops the first point.'
        : 'Click the <b>first point</b>. Corners and walls snap; hold <b>Alt</b> for a free point, <b>Shift</b> to keep the line level or plumb. Esc when done.')
    : 'Click <b>📏 Measure</b> (or press <b>M</b>), then click any two points to drop a measurement.';
  const button = picking
    ? '<button data-act="cancelOffsetPick" class="danger">Done measuring</button>'
    : '<button data-act="startOffsetPick" class="primary">📏 Measure</button>';
  const here = annotationsOnFloor(state.activeFloor);
  const listHtml = here.length === 0
    ? '<div class="help" style="margin-top:6px;">No measurements on this floor.</div>'
    : here.map(({ ann, i }, n) => {
        const dx = ann.b.x - ann.a.x, dy = ann.b.y - ann.a.y;
        const len = Math.hypot(dx, dy);
        return `<div class="seg-item"><span>${n+1}. ${formatLength(len)} (${formatGapBreakdown(dx, dy)})</span><button data-act="removeAnnotation" data-i="${i}" title="Remove">×</button></div>`;
      }).join('');
  const clearBtn = here.length
    ? '<div class="row-buttons" style="margin-top:6px;"><button data-act="clearAnnotations" class="danger">Clear all</button></div>'
    : '';
  return `
    <div class="section">
      <h2>Measurements</h2>
      <div class="help">${pickHint}</div>
      <div class="row-buttons" style="margin-top:6px;">${button}</div>
      <div id="ann-list" style="margin-top:6px;">${listHtml}</div>
      ${clearBtn}
    </div>
  `;
}

// Measurements made before they carried a floor show on every floor.
function annotationsOnFloor(floor) {
  return state.annotations.map((ann, i) => ({ ann, i })).filter(({ ann }) => !ann.floor || ann.floor === floor);
}

function renderAnnotations(W) {
  const MAG = '#d946ef';
  const drawLabel = (aS, bS, a, b, extra) => {
    const dx = b.x - a.x, dy = b.y - a.y;
    const mx = (aS.x + bS.x) / 2, my = (aS.y + bS.y) / 2;
    const sdx = bS.x - aS.x, sdy = bS.y - aS.y;
    const slen = Math.hypot(sdx, sdy) || 1;
    const nx = -sdy / slen, ny = sdx / slen;
    addEl('text', {
      x: mx + nx * 14, y: my + ny * 14,
      'text-anchor': 'middle', 'dominant-baseline': 'middle',
      'font-size': 12, 'font-weight': 'bold', fill: MAG,
      stroke: 'white', 'stroke-width': 3, 'paint-order': 'stroke fill', ...extra
    }, formatLength(Math.hypot(dx, dy)));
  };
  annotationsOnFloor(state.activeFloor).forEach(({ ann }) => {
    const aS = W(ann.a), bS = W(ann.b);
    addEl('path', {
      d: `M${aS.x} ${aS.y} L${bS.x} ${bS.y}`,
      fill: 'none', stroke: MAG, 'stroke-width': 1.5, 'stroke-dasharray': '4,4'
    });
    addEl('circle', { cx: aS.x, cy: aS.y, r: 3, fill: MAG });
    addEl('circle', { cx: bS.x, cy: bS.y, r: 3, fill: MAG });
    drawLabel(aS, bS, ann.a, ann.b, {});
  });
  // Measure tool in progress — all UI-only, stripped from exports.

function addLabelAt(world) { openLabelEditor({ world }); }

// Modal editor for a label: multi-line text (Enter = line break) + optional

function openLabelEditor(opts) {
  const existing = opts.id != null ? state.labels.find(l => l.id === opts.id) : null;
  const m = createModal();
  const div = document.createElement('div');
  div.className = 'modal';
  div.innerHTML = `
    <h3>${existing ? 'Edit label' : 'Add label'}</h3>
    <textarea id="label-text" rows="4" style="width:100%; box-sizing:border-box; font-size:14px; padding:6px; font-family:inherit;" placeholder="Type label text — press Enter for a new line">${existing ? escapeHtml(existing.text) : ''}</textarea>
    <label style="display:flex; align-items:center; gap:8px; margin-top:10px; font-size:13px; cursor:pointer;">
      <input type="checkbox" id="label-heading" ${existing && existing.headingFirst ? 'checked' : ''}>
      First line is a heading (larger, with smaller text below)
    </label>
    <div class="help" style="margin-top:6px;">Tip: Ctrl/⌘+Enter saves. Esc cancels.</div>
    <div class="modal-buttons">

      <button onclick="closeModal()">Cancel</button>
      <button class="primary" id="label-save">Save</button>
    </div>`;
  m.appendChild(div);

function deleteLabel(id) {

// =============================================================================
// UNDERLAY — trace over a scanned or photographed plan
// =============================================================================
// The scan is stored in the project as a downscaled data URL, so a saved sketch
// travels with the image it was traced from. It draws beneath everything and is
// tagged ui-overlay, so it never reaches an export. It is deliberately left out
// of snapshotState(): undo should not churn a few hundred KB, and leaving it out
// means undo/redo pass over it untouched.
const UNDERLAY_MAX_PX = 2200;     // longest side after downscaling
const UNDERLAY_QUALITY = 0.75;

function visibleUnderlay() {
  const u = state.underlay;
  if (!u || !u.src) return null;
  if (u.floor && u.floor !== state.activeFloor) return null;
  return u;
}

function renderUnderlay(W, layer) {
  const u = visibleUnderlay();
  if (!u) return;
  if ((layer === 'above') !== !!u.onTop) return;
  const a = W({ x: u.x, y: u.y });
  const b = W({ x: u.x + u.w*u.ftPerPx, y: u.y + u.h*u.ftPerPx });
  const img = addEl('image', {
    x: a.x, y: a.y, width: Math.max(1, b.x - a.x), height: Math.max(1, b.y - a.y),
    opacity: u.opacity, preserveAspectRatio: 'none', class: 'ui-overlay',
  });
  img.setAttribute('href', u.src);
  // Outside Image mode the scan must not catch clicks: Walk's start point, Text's
  // labels and the floor menu all act on a click that reaches the bare canvas.
  if (state.mode !== 'underlay') img.style.pointerEvents = 'none';
  if (state.mode === 'underlay' && !u.locked) {
    img.style.cursor = 'move';
    img.addEventListener('mousedown', underlayDragStart);
  }
  // The line the scale was set on, labelled with its length (Image mode only).
  if (u.cal && state.mode === 'underlay' && !state.underlayCal) {
    const at = q => W({ x: u.x + q.px * u.ftPerPx, y: u.y + q.py * u.ftPerPx });
    const p = at(u.cal.a), q = at(u.cal.b);
    addEl('line', { x1: p.x, y1: p.y, x2: q.x, y2: q.y, stroke: '#e6007a', 'stroke-width': 3, class: 'ui-overlay' });
    [p, q].forEach(c => addEl('circle', { cx: c.x, cy: c.y, r: 5, fill: '#e6007a', stroke: '#fff', 'stroke-width': 2, class: 'ui-overlay' }));
    addEl('text', { x: (p.x + q.x) / 2, y: (p.y + q.y) / 2 - 10, 'text-anchor': 'middle', 'font-size': 13, 'font-weight': 'bold', fill: '#e6007a',
      stroke: 'white', 'stroke-width': 3.5, 'paint-order': 'stroke fill', class: 'ui-overlay' }, `scale: ${formatLength(u.cal.len)}`);
  }
  // While calibrating, mark the first point so the second click has something to aim at.
  if (state.underlayCal && state.underlayCal.first) {
    const p = W(state.underlayCal.first);
    addEl('circle', { cx: p.x, cy: p.y, r: 6, fill: '#e6007a', stroke: '#fff', 'stroke-width': 2, class: 'ui-overlay' });
  }
}

function pickUnderlayFile() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.addEventListener('change', () => { if (inp.files && inp.files[0]) loadUnderlayFile(inp.files[0]); });
  inp.click();
}

function loadUnderlayFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    const im = new Image();
    im.onload = () => {
      // Downscale so a saved project stays a sane size; a scan far above this
      // resolution costs file size without helping you trace.
      const k = Math.min(1, UNDERLAY_MAX_PX / Math.max(im.naturalWidth, im.naturalHeight));
      const w = Math.round(im.naturalWidth * k), h = Math.round(im.naturalHeight * k);
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(im, 0, 0, w, h);
      let src;
      try { src = cv.toDataURL('image/jpeg', UNDERLAY_QUALITY); }
      catch (e) { src = reader.result; }          // tainted or unsupported — keep the original
      // Start at a sensible size: as wide as what is already drawn, else 60 ft.
      const pts = [];
      visibleShapes().forEach(s => pts.push(...s.points));
      let spanFt = 60, ox = 0, oy = 0;
      if (pts.length) {
        const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
        spanFt = Math.max(12, Math.max(...xs) - Math.min(...xs));
        ox = Math.min(...xs); oy = Math.min(...ys);
      }
      state.underlay = {
        src, w, h, x: ox, y: oy, ftPerPx: spanFt / w,
        opacity: 0.55, floor: state.activeFloor, locked: false, name: file.name,
      };
      render();
    };
    im.onerror = () => alert('That file could not be read as an image.');
    im.src = reader.result;
  };
  reader.onerror = () => alert('That file could not be read.');
  reader.readAsDataURL(file);
}

function setUnderlayOpacity(v) { if (state.underlay) { state.underlay.opacity = Math.max(0.05, Math.min(1, +v)); render(); } }
function toggleUnderlayLock() { if (state.underlay) { state.underlay.locked = !state.underlay.locked; render(); } }

// Two clicks on something of known length, then the real distance — the image is
// scaled about the first point so that point stays put.
function startUnderlayCal() {
  if (!visibleUnderlay()) { alert('Load an image first.'); return; }
  state.underlayCal = { first: null };
  render();
}
function cancelUnderlayCal() { state.underlayCal = null; render(); }

function handleUnderlayCal(worldPoint) {
  const cal = state.underlayCal;
  if (!cal) return;
  if (!cal.first) { cal.first = { x: worldPoint.x, y: worldPoint.y }; render(); return; }
  const a = cal.first, b = worldPoint;
  const spanNow = Math.hypot(b.x - a.x, b.y - a.y);
  state.underlayCal = null;
  render();
  if (spanNow < 1e-6) { alert('Those two points are the same spot — try again.'); return; }
  const typed = prompt('How long is that in real life?  e.g.  14\'  or  20\'6"', '');
  if (typed === null) return;
  const real = parseLength(typed);
  if (!(real > 0)) { alert('Could not read that length.'); return; }
  const u = state.underlay; if (!u) return;
  const k = real / spanNow;
  // Remember the calibration line in image pixels, so it moves with the image and
  // stays on screen as the visible proof of what the scale is based on.
  const toPx = q => ({ px: (q.x - u.x) / u.ftPerPx, py: (q.y - u.y) / u.ftPerPx });
  u.cal = { a: toPx(a), b: toPx(b), len: real };
  u.ftPerPx *= k;
  u.x = a.x - (a.x - u.x) * k;      // scale about the first clicked point
  u.y = a.y - (a.y - u.y) * k;
  render();
}

// ----- Click corners: trace the scan by clicking, not typing ------------------
// In Walk mode with a scaled image showing, each click adds a wall from the pen to
// the clicked corner; the first click sets the start. Clicks snap to existing
// corners (click the start to close), Shift keeps a wall level or plumb, and a wall
// within 2° of square is squared up. Lengths are rounded to the inch. A magnifier
// shows the image around the cursor so a corner can be hit exactly.
const TRACE_SQUARE_DEG = 2;
function traceActive() { return state.mode === 'walk' && state.traceClick && !!visibleUnderlay() && !galleryActive(); }
function tracePen() { const w = pathPointsHere(state.segments); return w[w.length - 1]; }
function toggleTraceClick(on) {
  state.traceClick = on === undefined ? !state.traceClick : on;
  state.traceHover = null;
  if (!state.traceClick) hideTraceLoupe();
  render();
}
function traceSnap(raw, free, ortho) {
  let best = { p: { x: raw.x, y: raw.y }, kind: 'free' };
  if (!free && viewTransform) {
    const reach = 10 / viewTransform.scale;
    const corners = [];
    shapesOnFloor(state.activeFloor).forEach(sh => corners.push(...sh.points));
    if (state.segments.length || state.traceStarted) corners.push(...pathPointsHere(state.segments));
    let bd = reach;
    corners.forEach(c => { const d = Math.hypot(c.x - raw.x, c.y - raw.y); if (d < bd) { bd = d; best = { p: { x: c.x, y: c.y }, kind: 'vertex' }; } });
  }
  if (ortho && (state.segments.length || state.traceStarted)) {
    const pen = tracePen();
    if (Math.abs(best.p.x - pen.x) >= Math.abs(best.p.y - pen.y)) best.p.y = pen.y; else best.p.x = pen.x;
  }
  return best;
}
// The wall the next click would add: squared when nearly square, rounded to the
// inch — unless it lands exactly on an existing corner.
function traceWallTo(target, kind) {
  const pen = tracePen();
  let dx = target.x - pen.x, dy = target.y - pen.y;
  if (kind !== 'vertex') {
    const ang = Math.abs(Math.atan2(dy, dx) * 180 / Math.PI);          // 0..180 from the +x axis
    if (ang < TRACE_SQUARE_DEG || ang > 180 - TRACE_SQUARE_DEG) dy = 0;   // left or right
    else if (Math.abs(ang - 90) < TRACE_SQUARE_DEG) dx = 0;               // up or down
    dx = Math.round(dx * 12) / 12; dy = Math.round(dy * 12) / 12;
  }
  return { pen, dx, dy };
}
function traceClickAt(raw, free, ortho) {
  const sn = traceSnap(raw, free, ortho);
  if (state.segments.length === 0 && !state.traceStarted) {
    setStartPoint(sn.p);
    state.traceStarted = true;
    render();
    return;
  }
  const { pen, dx, dy } = traceWallTo(sn.p, sn.kind);
  if (Math.hypot(dx, dy) < 0.05) return;
  pushUndo();
  state.preview = null;
  const seg = segmentBetween(pen, { x: pen.x + dx, y: pen.y + dy });
  state.segments.push(seg);
  render();
}
function renderTraceHover(W) {
  if (!traceActive() || !state.traceHover) return;
  const h = state.traceHover, cue = { fill: 'none', stroke: '#e6007a', 'stroke-width': 2, class: 'ui-overlay', 'pointer-events': 'none' };
  if (state.segments.length || state.traceStarted) {
    const { pen, dx, dy } = traceWallTo(h.p, h.kind);
    const a = W(pen), b = W({ x: pen.x + dx, y: pen.y + dy });
    addEl('path', { d: `M${a.x} ${a.y} L${b.x} ${b.y}`, ...cue, 'stroke-dasharray': '5,4' });
    addEl('text', { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 - 10, 'text-anchor': 'middle', 'font-size': 13, 'font-weight': 'bold', fill: '#e6007a',
      stroke: 'white', 'stroke-width': 3.5, 'paint-order': 'stroke fill', class: 'ui-overlay', 'pointer-events': 'none' }, formatLength(Math.hypot(dx, dy)));
  }
  const c = W(h.p);
  if (h.kind === 'vertex') addEl('rect', { x: c.x - 6, y: c.y - 6, width: 12, height: 12, ...cue });
  else addEl('circle', { cx: c.x, cy: c.y, r: 4, ...cue });
}
// Magnifier: the scan itself, 5x, around the cursor, with a crosshair. It is drawn
// from the stored image, outside the SVG, so render() never touches it.
let traceLoupeImg = null;
function hideTraceLoupe() { const l = document.getElementById('trace-loupe'); if (l) l.style.display = 'none'; }
function drawTraceLoupe(clientX, clientY, world) {
  const u = visibleUnderlay();
  if (!u) return hideTraceLoupe();
  let cv = document.getElementById('trace-loupe');
  if (!cv) {
    cv = document.createElement('canvas'); cv.id = 'trace-loupe'; cv.width = 160; cv.height = 160;
    cv.style.cssText = 'position:fixed;z-index:950;pointer-events:none;border-radius:50%;border:2px solid #e6007a;box-shadow:0 4px 14px rgba(0,0,0,.3);background:#fff;';
    document.body.appendChild(cv);
  }
  if (!traceLoupeImg || traceLoupeImg.dataset.src !== u.src.slice(0, 64) + u.src.length) {
    traceLoupeImg = new Image(); traceLoupeImg.dataset.src = u.src.slice(0, 64) + u.src.length; traceLoupeImg.src = u.src;
  }
  const g = cv.getContext('2d');
  const ix = (world.x - u.x) / u.ftPerPx, iy = (world.y - u.y) / u.ftPerPx, R = 16;   // image px each side
  g.fillStyle = '#fff'; g.fillRect(0, 0, 160, 160);
  if (traceLoupeImg.complete) { g.imageSmoothingEnabled = false; g.drawImage(traceLoupeImg, ix - R, iy - R, 2 * R, 2 * R, 0, 0, 160, 160); }
  g.strokeStyle = '#e6007a'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(80, 0); g.lineTo(80, 160); g.moveTo(0, 80); g.lineTo(160, 80); g.stroke();
  const left = clientX + 28 + 160 > window.innerWidth ? clientX - 188 : clientX + 28;
  const top = clientY + 28 + 160 > window.innerHeight ? clientY - 188 : clientY + 28;
  cv.style.left = left + 'px'; cv.style.top = top + 'px'; cv.style.display = 'block';
}

function startOffsetPick() {
  state.offsetPick = { first: null, hover: null };
  render();
}
function cancelOffsetPick() {
  state.offsetPick = null;
  render();
}
function toggleMeasure() {
  if (state.offsetPick) cancelOffsetPick(); else startOffsetPick();
}
function handleOffsetPick(worldPoint) {
  if (!state.offsetPick) return;
  const p = { x: worldPoint.x, y: worldPoint.y };
  const first = state.offsetPick.first;
  if (!first) {
    state.offsetPick.first = p;
    render();
  } else if (Math.hypot(p.x - first.x, p.y - first.y) > 0.01) {
    pushUndo();
    state.annotations.push({ a: first, b: p, floor: state.activeFloor });
    state.offsetPick.first = null;   // stay armed for the next measurement
    render();
  }
}
// Where a Measure click lands: the nearest corner within reach, else the nearest
// point on a straight wall, else exactly where the pointer is. Corners/walls come
// from the active floor and the in-progress walk. Alt skips snapping; Shift then
// keeps the line level or plumb from the first point.
function measureSnap(raw, free, ortho) {
  let best = { p: { x: raw.x, y: raw.y }, kind: 'free' };
  if (!free && viewTransform) {
    const reach = 12 / viewTransform.scale;
    const corners = [];
    shapesOnFloor(state.activeFloor).forEach(sh => corners.push(...sh.points));
    if (state.segments.length) corners.push(...pathPointsHere(state.segments));
    let bestD = reach;
    corners.forEach(c => {
      const d = Math.hypot(c.x - raw.x, c.y - raw.y);
      if (d < bestD) { bestD = d; best = { p: { x: c.x, y: c.y }, kind: 'vertex' }; }
    });
    if (best.kind === 'free') {
      bestD = reach * 0.75;
      shapesOnFloor(state.activeFloor).forEach(sh => {
        for (let i = 0; i < sh.points.length - 1; i++) {
          if (wallArc(sh, i)) continue;   // a chord projection would land off a curved wall
          const a = sh.points[i], b = sh.points[i + 1];
          const vx = b.x - a.x, vy = b.y - a.y, L2 = vx * vx + vy * vy;
          if (L2 < 1e-9) continue;
          const t = Math.max(0, Math.min(1, ((raw.x - a.x) * vx + (raw.y - a.y) * vy) / L2));
          const q = { x: a.x + t * vx, y: a.y + t * vy };
          const d = Math.hypot(q.x - raw.x, q.y - raw.y);
          if (d < bestD) { bestD = d; best = { p: q, kind: 'wall' }; }
        }
      });
    }
  }
  const first = state.offsetPick && state.offsetPick.first;
  if (ortho && first) {
    if (Math.abs(best.p.x - first.x) >= Math.abs(best.p.y - first.y)) best.p.y = first.y;
    else best.p.x = first.x;
  }
  return best;
}
function removeAnnotation(i) {
  pushUndo();
  state.annotations.splice(i, 1);
  render();
}
function clearAnnotations() {
  if (!state.annotations.length) return;
  pushUndo();
  state.annotations = [];
  render();
}

// Basement vs main-floor outline, with the one-click match, where the basement is
// being worked on (basement tab, or a basement area selected) rather than only in
// the Basement panel further down.
function basementMatchBlock(b) {
  const drawn = basementFoundationShapes(b), main = mainLivingShapes(b);
  if (!drawn.length || !main.length) return '';
  const da = Math.round(drawn.reduce((a, sh) => a + shapeArea(sh), 0)), ma = Math.round(main.reduce((a, sh) => a + shapeArea(sh), 0));
  const diff = da - ma;
  return `<div class="help" style="margin:6px 0 4px;">${buildingsPresent().length > 1 ? `<b>${escapeHtml(b)}:</b> ` : ''}basement outline <b>${da} sf</b> · main floor <b>${ma} sf</b>${diff ? ` (${diff > 0 ? '+' : ''}${diff} sf)` : ' (same)'}</div>
    ${diff ? `<div class="row-buttons"><button data-act="matchBasement" data-b="${escapeHtml(b)}" title="Replace this basement outline with a copy of the main floor's enclosed-living outline (Undo puts it back)">Match to main floor outline</button></div>` : ''}`;
}

// ----- Above/below-grade area helpers (appraisal reporting) -----
const ABOVE_GRADE_FLOORS = ['main', 'upper'];
const AGLA_TYPES = ['living', 'upper'];   // Enclosed living + Upper floor area

function buildingsPresent() {
  return [...new Set(state.shapes.map(sh => sh.building || DEFAULT_BUILDING))];
}
// Main-floor footprint = enclosed living on the 'main' floor (the basement's footprint by default).
function mainFloorFootprint(building) {
  return state.shapes
    .filter(sh => (sh.building || DEFAULT_BUILDING) === building && sh.floor === 'main' && sh.type === 'living')
    .reduce((a, sh) => a + shapeArea(sh), 0);
}
function aboveGradeLiving(building) {
  return state.shapes
    .filter(sh => (sh.building || DEFAULT_BUILDING) === building
      && ABOVE_GRADE_FLOORS.includes(sh.floor) && AGLA_TYPES.includes(sh.type))
    .reduce((a, sh) => a + shapeArea(sh), 0);
}
function basementArea(building) {
  const b = state.basements[building];
  if (b && b.areaOverride != null) return b.areaOverride;
  return mainFloorFootprint(building);
}
function toggleBasement(b, on) {
  pushUndo();
  if (on) state.basements[b] = state.basements[b] || { areaOverride: null, pctFinished: 100 };
  else delete state.basements[b];
  render();
}
function setBasementArea(b, val) {
  const bm = state.basements[b]; if (!bm) return;
  pushUndo();
  const n = parseFloat(val);
  bm.areaOverride = (String(val).trim() === '' || isNaN(n)) ? null : Math.max(0, n);
  render();
}
function setBasementPct(b, val) {
  const bm = state.basements[b]; if (!bm) return;
  pushUndo();
  let n = parseFloat(val); if (isNaN(n)) n = 0;
  bm.pctFinished = Math.max(0, Math.min(100, n));
  render();
}

// Basement outline = main-floor outline. For when the appraiser has verified the
// above-grade walls and the exposed part of the foundation agrees with them, but a
// traced or walked basement outline (an iGUIDE scan from inside, say) does not.
const FOUNDATION_TYPES = ['finished', 'unfinished'];
function mainLivingShapes(b) {
  return state.shapes.filter(sh => (sh.building || DEFAULT_BUILDING) === b && sh.floor === 'main' && sh.type === 'living');
}
function basementFoundationShapes(b) {
  return state.shapes.filter(sh => (sh.building || DEFAULT_BUILDING) === b && sh.floor === 'basement' && FOUNDATION_TYPES.includes(sh.type));
}
function matchBasementToMain(b, noAsk) {
  const main = mainLivingShapes(b);
  if (!main.length) { alert(`${b} has no enclosed living area on the main floor to copy.`); return; }
  const old = basementFoundationShapes(b);
  const mainArea = Math.round(main.reduce((a, sh) => a + shapeArea(sh), 0));
  const oldArea = Math.round(old.reduce((a, sh) => a + shapeArea(sh), 0));
  const msg = old.length
    ? `Replace the basement outline of ${b} (${oldArea} sf) with the main floor's outline (${mainArea} sf)?\n\nDecks, patios and other areas on the basement floor stay as they are. Undo restores the old outline.`
    : `Add a basement to ${b} with the main floor's outline (${mainArea} sf)?`;
  if (!noAsk && !confirm(msg)) return;
  pushUndo();
  const like = old[0];
  state.shapes = state.shapes.filter(sh => !old.includes(sh));
  main.forEach((m, k) => {
    const sh = JSON.parse(JSON.stringify(m));
    sh.id = state.nextShapeId++;
    sh.floor = 'basement';
    sh.type = like ? like.type : 'finished';
    sh.label = (like && like.label ? like.label : 'Basement') + (main.length > 1 ? ` (${k + 1})` : '');
    delete sh.labelOffset; delete sh.dimOffsets;
    rebuildSegments(sh);
    state.shapes.push(sh);
  });
  if (!state.floors.includes('basement')) state.floors.unshift('basement');
  const bm = state.basements[b] || (state.basements[b] = { areaOverride: null, pctFinished: 100 });
  bm.areaOverride = null;   // auto = main-floor footprint, which is now the basement outline
  state.selection = null;
  render();
}

function sidebarBasement() {
  const buildings = buildingsPresent();
  if (buildings.length === 0) return '';
  let html = '<div class="section"><h2>Basement (below grade)</h2>';
  buildings.forEach(b => {
    const bm = state.basements[b];
    const enabled = !!bm;
    const auto = Math.round(mainFloorFootprint(b));
    html += `<div style="padding:6px 0; border-bottom:1px solid #eee;">
      <label style="display:flex; align-items:center; gap:8px; font-size:12px; font-weight:bold; cursor:pointer;">
        <input type="checkbox" onchange="toggleBasement('${b}', this.checked)" ${enabled ? 'checked' : ''}> ${escapeHtml(b)}</label>`;
    if (mainLivingShapes(b).length) {
      const drawn = basementFoundationShapes(b);
      const drawnArea = Math.round(drawn.reduce((a, sh) => a + shapeArea(sh), 0));
      html += `<div class="row-buttons" style="margin:4px 0;"><button data-act="matchBasement" data-b="${escapeHtml(b)}"
        title="Replace the basement outline with a copy of the main floor's enclosed living outline — use when the foundation you measured matches the walls above">Match basement to main floor</button></div>
        ${drawn.length ? `<div class="help" style="margin:0 0 4px;">Basement drawn: <b>${drawnArea} sf</b> · main floor: <b>${auto} sf</b>${Math.abs(drawnArea - auto) >= 1 ? ` (${drawnArea > auto ? '+' : ''}${drawnArea - auto} sf)` : ' (same)'}</div>` : ''}`;
    }
    if (enabled) {
      const area = Math.round(basementArea(b));
      const pct = bm.pctFinished;
      const fin = Math.round(area * pct / 100);
      const unf = Math.round(area - area * pct / 100);
      const areaVal = bm.areaOverride != null ? Math.round(bm.areaOverride) : '';
      html += `
        <div class="field"><label style="flex:1;">Area (sf)</label>
          <input type="number" style="width:90px;" value="${areaVal}" placeholder="auto ${auto}"
            onchange="setBasementArea('${b}', this.value)"></div>
        <div class="field"><label style="flex:1;">% finished</label>
          <input type="number" min="0" max="100" style="width:90px;" value="${pct}"
            onchange="setBasementPct('${b}', this.value)"></div>
        <div class="help">Footprint <b>${area} sf</b> → Finished <b>${fin} sf</b> · Unfinished <b>${unf} sf</b>.
          ${bm.areaOverride == null ? `Auto from main-floor enclosed living (${auto} sf).` : 'Manual override — clear the field to auto-use the main-floor footprint.'}</div>`;
    }
    html += '</div>';
  });
  html += '</div>';
  return html;
}

function sidebarTotals() {
  if (state.shapes.length === 0) return '';
  // Totals grouped Building → Floor → Type
  let html = '<div class="section"><h2>Totals (all buildings)</h2><div id="totals">';
  const byBuilding = {};
  state.shapes.forEach(sh => {
    const b = sh.building || DEFAULT_BUILDING;
    if (!byBuilding[b]) byBuilding[b] = {};
    if (!byBuilding[b][sh.floor]) byBuilding[b][sh.floor] = {};
    byBuilding[b][sh.floor][sh.type] = (byBuilding[b][sh.floor][sh.type] || 0) + shapeArea(sh);
  });
  Object.entries(byBuilding).forEach(([building, floors]) => {
    html += `<div style="margin-top:8px;font-weight:bold;font-size:12px;color:#2b3a4a;border-bottom:1px solid #ddd;">${escapeHtml(building)}</div>`;
    let buildingTotal = 0;
    Object.entries(floors).forEach(([floor, types]) => {
      html += `<div style="margin-top:4px;font-weight:bold;font-size:11px;color:#555;">&nbsp;&nbsp;${floor}</div>`;
      let floorTotal = 0;
      Object.entries(types).forEach(([k,v]) => {
        html += `<div class="row"><span>&nbsp;&nbsp;&nbsp;&nbsp;${TYPES[k]?TYPES[k].name:k}</span><span>${Math.round(v)} sf</span></div>`;
        floorTotal += v;
      });
      html += `<div class="row total"><span>&nbsp;&nbsp;&nbsp;&nbsp;Floor total</span><span>${Math.round(floorTotal)} sf</span></div>`;
      buildingTotal += floorTotal;
    });
    html += `<div class="row total"><span>&nbsp;&nbsp;${escapeHtml(building)} total</span><span>${Math.round(buildingTotal)} sf</span></div>`;

    // Above / below grade living-area summary (appraisal reporting)
    const agla = aboveGradeLiving(building);
    const bm = state.basements[building];
    if (agla > 0 || bm) {
      html += `<div style="margin-top:4px; padding-top:4px; border-top:1px dashed #bbb;"></div>`;
      html += `<div class="row total"><span>&nbsp;&nbsp;Above-Grade Living Area</span><span>${Math.round(agla)} sf</span></div>`;
      if (bm) {
        const area = basementArea(building);
        const fin = area * bm.pctFinished / 100;
        html += `<div class="row"><span>&nbsp;&nbsp;Below-Grade (basement)</span><span>${Math.round(area)} sf</span></div>`;
        html += `<div class="row"><span>&nbsp;&nbsp;&nbsp;&nbsp;Finished (${Math.round(bm.pctFinished)}%)</span><span>${Math.round(fin)} sf</span></div>`;
        html += `<div class="row"><span>&nbsp;&nbsp;&nbsp;&nbsp;Unfinished</span><span>${Math.round(area - fin)} sf</span></div>`;
      }
    }
  });
  html += '</div></div>';
  return html;
}

// SIDEBAR HANDLERS
// =============================================================================
function attachSidebarHandlers() {
  document.querySelectorAll('#sidebar [data-act]').forEach(el => {
    el.addEventListener('click', sidebarAction);
  });
  const cmd = document.getElementById('cmd');
  const ARROW_DIR = { ArrowRight: 'r', ArrowLeft: 'l', ArrowUp: 'u', ArrowDown: 'd' };
  if (cmd) cmd.addEventListener('keydown', e => {
    if (e.key === 'Enter') addCmd();
    else if (e.key === 'Escape') { if (currentEnclose()) encloseDismiss(); else if (currentCloseOffer()) closeOfferDismiss(); else cancelWalkPreview(); cmd.value = ''; }
    else if (e.key === 'Tab' && cmd.value === '' && currentCloseOffer()) { e.preventDefault(); closeOfferDismiss(); }
    else if ((e.key === 'n' || e.key === 'N') && cmd.value === '' && currentEnclose()) { e.preventDefault(); encloseNext(); }
    else if (e.key in ARROW_DIR && cmd.value === '') {
      // Empty input + arrow key → preview/cycle next aligned vertex as a pen-jump (no wall)
      e.preventDefault();
      handleAutoExtendKey(ARROW_DIR[e.key], /*asJump=*/true);
    }
    else if (e.key in ARROW_DIR && isLengthOnly(cmd.value)) {
      // A length typed + arrow key → add that wall in the arrow's direction
      e.preventDefault();
      compassDir(ARROW_DIR[e.key]);
    }
  });
  const off = document.getElementById('start-offset');
  if (off) off.addEventListener('keydown', e => { if (e.key === 'Enter') offsetStart(); });
  const rise = document.getElementById('arc-rise');
  if (rise) rise.addEventListener('keydown', e => { if (e.key === 'Enter') applyWallArc(); });
  const sdir = document.getElementById('split-dir');
  if (sdir) sdir.addEventListener('keydown', e => {
    if (e.key === 'Enter') splitProject();
    else if (e.key === 'Escape') { cancelSplitProject(); sdir.value = ''; }
  });
  if (window.Dictation && typeof Dictation.init === 'function') Dictation.init();
}

function sidebarAction(e) {
  const act = e.currentTarget.dataset.act;
  const i = e.currentTarget.dataset.i;
  const id = e.currentTarget.dataset.id;
  switch (act) {
    case 'addCmd': addCmd(); break;
    case 'undo': undoHistory(); break;
    case 'closeShape': closeShape(); break;
    case 'deleteFenced': deleteFenced(); break;
    case 'encloseAccept': closeShape(); break;
    case 'encloseNext': encloseNext(); break;
    case 'encloseDismiss': encloseDismiss(); break;
    case 'closeOfferDismiss': closeOfferDismiss(); break;
    case 'cancelShape': cancelShape(); break;
    case 'removeSeg': pushUndo(); state.segments.splice(parseInt(i),1); render(); break;
    case 'applyLen': applyLengthEdit(); break;
    case 'applyArc': applyWallArc(); break;
    case 'clearArc': clearWallArc(); break;
    case 'moveWall': moveSelectedWall(); break;
    case 'insertVertex': insertVertexAction(); break;
    case 'deleteWall': deleteWallAction(); break;
    case 'wallRmPick': if (state.wallRemoval) { state.wallRemoval.idx = parseInt(id); render(); } break;
    case 'wallRmNext': nextWallRemoval(); break;
    case 'wallRmApply': applyWallRemoval(); break;
    case 'wallRmCancel': cancelWallRemoval(); break;

    case 'selectShape': state.mode='edit'; state.selection = {kind:'shape', shapeId: parseInt(id)}; render(); break;
    case 'editShape': state.mode='edit'; state.selection = {kind:'shape', shapeId: parseInt(id)}; render(); break;

    case 'loadUnderlay': pickUnderlayFile(); break;

    case 'cancelUnderlayCal': cancelUnderlayCal(); break;
    case 'removeUnderlay': removeUnderlay(); break;
    case 'startOffsetPick': startOffsetPick(); break;
    case 'cancelOffsetPick': cancelOffsetPick(); break;

    case 'matchBasement': matchBasementToMain(e.currentTarget.dataset.b); break;

    case 'traceStart': state.traceClick = true; state.traceStarted = false; document.querySelector('#mode-tabs button[data-mode="walk"]').click(); break;

// ----- Remove a wall: choose how the outline closes up -------------------------
// Removing a wall has several sensible results, so they are offered as options

// the other side (the cut a Split leaves; keep either area's type), run the
// neighbouring walls on until they meet, or join them straight across either corner.

  const opts = [], bld = sh.building || DEFAULT_BUILDING, clone = o => JSON.parse(JSON.stringify(o));
  const typeName = t => (TYPES[t] && TYPES[t].name) || t;
  state.shapes.forEach(o => {
    if (o === sh || o.floor !== sh.floor || (o.building || DEFAULT_BUILDING) !== bld) return;
    const m = mergeAcrossWall(sh, wi, o);
    if (!m) return;
    (shapeArea(o) >= shapeArea(sh) ? [o, sh] : [sh, o]).forEach(keep => {
      const res = { ...clone(keep), points: m.points, arcs: m.arcs, dimOffsets: undefined, calc: undefined };
      rebuildSegments(res);

// ----- Move a whole shape ----------------------------------------------------
// Points move; segments carry only dx/dy so nothing to rebuild; label nudges are
// relative to the geometry and travel with it.
function translateShape(sh, dx, dy) {
  pushUndo();
  sh.points = sh.points.map(p => ({ x: p.x + dx, y: p.y + dy }));
}
function moveSelectedShapeByOffset() {
  const sel = state.selection;
  if (!sel || sel.kind !== 'shape') return;
  const sh = state.shapes.find(s => s.id === sel.shapeId);
  if (!sh) return;
  const input = document.getElementById('move-offset');
  if (!input) return;
  const raw = input.value.trim();
  if (!raw) { alert("Enter an offset like 3' r or 2'6 d 1' l"); return; }
  let seg;
  try { seg = parseSegment(raw); } catch (err) { alert(err.message); return; }
  if (seg.autoExtend) { alert("Provide a length and direction (e.g. 3' r)."); return; }
  translateShape(sh, seg.dx, seg.dy);
  render();
}
// Move by picking: first click = anchor vertex on the shape being moved, second
// click = destination (any vertex on any floor — ghosts are clickable while picking —
// or a blank spot on the canvas). The shape translates so the anchor lands there.
function startShapeMovePick() {
  const sel = state.selection;
  if (!sel || sel.kind !== 'shape') return;
  state.shapeMovePick = { shapeId: sel.shapeId, anchor: null };
  render();
}
function cancelShapeMovePick() { state.shapeMovePick = null; render(); }
function handleShapeMovePick(sh, i) {
  const mp = state.shapeMovePick;
  if (!mp) return;
  if (!mp.anchor) {
    if (sh.id !== mp.shapeId) { alert('Pick the anchor on the shape you are moving first.'); return; }
    mp.anchor = { x: sh.points[i].x, y: sh.points[i].y };
    render();
    return;
  }
  finishShapeMove(sh.points[i]);
}
function finishShapeMove(dest) {

  if (!mp || !mp.anchor) return;
  const sh = state.shapes.find(s => s.id === mp.shapeId);
  if (sh) translateShape(sh, dest.x - mp.anchor.x, dest.y - mp.anchor.y);
  state.shapeMovePick = null;
  render();
}

function copySelectedShape() {
  const sel = state.selection;
  if (!sel || sel.kind !== 'shape') return;
  const sh = state.shapes.find(s => s.id === sel.shapeId);
  if (!sh) return;
  const input = document.getElementById('copy-offset');
  if (!input) return;
  const raw = input.value.trim();
  if (!raw) { alert('Enter an offset like 10\' r or 5\'d 3\'l'); return; }
  let seg;
  try { seg = parseSegment(raw); } catch (err) { alert(err.message); return; }

  pushUndo();
  const newId = state.nextShapeId++;
  const newShape = {
    id: newId,
    label: `${sh.label} (copy)`,
    type: sh.type,

// =============================================================================
// SPLIT MODE
// =============================================================================
function splitProject() {
  const input = document.getElementById('split-dir');
  if (!input) return;
  const raw = input.value.trim().toLowerCase();
  if (!raw) return;
  if (!(raw in DIR_BASE)) { alert('Direction must be r, l, u, or d.'); return; }
  if (!state.splitSelection) { alert('Click the first vertex before projecting.'); return; }
  const sh = state.shapes.find(s => s.id === state.splitSelection.shapeId);
  if (!sh) return;
  const origin = sh.points[state.splitSelection.idx];
  const hit = rayHitsWall(origin, raw, sh, state.splitSelection.idx);
  if (!hit) { alert(`No wall hit by ray in direction "${raw}".`); return; }
  state.splitPreview = { shapeId: sh.id, originIdx: state.splitSelection.idx, dir: raw, hit };
  input.value = '';
  render();
}

function confirmSplitProject() {
  const sp = state.splitPreview;
  if (!sp) return;
  const sh = state.shapes.find(s => s.id === sp.shapeId);
  if (!sh) return;
  pushUndo();
  // Insert a new vertex on the hit wall (between points[wallIdx] and points[wallIdx+1]).
  const wallIdx = sp.hit.wallIdx;
  const arcsBefore = sh.arcs, calcBefore = sh.calc;
  sh.points.splice(wallIdx + 1, 0, { x: sp.hit.point.x, y: sp.hit.point.y });
  sh.arcs = remapByWall(sh.arcs, i => i < wallIdx ? i : i > wallIdx ? i + 1 : null);
  if (sh.calc) {
    const o = remapByWall(sh.calc, i => i < wallIdx ? i : i > wallIdx ? i + 1 : null) || {};
    if (sh.calc[wallIdx]) { o[wallIdx] = true; o[wallIdx + 1] = true; }
    sh.calc = o;
  }
  rebuildSegments(sh);
  // Origin index may have shifted if it was after the inserted vertex.
  let originIdx = sp.originIdx;
  if (originIdx > wallIdx) originIdx += 1;
  const newVertexIdx = wallIdx + 1;
  const result = splitPolygon(sh, originIdx, newVertexIdx);
  if (!result) {
    // Revert insert + undo
    sh.points.splice(wallIdx + 1, 1);
    sh.arcs = arcsBefore; sh.calc = calcBefore;
    rebuildSegments(sh);
    state.undoStack.pop();
    state.splitPreview = null;
    render();
    return;
  }
  const i = state.shapes.indexOf(sh);
  state.shapes.splice(i, 1, result.a, result.b);
  state.splitSelection = null;
  state.splitPreview = null;
  state.mode = 'edit';
  state.selection = { kind: 'shape', shapeId: result.a.id };
  render();
}

function cancelSplitProject() {
  state.splitPreview = null;
  render();
}

function handleSplitClick(shapeId, vIdx) {
  if (!state.splitSelection) {
    state.splitSelection = { shapeId, idx: vIdx };
    render();
    return;
  }
  if (state.splitSelection.shapeId !== shapeId) {
    alert('Both vertices must be in the same shape.');
    return;
  }
  const idx1 = state.splitSelection.idx, idx2 = vIdx;
  const sh = state.shapes.find(s => s.id === shapeId);
  const result = splitPolygon(sh, idx1, idx2);
  if (!result) { state.splitSelection = null; render(); return; }
  pushUndo();
  // Replace the original with the two new ones
  const i = state.shapes.indexOf(sh);
  state.shapes.splice(i, 1, result.a, result.b);
  state.splitSelection = null;
  state.mode = 'edit';
  state.selection = { kind:'shape', shapeId: result.a.id };
  render();
}

// =============================================================================
// WALK MODE COMMANDS
// =============================================================================
// ----- Compass rose: absolute directions, clockwise from up (0 = up, 90 = right) -----
// Users pick a wedge (or a list entry) instead of remembering the r/l/u/d + angle
// grammar. Each heading maps to an ABSOLUTE typed command: cardinals to u/r/d/l,
// everything else to "u <angle>" / "d <angle>" (degrees clockwise from up/down),
// which the parser treats as absolute regardless of the previous wall.

  deg = ((deg % 360) + 360) % 360;
  if (deg === 0) return 'u'; if (deg === 90) return 'r'; if (deg === 180) return 'd'; if (deg === 270) return 'l';
  // screen heading (CW from east) = deg - 90; u covers the upper half, d the lower

  const names = { 0: 'up', 45: 'up-right', 90: 'right', 135: 'down-right', 180: 'down', 225: 'down-left', 270: 'left', 315: 'up-left' };

}

  let out = `<svg id="compass-rose" width="${W}" height="${W}" viewBox="0 0 ${W} ${W}" aria-label="Compass: click a direction">`;
  roseHeadings().forEach(d => {
    const a0 = d - roseStep / 2, a1 = d + roseStep / 2;

function addCmd() {
  const input = document.getElementById('cmd');
  if (!input) return;
  if (roseHeading !== null && isLengthOnly(input.value)) input.value = input.value.trim() + ' ' + headingToCmd(roseHeading);
  const raw = input.value.trim();

  // Empty input: an offered enclosure wins over a merely armed step suggestion;
  // a preview the user is actively cycling still commits.
  if (!raw) {
    if (currentEnclose()) { closeShape(); return; }
    if (currentCloseOffer()) { closeShape(); return; }
    if (state.preview) commitWalkPreview();
    return;
  }

  const parts = raw.split(',').map(p => p.trim()).filter(Boolean);
  try {
    // Special case: a single bare direction → enter/advance preview mode
    const firstProbe = parseSegment(parts[0]);
    if (parts.length === 1 && firstProbe.autoExtend) {
      handleAutoExtendKey(firstProbe.dir);
      input.value = '';
      input.focus();
      return;
    }

    // Any other input — resolve a pending preview first. A preview the user is
    // actively cycling gets committed (don't lose it); an auto-armed step
    // suggestion gets discarded so explicit input doesn't inject a phantom wall.
    if (state.preview) {
      if (state.preview.armed) state.preview = null;
      else commitWalkPreview(/*silent=*/true);
    }

    let priorHeading = state.segments.length > 0
      ? headingDeg(state.segments[state.segments.length - 1])
      : null;
    const resolved = [];
    for (const part of parts) {
      const p = parseSegment(part, priorHeading);
      let seg;
      if (p.autoExtend) {
        const cands = findAlignedCandidatesHere([...state.segments, ...resolved], p.dir);
        if (!cands.length) throw new Error(`No vertex aligned to "${p.dir}" of the current pen position.`);
        seg = cands[0].segment;
      } else {
        seg = p;
      }
      resolved.push(seg);
      priorHeading = headingDeg(seg);
    }
    pushUndo();
    state.segments.push(...resolved);

    render();

}

function handleAutoExtendKey(dir, asJump = false) {

  if (state.preview && state.preview.dir === dir && !!state.preview.jump === asJump) {
    state.preview.candIdx = (state.preview.candIdx + 1) % state.preview.candidates.length;
    state.preview.armed = false;   // user is now actively choosing this preview
    render();
    return;
  }
  // New preview (possibly switching direction or mode)
  const cands = findAlignedCandidatesHere(state.segments, dir);
  if (!cands.length) { alert(`No vertex aligned to "${dir}" of the current pen position.`); return; }

  render();

// Click-to-snap: draw one straight segment from the pen to a clicked point
// (any shape vertex or walk vertex). Works regardless of alignment — the fix
// for closing angled walks where keyboard r/u snapping has nothing to grab.
function snapWalkToPoint(target) {

  const wpts = pathPointsHere(state.segments);
  const pen = wpts[wpts.length - 1];

  const dir = Math.abs(dx) >= Math.abs(dy) ? (dx >= 0 ? 'r' : 'l') : (dy >= 0 ? 'd' : 'u');

  state.preview = null;
  state.segments.push({ length, dir, angle: 0, dx, dy, raw: `${formatLength(length)} ${dir} (to point)` });
  render();
}

function commitWalkPreview(silent) {

  const { dir, jump } = state.preview;
  const cand = state.preview.candidates[state.preview.candIdx];
  pushUndo();
  if (jump) {
    state.segments.push({
      ...cand.segment,
      jump: true,
      raw: `↷ ${formatLength(cand.along)} ${dir} (jump)`

  } else {
    state.segments.push(cand.segment);
  }
  state.preview = null;

  // next aligned snap in the SAME direction/mode from the new pen, so you can walk
  // successive alignments with r⏎ … ⏎ ⏎ (then u⏎ ⏎) without retyping the direction.
  // A silent pre-commit (made before processing other input) does not re-arm.
  if (!silent) {

function cancelWalkPreview() {
  if (!state.preview) return;
  state.preview = null;

}

// ----- Re-walk a wall -------------------------------------------------------

  const sh = state.shapes.find(s => s.id === sel.shapeId);

function cancelShape() {

// Extract walls (non-jump segments) with their absolute endpoints by walking the chain.
function extractWalls(segments) {

  let x = start.x, y = start.y;

  for (const s of segments) {
    const sx = x, sy = y;
    x += s.dx; y += s.dy;
    if (!s.jump) walls.push({ a: { x: sx, y: sy }, b: { x, y } });

// Given walls (each {a, b}), assemble an ordered polygon vertex list by traversing

function assemblePolygonFromWalls(walls) {

    for (let i = 0; i < verts.length; i++) if (sameP(verts[i], p)) return i;
    verts.push({ x: p.x, y: p.y });

  for (let i = 0; i < walls.length; i++) {

    if (aId === bId) continue;
    if (!adj[aId]) adj[aId] = [];
    if (!adj[bId]) adj[bId] = [];
    adj[aId].push({ wallIdx: i, otherId: bId });
    adj[bId].push({ wallIdx: i, otherId: aId });
  }
  for (let i = 0; i < verts.length; i++) if (!adj[i]) adj[i] = [];

    if (!next) break;
    used.add(next.wallIdx);
    path.push(next.otherId);
    cur = next.otherId;

function closeShape() {

  } else if (hasJumps) {

    const start = pts[0];
    const last = pts[pts.length-1];

// ----- Enclosed-area offer -----------------------------------------------------

// one, the walked legs plus a run of existing walls may fence off a region. Rather
// than closing with a straight line back to the start (which cuts a triangle

function encCandidates() {

  const walk = pathPointsHere(state.segments);

      if (area < 1) continue;
      if (interior.some(ip => pointInPoly(ip, poly.slice(0, -1)))) continue;   // would swallow a shape

function currentEnclose() {

}
function renderEnclose(W) {

// Fetches the app's own files, inlines the two scripts, embeds LICENSE and NOTICE,
// drops the PWA manifest/service-worker hooks, and saves one HTML file named for the
// version. Only possible when the app is served (osasi.org or any local server): a page
// opened from disk cannot read its own source.
async function saveAppCopy() {
  const ver = ((document.getElementById('app-version') || {}).textContent || '').replace(/^v/, '') || 'unknown';
  if (location.protocol === 'file:') {
    alert('This copy was opened from disk, so it cannot read its own source.\n\nRun CValR-Sketch from osasi.org (or any served copy) and use Save app copy there — or simply copy index.html, core.js and dictation.js from this folder into the job folder.');
    return;
  }
  try {
    const get = async f => { const r = await fetch(f, { cache: 'no-store' }); if (!r.ok) throw new Error(f + ': HTTP ' + r.status); return r.text(); };
    const [html, core, dict, licence, notice] = await Promise.all(
      [get('index.html'), get('core.js'), get('dictation.js'), get('LICENSE'), get('NOTICE')]);
    const inline = js => '<script>\n' + js.replace(/<\/script/gi, '<\\/script') + '\n<\/script>';
    let out = html;
    out = out.replace(/<script src="core\.js\?v=[^"]*"><\/script>/, () => inline(core));
    out = out.replace(/<script src="dictation\.js\?v=[^"]*"><\/script>/, () => inline(dict));
    out = out.replace(/[ \t]*<link rel="manifest"[^>]*>\r?\n/i, '');
    out = out.replace(/navigator\.serviceWorker\.register\([^)]*\)/g, 'Promise.resolve()');
    // AGPL §4: a copy handed on must carry the licence, and NOTICE holds the §7 terms. A single
    // file has no LICENSE beside it, so both travel inside; openLegal() shows them from here.
    const plain = (id, text) => '<script type="text/plain" id="' + id + '">\n' + text.replace(/<\/script/gi, '<\\/script') + '\n<\/script>\n';
    const end = out.lastIndexOf('</body>');
    if (end === -1) throw new Error('no </body> in index.html');
    out = out.slice(0, end) + plain('embedded-LICENSE', licence) + plain('embedded-NOTICE', notice) + out.slice(end);
    const stamp = '<!-- Frozen copy of CValR-Sketch v' + ver + ', saved ' + new Date().toISOString().slice(0, 10) +
      ' from ' + location.origin + location.pathname + '. Self-contained: open it from anywhere. Source and licence: https://github.com/CAA-EBV-CO-OP/CValRSketch -->\n';
    out = out.replace(/^(<!DOCTYPE html>\r?\n)/i, '$1' + stamp);
    if (!out.includes('Frozen copy of CValR-Sketch')) out = stamp + out;
    const name = 'CValR-Sketch-v' + ver + '.html';
    await saveBlob(new Blob([out], { type: 'text/html' }), name, 'text/html');
  } catch (e) {
    alert('Could not build the app copy: ' + e.message);
  }
}

    <p class="help-empty" hidden>Pick one or more topics above, or turn on <b>Follow</b> to see help for what you are doing.</p>
    <section data-topic="walk">
    <h4>Walk — typing walls</h4>
    <div class="help-do-row"><a href="#" class="help-do" data-do="walk">▶ Walk</a><a href="#" class="help-do" data-do="cmd">⌨ Segment box</a><a href="#" class="help-do" data-do="compass">🧭 Compass</a><a href="#" class="help-do" data-do="dictate">🎤 Dictate</a><a href="#" class="help-do" data-do="offset">↔ Start offset</a></div>
    <p><code>&lt;length&gt; &lt;dir&gt; [angle]</code> — length <code>16'4</code>, <code>3'6"</code>, <code>8</code>, <code>0.5</code>; direction <code>r l u d</code>.</p>
    <p><b>Angles:</b> after <code>r</code> / <code>l</code>, the angle is degrees turned from your previous heading — <code>r</code> turns right, <code>l</code> turns left. On the first wall, or with <code>u</code> / <code>d</code>, it is degrees clockwise from that direction.</p>
    <p><b>Several walls at once:</b> <code>16'4 u, 26'9 r, 8 d</code>. <b>One diagonal wall from its parts:</b> <code>5'd 2'l</code> or <code>5'd, 2'l</code>.</p>
    <p><b>Compass:</b> type a length, then click a direction on the compass (or pick it in the list) — the wall goes that way. Directions are absolute: up is the top of the drawing. Pick the direction first and Enter adds the wall the same way; <code>&#8592; &#8593; &#8594; &#8595;</code> still work for the four cardinals. The bracketed command in the list is what you would type or say. <i>Steps</i> switches between 8 and 16 directions.</p>
    <p><b>Start point:</b> click a green vertex to start there, or a blank spot; Shift+Arrow then steps the start onto aligned vertices. <i>Offset</i> nudges the start along a wall (or any direction) by a typed distance.</p>
    <p><b>Snap-to-vertex:</b> type just <code>r</code> (no length) + Enter to <i>preview</i> the next aligned vertex; <code>r</code>+Enter again cycles. Enter on an empty box accepts — and lines up the next snap in that direction, so <code>r⏎ ⏎ ⏎</code> walks three alignments right, then <code>u⏎ ⏎</code> two up. Esc stops stepping.</p>
    <p><b>Pen-jump:</b> with the box empty, <code>&#8592; &#8593; &#8594; &#8595;</code> <i>jumps</i> the pen to the next aligned vertex without drawing a wall; the same arrow again skips further. Enter accepts (and arms the next jump), Esc cancels.</p>
    <p><b>Closing:</b> walk back to the start and the shape offers to close (Enter takes it). Land on an existing wall and the area you have fenced off is offered instead. <i>Dictate</i> takes the same commands by voice.</p>
    </section>
    <section data-topic="edit">
    <h4>Edit</h4>
    <div class="help-do-row"><a href="#" class="help-do" data-do="edit">▶ Edit</a></div>
    <p>Click a <b>wall</b> to change its length, move it, bow it into a curve, or re-walk it (the shape reopens at that wall so you can type replacement legs). Click a <b>corner</b> to move or delete it, or <b>drag</b> it with the mouse: it snaps to other corners and to the inch, and hold <b>Ctrl</b> while dragging to square it up so its walls run exactly plumb or level. Click inside an <b>area</b> to change its label, type, floor, building or fill, copy it to a typed offset, or move it. Dimension and area labels drag to tidy spots.</p>
    </section>
    <section data-topic="split">
    <h4>Split</h4>
    <div class="help-do-row"><a href="#" class="help-do" data-do="split">▶ Split</a></div>
    <p>Click a first corner, then a second corner of the same area, and it is divided in two; both halves keep the label, type and floor. Or, after the first corner, type a direction (<code>r l u d</code>) to project from it to the first wall it hits, then confirm.</p>
    </section>
    <section data-topic="fence">
    <h4>Fence</h4>
    <div class="help-do-row"><a href="#" class="help-do" data-do="fence">▶ Fence</a></div>
    <p>Drag a rectangle on the canvas: corners inside it are captured. Type an offset and <i>Move</i> — walls with both ends captured move, walls crossing the fence stretch. <i>Delete fenced</i> (or Delete) removes whatever was captured whole: shapes, an unfinished walk, measurements.</p>
    </section>
    <section data-topic="text">
    <h4>Text</h4>
    <div class="help-do-row"><a href="#" class="help-do" data-do="text">▶ Text</a></div>
    <p>Click a blank spot to add a note. Click a note to select it, drag to move, double-click to edit; Delete removes it. Notes can run over several lines, and the first line can be a larger heading.</p>
    </section>
    <section data-topic="underlay">
    <h4>Image — trace over a scan</h4>
    <div class="help-do-row"><a href="#" class="help-do" data-do="image">▶ Image</a></div>
    <p>Load a scanned or photographed floor plan; it lies under the drawing. <b>Set the scale</b>: <i>Calibrate…</i>, click both ends of something whose real length you know — the plan's printed scale bar is most reliable — and type that length. Drag the image to line it up, then <i>Lock it in place</i>. <i>Fade</i> it and keep it to one floor. Then trace: <i>✎ Trace it — click the corners</i> (or the <i>Click corners</i> box in Walk) — click the start corner, then each corner in turn, with a magnifier to land exactly; click the start to close. Shift keeps a wall level or plumb. Or type the walls in Walk as usual. A finished area's fill hides the scan: tick <i>Show on top</i> to check a trace. The image is saved in the sketch file, never in an export, and not in Recent.</p>
    </section>
    <section data-topic="measure">
    <h4>📏 Measure</h4>
    <div class="help-do-row"><a href="#" class="help-do" data-do="measure">📏 Measure</a><a href="#" class="help-do" data-do="measurelist">Measurements list</a></div>
    <p>Click <b>📏 Measure</b> (or press M), then any two points. Clicks snap to corners, then walls; Alt places a free point, Shift keeps the line level or plumb. It stays on for the next one; Esc drops a half-made measurement, Esc again (or <i>Done measuring</i>) turns it off. Measurements belong to their floor; × in the sidebar list removes one.</p>
    </section>
    <section data-topic="floors">
    <h4>Floors and buildings</h4>
    <div class="help-do-row"><a href="#" class="help-do" data-do="floors">Floor tabs</a><a href="#" class="help-do" data-do="addfloor">+ Floor</a><a href="#" class="help-do" data-do="building">Building list</a><a href="#" class="help-do" data-do="addfiles">➕ Add files…</a></div>
    <p>The floor tabs switch floors (PageUp / PageDown cycle them; double-click a blank spot for a floor menu). Other floors show faded under the one you are on (Settings). The <i>Building</i> list shows one building or <i>All</i>, a gallery of every building; <i>Add files…</i> merges other sketches in as buildings.</p>
    </section>
    <section data-topic="basement">
    <h4>Basement</h4>
    <div class="help-do-row"><a href="#" class="help-do" data-do="basement">Basement panel</a></div>
    <p>The Basement panel declares a building's below-grade area and % finished. Its area follows the main floor unless you type one. When the basement you drew (or imported) differs from the main floor but the foundation you measured agrees with the walls above, <i>Match to main floor outline</i> — on the basement tab in Edit, or in the Basement panel — replaces the basement shape with a copy of the main floor's outline.</p>
    </section>
    <section data-topic="import">
    <h4>📐 Import PDF</h4>
    <div class="help-do-row"><a href="#" class="help-do" data-do="import">📐 Import PDF…</a></div>
    <p>An iGUIDE floor-plan PDF becomes the sketch: every floor traced from the drawing, the garage and other excluded rooms split off, decks and porches traced, floors stacked over the main floor. The dialog checks each floor against iGUIDE's stated area and flags placements to check. The PDF is read on your computer, never uploaded; it needs the hosted app or a local web server.</p>
    </section>
    <section data-topic="export">
    <h4>Export and saving</h4>
    <div class="help-do-row"><a href="#" class="help-do" data-do="export">🖨 Export / Preview</a><a href="#" class="help-do" data-do="save">Save</a><a href="#" class="help-do" data-do="saveas">Save As…</a><a href="#" class="help-do" data-do="recent">📂 Recent</a><a href="#" class="help-do" data-do="appcopy">💾 Save app copy</a></div>
    <p><i>Export / Preview</i> shows the printable sheet — page size, title, legend, floors side by side or one per building — and saves PNG or SVG. <i>Save</i> (Ctrl+S) / <i>Save As…</i> write the sketch file; in Chrome or Edge the file you saved or loaded is then autosaved after every change. <i>Recent</i> reopens sketches kept in this browser. <i>Save app copy</i> keeps a frozen copy of this version of the app beside a job.</p>
    </section>
    <section data-topic="keys">
    <h4>Keyboard</h4>
    <div class="help-do-row"><a href="#" class="help-do" data-do="undo">↶ Undo</a><a href="#" class="help-do" data-do="measure">📏 Measure</a></div>
    <p><code>Ctrl+Z</code> undo · <code>Ctrl+Y</code> / <code>Ctrl+Shift+Z</code> redo · <code>Ctrl+S</code> save · <code>M</code> measure · <code>F1</code> or <code>?</code> help · <code>PageUp</code> / <code>PageDown</code> floors · <code>Esc</code> cancel / deselect · mouse wheel or pinch zooms, middle-drag pans, <b>Fit</b> (bottom-left of the drawing) resets · <code>Delete</code> removes what the fence captured, or the selected note · Walk, box empty: arrows jump the pen; Shift+arrows step the start point.</p>
    </section>
    </div>`;
  document.body.appendChild(el);
  el.querySelector('.help-x').addEventListener('click', closeHelp);
  el.querySelectorAll('.help-nav a').forEach(a => a.addEventListener('click', ev => { ev.preventDefault(); toggleHelpChip(a); }));

  const bar = el.querySelector('.help-bar');
  bar.addEventListener('mousedown', ev => {
    if (ev.target.closest('button')) return;
    ev.preventDefault();

    }, 250); }).observe(el);

}

    </div>

      <span style="color:#555;">Show dimensions + notes for:</span>

      }).join('')}
